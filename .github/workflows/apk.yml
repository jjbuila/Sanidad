# Compila la APK de Android de Sanidad Vegetal (Capacitor) y la publica en Releases.
# Enlace fijo de descarga: https://github.com/jjbuila/Sanidad/releases/latest/download/SanidadVegetal.apk
# Secretos requeridos para la firma: SANIDAD_KEYSTORE_B64 (llave en base64) y SANIDAD_KEYSTORE_PASS (contraseña).
name: APK Android

on:
  push:
    branches: [main]
    paths: ['apk/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apk
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias y sincronizar Capacitor
        run: |
          npm ci || npm install
          npx cap sync android

      - name: Preparar llave de firma
        id: firma
        env:
          KS_B64: ${{ secrets.SANIDAD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SANIDAD_KEYSTORE_PASS }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/sanidad.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/sanidad.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=sanidadvegetal" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "firmada=si" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Sin secretos de firma: se compila una APK de prueba (debug) y no se publica en Releases."
            echo "firmada=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar APK firmada
        if: steps.firma.outputs.firmada == 'si'
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/SanidadVegetal.apk"

      - name: Compilar APK de prueba
        if: steps.firma.outputs.firmada != 'si'
        working-directory: apk/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/SanidadVegetal-prueba.apk"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SanidadVegetal-${{ env.VERSION_NAME }}
          path: ${{ github.workspace }}/SanidadVegetal*.apk

      - name: Publicar en Releases
        if: steps.firma.outputs.firmada == 'si'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ env.VERSION_NAME }}
          name: Sanidad Vegetal APK ${{ env.VERSION_NAME }}
          body: |
            APK de Android de Sanidad Vegetal (Palmas de Tumaco S.A.S.).
            Instalar desde el celular: https://github.com/jjbuila/Sanidad/releases/latest/download/SanidadVegetal.apk
          files: ${{ github.workspace }}/SanidadVegetal.apk
          make_latest: true
