function geoJornada(j,regs,pts,ahora,archivoFotos){
  const sel=regs.map(r=>({...r,sync:'sincronizado',sync_fecha:ahora}));
  const feats=sel.filter(r=>r.lat!=null).map(r=>{const f=featReg(r);f.properties={tipo:'diagnostico',...f.properties};return f;});
  if(pts.length)feats.push({type:'Feature',properties:{tipo:'recorrido',jornada_id:j.id,evaluador:j.evaluador,inicio:j.inicio,fin:j.fin,km:+(j.km||0).toFixed(3),
    n_puntos:pts.length,tiempos:pts.map(p=>new Date(p.t).toISOString()),precision_m:pts.map(p=>p.acc)},
    geometry:pts.length>1?{type:'LineString',coordinates:pts.map(p=>[p.lng,p.lat])}:{type:'Point',coordinates:[pts[0].lng,pts[0].lat]}});
  return {type:'FeatureCollection',name:'jornada_'+j.id,
    jornada:{id:j.id,evaluador:j.evaluador,usuario:j.usuario||'',dispositivo:j.dispositivo||S.cfg.dispositivo,fecha:fechaLocal(j.inicio),
      hora_inicio:hhmm(j.inicio),hora_fin:hhmm(j.fin),duracion_min:j.fin?Math.round((Date.parse(j.fin)-Date.parse(j.inicio))/60000):null,inicio:j.inicio,fin:j.fin,
      km:+(j.km||0).toFixed(3),...(j.visita||{}),lotes_seleccionados:j.seleccion,diagnosticos:regs.length,puntos_recorrido:pts.length,fotos:regs.reduce((a,r)=>a+(r.fotos||[]).length,0),
      archivo_fotos:archivoFotos||null,cartografia:j.carto_version||'',app:'Sanidad Vegetal '+VERSION,sincronizado:ahora},
    features:feats};
}
async function sincronizar(manual){
  if(SYNC.activo)return;
  if(!S.cfg.gh.token){if(manual)toast('Inicie sesión para sincronizar.');return;}
  if(!navigator.onLine){if(manual)toast('Sin conexión a internet.');estadoSync();return;}
  if(Date.now()<SYNC.pausaHasta){if(manual)toast(`GitHub pidió esperar. Se reintentará a las ${fmtHora(SYNC.pausaHasta).slice(0,5)}.`,4000);programarSync(SYNC.pausaHasta-Date.now()+1000);estadoSync();return;}
  if(!manual&&!redPermitida()){estadoSync();return;}
  const lista=await jornadasPorSincronizar();
  if(!lista.length){SYNC.turno=0;estadoSync();if(manual)toast(S.jornada?'La jornada en curso se sincronizará completa al finalizarla.':'✓ Todo está sincronizado.',3500);return;}
  if(manual&&!redPermitida()&&!confirm('No está conectado a WiFi. ¿Desea sincronizar usando datos móviles?'))return;
  if(!manual){ // escalonamiento: cada celular espera un turno aleatorio (0 a 10 min) para no coincidir con los demás
    if(!SYNC.turno){SYNC.turno=Date.now()+Math.random()*10*60000;estadoSync();programarSync(SYNC.turno-Date.now());return;}
    if(Date.now()<SYNC.turno){programarSync(SYNC.turno-Date.now());return;}
  }
  SYNC.activo=true;estadoSync();let n=0,nd=0;
  try{
    for(const j of lista){
      const regs=S.registros.filter(r=>r.jornada_id===j.id);const pts=await puntosTrack(j.id);
      if(!j.visita){const E=await calcularVisita(pts,j.densidad,j.buffer);j.visita=resumenVisita(E,regs,true);}
      const ahora=new Date().toISOString();const base=`jornadas/${fechaLocal(j.inicio)}/${j.id}`;
      const archivos=[];let nombreZip=null;
      const ids=regs.flatMap(r=>r.fotos||[]);
      if(ids.length){const z=new JSZip();for(const fid of ids){const f=await dbGet('fotos',fid);if(f)z.file(fid+'.jpg',f.buf);}
        nombreZip=j.id+'_fotos.zip';archivos.push({path:`jornadas/${fechaLocal(j.inicio)}/${nombreZip}`,b64:aB64(await z.generateAsync({type:'uint8array',compression:'STORE'}))});}
      archivos.unshift({path:base+'.geojson',texto:JSON.stringify(geoJornada(j,regs,pts,ahora,nombreZip))});
      const sha=await ghCommit(archivos,`Sanidad Vegetal · ${j.evaluador} · jornada ${fechaLocal(j.inicio)} · ${regs.length} diagnóstico(s)`);
      regs.forEach(r=>{r.sync='sincronizado';r.sync_fecha=ahora;r.sync_commit=sha;});if(regs.length)await dbPutVarios('registros',regs);
      pts.forEach(p=>p.s=1);if(pts.length)await dbPutVarios('track',pts);
      j.sync='sincronizado';j.sync_fecha=ahora;j.sync_commit=sha;await dbPut('jornadas',j);
      n++;nd+=regs.length;
    }
    SYNC.ultimo=SYNC.ultimoCommit=Date.now();SYNC.error=null;SYNC.fallos=0;SYNC.turno=0;
  }catch(e){
    SYNC.error=e.message;SYNC.fallos++;
    const espera=e.limite?(e.esperaSeg||60*Math.min(30,2**SYNC.fallos)):60*Math.min(30,2**SYNC.fallos);
    SYNC.pausaHasta=Date.now()+espera*1000;programarSync(espera*1000+Math.random()*30000);
    if(manual)alert('No se pudo completar la sincronización:\n'+e.message+(n?`\n\nSe alcanzaron a enviar ${n} jornada(s).`:''));
  }finally{
    SYNC.activo=false;
    if(n){S.registros=await dbAll('registros');recalcUltimo();toast(`✅ ${n} jornada(s) sincronizada(s) con GitHub: ${nd} diagnóstico(s) bloqueados.`,4500);}
    estadoSync();refrescarBD();
  }
}
function estadoSync(){
  const b=$('#chSync');const pend=S.registros.filter(r=>r.sync!=='sincronizado').length;
  if(SYNC.activo){b.className='chip gira';b.innerHTML=IC.sync+'<span>Sync…</span>';return;}
  if(Date.now()<SYNC.pausaHasta&&pend){b.className='chip med';b.innerHTML='<span class="led"></span>'+`<span>Espera ${pend}</span>`;return;}
  if(!S.cfg.gh.token){b.className='chip mal';b.innerHTML='<span class="led"></span><span>Sin sesión</span>';return;}
  if(SYNC.error){b.className='chip mal';b.innerHTML=IC.alerta+`<span>${pend||'!'}</span>`;return;}
  if(pend){b.className='chip pend';b.innerHTML=IC.nube+`<span>${pend}</span>`;return;}
  b.className='chip ok';b.innerHTML='<span class="led"></span><span>Al día</span>';
}

function aCSV(cab,filas){const q=v=>{v=v==null?'':String(v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};return [cab.map(q).join(';'),...filas.map(f=>f.map(q).join(';'))].join('\r\n');}
function csvRegs(rs){if(!rs.length)return '\ufeff';const cab=Object.keys(planos(rs[0]));return '\ufeff'+aCSV(cab,rs.map(r=>{const o=planos(r);return cab.map(k=>o[k]);}));}
function descargar(blob,nombre){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);}
async function compartir(blob,nombre){
  try{const file=new File([blob],nombre,{type:blob.type||'application/octet-stream'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:nombre});return;}}
  catch(e){if(e.name==='AbortError')return;}descargar(blob,nombre);
}
async function zipCompleto(){
  const z=new JSZip();const rs=S.registros;
  z.file('registros.geojson',JSON.stringify({type:'FeatureCollection',features:rs.filter(r=>r.lat!=null).map(featReg)}));
  z.file('registros.csv',csvRegs(rs));
  const js=await dbAll('jornadas');const lineas=[];
  for(const j of js){const pts=await puntosTrack(j.id);lineas.push(...geoRecorrido(j,pts).features);}
  z.file('recorridos.geojson',JSON.stringify({type:'FeatureCollection',features:lineas}));
  z.file('jornadas.json',JSON.stringify(js,null,1));
  const filasJL=[];for(const j of js){const v=j.visita;if(!v)continue;for(const x of v.por_lote)filasJL.push([j.id,fechaLocal(j.inicio),j.evaluador,hhmm(j.inicio),hhmm(j.fin),(j.km||0).toFixed(3),x.lote,x.palmas_visitadas,x.palmas_existentes,x.sitios_vacios,x.ha,x.diagnosticos]);}
  z.file('jornadas_por_lote.csv','\ufeff'+aCSV(['jornada_id','fecha','evaluador','hora_inicio','hora_fin','km_jornada','lote','palmas_visitadas','palmas_existentes','sitios_vacios','ha_recorridas','diagnosticos'],filasJL));
  for(const r of rs)for(const fid of (r.fotos||[])){const f=await dbGet('fotos',fid);if(f)z.file('fotos/'+fid+'.jpg',f.buf);}
  return await z.generateAsync({type:'blob',compression:'DEFLATE'});
}

const lon2x=(l,z)=>Math.floor((l+180)/360*2**z);
const lat2y=(a,z)=>{const r=a*Math.PI/180;return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*2**z);};
async function guardarZona(){
  if(!('caches' in window)){alert('Esta función requiere abrir la aplicación desde su dirección https.');return;}
  const url=urlBase();if(!url){alert('Seleccione primero un mapa base.');return;}
  if(!navigator.onLine){alert('Necesita conexión a internet para descargar el mapa.');return;}
  const b=mapa.getBounds(),z0=Math.max(13,mapa.getZoom()),zTope=S.cfg.base==='propia'?Number(S.cfg.zmaxPropia||20):19,z1=Math.min(zTope,z0+3);
  const L1=[];for(let z=z0;z<=z1;z++){const xa=lon2x(b.getWest(),z),xb=lon2x(b.getEast(),z),ya=lat2y(b.getNorth(),z),yb=lat2y(b.getSouth(),z);
    for(let x=xa;x<=xb;x++)for(let y=ya;y<=yb;y++)L1.push(url.replace('{z}',z).replace('{x}',x).replace('{y}',y).replace('{s}','a'));}
  const MAX=S.cfg.base==='propia'?20000:2500;
  if(L1.length>MAX){alert(`La zona visible requiere ${L1.length} teselas (máximo ${MAX}). Acerque más el mapa.`);return;}
  if(!confirm(`Se descargarán ${L1.length} teselas (zoom ${z0} a ${z1}) para usar sin conexión. ¿Continuar?`))return;
  const c=await caches.open('teselas-v1');let ok=0,fal=0,i=0;
  const trab=async()=>{while(i<L1.length){const u=L1[i++];try{if(await c.match(u)){ok++;continue;}const r=await fetch(u,{mode:'cors'});if(r.ok){await c.put(u,r);ok++;}else fal++;}catch(e){fal++;}
    if((ok+fal)%50===0)toast(`Descargando mapa… ${ok+fal}/${L1.length}`,4000);}};
  await Promise.all(Array.from({length:6},trab));toast(`Mapa guardado: ${ok} teselas${fal?` (${fal} fallidas)`:''}.`,5000);
}

    for(const s of ['registros','fotos','jornadas','track'])await dbClear(s);S.registros=[];recalcUltimo();estadoSync();cerrarHoja();toast('Datos borrados del dispositivo.');});
}
async function infoAlmacen(){
  let t='';try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();t=`Espacio usado: ${(e.usage/1048576).toFixed(1)} MB de ${(e.quota/1048576).toFixed(0)} MB.`;}
    if(navigator.storage&&navigator.storage.persisted)t+=(await navigator.storage.persisted())?' Almacenamiento protegido ✔':' Instale la app para proteger el almacenamiento.';}catch(e){}
  return t;
}
/* =====================================================================
   ACCESO CIFRADO, INGRESO Y SESIÓN
   El token de GitHub y la cartografía viajan cifrados (AES-256-GCM) en
   datos/acceso.json y datos/carto.enc. La contraseña de cada usuario
   (PBKDF2-SHA256) descifra en el dispositivo la llave de datos.
   ===================================================================== */
const ENC=new TextEncoder(),DEC=new TextDecoder();
const deB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let ACCESO=null,SES=null;
async function kekDe(clave,salt,iter){const base=await crypto.subtle.importKey('raw',ENC.encode(clave),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);}
async function aesDes(llave,iv,ct){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},llave,ct));}
const desObj=(llave,o)=>aesDes(llave,deB64(o.iv),deB64(o.ct));
async function cargarAcceso(){
  let a=null;
  try{const r=await fetch('datos/acceso.json',{cache:'no-store'});if(r.ok){const j=await r.json();if(j.formato==='sanidad-acceso-1')a=j;}}catch(e){}
  if(a)await dbPut('config',{clave:'acceso',v:a});
  else{const r=await dbGet('config','acceso');a=r?r.v:null;}
  ACCESO=a;return a;
}
async function llaveDispositivo(){
  const r=await dbGet('config','llaveDisp');if(r&&r.v)return r.v;
  const k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  await dbPut('config',{clave:'llaveDisp',v:k});return k;
}
async function abrirSesion(u,dkRaw,guardar){
  const e=ACCESO.usuarios.find(x=>x.u===u);if(!e)throw new Error('El usuario ya no está autorizado.');
  const dk=await crypto.subtle.importKey('raw',dkRaw,{name:'AES-GCM'},false,['decrypt']);
  const meta=JSON.parse(DEC.decode(await desObj(dk,e.meta)));
  const token=DEC.decode(await desObj(dk,ACCESO.token));
  SES={u,nombre:meta.nombre,rol:meta.rol||'operario',dk};
  S.cfg.gh={...ACCESO.repo,token};S.cfg.evaluador=meta.nombre;
  if(guardar){const k=await llaveDispositivo();const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,ENC.encode(JSON.stringify({u,dk:aB64(dkRaw),paquete:ACCESO.id})));
    await dbPut('config',{clave:'sesion',v:{iv,ct}});}
}
async function restaurarSesion(){
  const r=await dbGet('config','sesion');if(!r||!ACCESO)return false;
  try{const k=await llaveDispositivo();const p=JSON.parse(DEC.decode(await aesDes(k,r.v.iv,r.v.ct)));
    if(p.paquete!==ACCESO.id||!ACCESO.usuarios.some(x=>x.u===p.u)){await dbDel('config','sesion');return false;}
    await abrirSesion(p.u,deB64(p.dk),false);return true;}
  catch(e){return false;}
}
async function ingresar(usuario,clave){
  const u=usuario.trim().toLowerCase();const e=ACCESO.usuarios.find(x=>x.u===u);
  const kek=await kekDe(clave,deB64(e?e.salt:'AAAAAAAAAAAAAAAAAAAAAA=='),ACCESO.kdf.iter);
  if(!e)throw new Error('Usuario o contraseña incorrectos.');
  let dkRaw;try{dkRaw=await aesDes(kek,deB64(e.iv),deB64(e.ct));}catch(_){throw new Error('Usuario o contraseña incorrectos.');}
  await abrirSesion(u,dkRaw,true);
}
let intentos=0,bloqueoHasta=0,resolverLogin=null;
function mostrarLogin(msg){
  const L1=$('#login');L1.hidden=false;$('#lgMsg').textContent=msg||'';$('#lgMsg').style.color=msg?'var(--ambar)':'';
  $('#lgRed').textContent=navigator.onLine?'En línea':'Sin conexión: el ingreso funciona igual, se verifica en este dispositivo.';
  $('#lgOk').disabled=!ACCESO;if(ACCESO)setTimeout(()=>$('#lgUsuario').focus(),300);
  return new Promise(r=>{resolverLogin=r;});
}
$('#lgVer').onclick=()=>{const i=$('#lgClave');i.type=i.type==='password'?'text':'password';};
$('#frmLogin').onsubmit=async e=>{
  e.preventDefault();const m=$('#lgMsg'),b=$('#lgOk');
  if(Date.now()<bloqueoHasta){m.style.color='var(--rojo)';m.textContent=`Demasiados intentos. Espere ${Math.ceil((bloqueoHasta-Date.now())/1000)} s.`;return;}
  b.disabled=true;b.textContent='VERIFICANDO…';m.textContent='';
  try{await ingresar($('#lgUsuario').value,$('#lgClave').value);intentos=0;$('#lgClave').value='';$('#login').hidden=true;
    if(resolverLogin){const r=resolverLogin;resolverLogin=null;r();}}
  catch(err){intentos++;if(intentos>=5){bloqueoHasta=Date.now()+30000;intentos=0;}m.style.color='var(--rojo)';m.textContent=err.message;}
  finally{b.disabled=false;b.textContent='INGRESAR';}
};
async function cerrarSesion(){
  if(S.jornada){alert('Finalice la jornada en curso antes de cerrar la sesión.');return;}
  const pend=S.registros.filter(r=>r.sync!=='sincronizado').length;
  if(!confirm(`¿Cerrar la sesión de ${SES.nombre}?`+(pend?`\n\nHay ${pend} diagnóstico(s) pendientes: se sincronizarán cuando ingrese cualquier usuario con WiFi.`:'')))return;
  await dbDel('config','sesion');SES=null;S.cfg.gh={...S.cfg.gh,token:''};estadoSync();cerrarHoja();
  await mostrarLogin();await despuesDeIngresar();
}
async function asegurarCartografia(){
  const c=ACCESO&&ACCESO.carto;if(!c)return;
  if(S.lotes&&CARTO.paquete===c.version)return;
  avance('Descargando y descifrando la cartografía…');
  let buf;
  try{const r=await fetch('datos/'+(c.archivo||'carto.enc'));if(!r.ok)throw new Error();buf=new Uint8Array(await r.arrayBuffer());}
  catch(e){if(S.lotes){toast('Hay una cartografía nueva; se cargará cuando abra la app con internet.',5000);return;}throw new Error('No se pudo obtener la cartografía. Abra la aplicación con internet la primera vez.');}
  if(DEC.decode(buf.slice(0,4))!=='SPC1')throw new Error('El archivo de cartografía no es válido.');
  const plano=await aesDes(SES.dk,buf.slice(4,16),buf.slice(16));
  const z=await JSZip.loadAsync(plano);
  await procesarCartografia(await z.file('lotes.geojson').async('string'),await z.file('palmas.zip').async('arraybuffer'),{origen:'Paquete cifrado de la app',paquete:c.version});
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
(async function iniciar(){
  pintarLeyenda();
  if(!window.crypto||!crypto.subtle){$('#splashMsg').textContent='Abra la aplicación desde su dirección https para poder ingresar.';return;}
  try{await abrirDB();}catch(e){alert('No fue posible abrir el almacenamiento local: '+e.message);return;}
  const c=await dbGet('config','cfg');if(c)S.cfg={...S.cfg,...c.v,gh:{...S.cfg.gh,...(c.v.gh||{}),token:''}};
  if(!S.cfg.dispositivo)S.cfg.dispositivo='DISP-'+uid().slice(0,8).toUpperCase();
  await guardarCfg();
  avance('Verificando acceso…');await cargarAcceso();
  const ca=await dbGet('config','carto');if(ca)CARTO=ca.v;
  const l=await dbGet('capas','lotes');if(l){S.lotes=l.fc;cajasLotes();}
  S.registros=await dbAll('registros');recalcUltimo();
  ponerBase();dibujarLotes();if(S.lotes)encuadrar();estadoSync();
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  const ok=ACCESO?await restaurarSesion():false;
  if(!ok){ocultarSplash();await mostrarLogin(ACCESO?'':'Esta aplicación aún no tiene paquete de acceso. Abra la app con internet o contacte al administrador.');}
  await despuesDeIngresar();
})();
async function despuesDeIngresar(){
  mostrarSplash();
  try{await asegurarCartografia();}catch(e){alert(e.message);}
  dibujarLotes();
  if(S.cfg.jornadaActiva){const j=await dbGet('jornadas',S.cfg.jornadaActiva);
    if(j&&j.estado==='activa'){
      if(j.usuario&&SES&&j.usuario!==SES.u){
        if(confirm(`Hay una jornada en curso de ${j.evaluador}. Para trabajar como ${SES.nombre} debe finalizarse. ¿Finalizarla ahora?`)){
          j.fin=new Date().toISOString();j.estado='finalizada';j.sync='pendiente';await dbPut('jornadas',j);S.cfg.jornadaActiva=null;await guardarCfg();}
        else{ocultarSplash();await dbDel('config','sesion');SES=null;S.cfg.gh={...S.cfg.gh,token:''};await mostrarLogin('Ingrese con el usuario '+j.usuario+' para continuar su jornada.');return despuesDeIngresar();}
      }else{S.jornada=j;const pts=await puntosTrack(j.id);TRACK.ultimo=pts[pts.length-1]||null;TRACK.n=pts.length;prepararTrack(pts.map(p=>[p.lat,p.lng]));
        VIS=await calcularVisita(pts,j.densidad,j.buffer);
        await cargarPalmasJornada();pantallaEncendida(true);toast('Jornada en curso recuperada. El recorrido continúa.',4000);}}
    else{S.cfg.jornadaActiva=null;await guardarCfg();}}
  actualizarJornadaUI();estadoSync();dibujarLotes();
  if(S.jornada)encuadrar(S.jornada.seleccion.map(s=>s.lote));else encuadrar();
  iniciarGPS();ocultarSplash();
  if(SES)toast(`Bienvenido, ${SES.nombre}.`);
  programarSync(5000);
}
