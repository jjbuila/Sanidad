<style>
:root{
  --verde:#1b4d2e; --verde2:#2e7d4f; --crema:#f6f3ea; --tinta:#1d241f; --tenue:#66706a;
  --borde:#d9d4c5; --rojo:#c62828; --naranja:#ef6c00; --azul:#1565c0; --blanco:#fff;
  --sombra:0 6px 24px rgba(0,0,0,.18);
  --sup:env(safe-area-inset-top,0px); --inf:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tinta);background:var(--crema);overscroll-behavior:none}
button,input,select,textarea{font:inherit}
#barra{position:fixed;top:0;left:0;right:0;height:calc(54px + var(--sup));padding:var(--sup) 10px 0 14px;background:var(--verde);color:#fff;display:flex;align-items:center;gap:10px;z-index:1000;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#barra .tit{flex:1;min-width:0;line-height:1.15}
#barra .tit b{display:block;font-size:17px;letter-spacing:.2px}
#barra .tit small{display:block;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.16);white-space:nowrap}
.pill.off{background:#b26a00}
.icono{background:transparent;border:0;color:inherit;font-size:24px;width:44px;height:44px;border-radius:10px;cursor:pointer}
.icono:active{background:rgba(255,255,255,.15)}
#mapa{position:fixed;top:calc(54px + var(--sup));bottom:calc(66px + var(--inf));left:0;right:0;background:#cfd8cf}
#acciones{position:fixed;left:0;right:0;bottom:0;height:calc(66px + var(--inf));padding:6px 6px var(--inf);background:#fff;border-top:1px solid var(--borde);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;z-index:1000}
#acciones button{border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--tinta);cursor:pointer;padding:0 2px;line-height:1.1}
#acciones button span{font-size:22px;line-height:1}
#acciones button:active,#acciones button.activo{background:#e7efe9;color:var(--verde)}
#leyendaBtn{position:fixed;left:10px;bottom:calc(76px + var(--inf) + 30px);z-index:900;border:0;background:#fff;border-radius:10px;padding:8px 10px;box-shadow:var(--sombra);font-size:13px;cursor:pointer}
#leyenda{position:fixed;left:10px;bottom:calc(76px + var(--inf) + 72px);z-index:900;background:#fff;border-radius:12px;padding:10px 12px;box-shadow:var(--sombra);font-size:13px;display:none}
#leyenda.ver{display:block}
#leyenda div{display:flex;align-items:center;gap:8px;margin:3px 0}
.punto{width:14px;height:14px;border-radius:50%;border:1px solid #000;display:inline-block;flex:none}
/* Hoja inferior (panel) */
#hoja{position:fixed;left:0;right:0;bottom:calc(66px + var(--inf));max-height:calc(100vh - 140px - var(--sup) - var(--inf));background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);z-index:2000;display:flex;flex-direction:column;transition:transform .22s ease}
#hoja.oculto{transform:translateY(calc(100% + 80px))}
@media (min-width:900px){#hoja{left:auto;right:12px;bottom:12px;top:calc(66px + var(--sup));width:440px;max-height:none;border-radius:16px}#hoja.oculto{transform:translateX(110%)}}
.hoja-cab{display:flex;align-items:center;gap:8px;padding:12px 10px 8px 16px;border-bottom:1px solid #eee}
.hoja-cab h2{flex:1;margin:0;font-size:17px}
.hoja-cab .icono{color:var(--tinta);font-size:20px}

.tenue{color:var(--tenue);font-size:13px}

.btn.prim{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.peligro{color:var(--rojo);border-color:#efc4c4}

.menu-item span{font-size:20px;width:28px;text-align:center}
.menu-item:active{background:#f3f6f3}

label.campo i{color:var(--rojo);font-style:normal}
input[type=text],input[type=number],input[type=datetime-local],input[type=url],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--borde);border-radius:10px;background:#fff;font-size:15px}
textarea{min-height:80px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--borde);border-radius:999px;font-size:13.5px;cursor:pointer;background:#fff;user-select:none}
.chip input:checked+span{background:var(--verde);border-color:var(--verde);color:#fff}
.chip input:focus-visible+span{outline:2px solid var(--azul)}
.ficha{background:var(--crema);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.55}
.coord{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--tenue)}
.tarjeta{border:1px solid #eee;border-left:6px solid #999;border-radius:10px;padding:9px 11px;margin:7px 0;cursor:pointer;font-size:13.5px;background:#fff}
.tarjeta:active{background:#f6f6f6}

.fotos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.foto{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:#eee}
.foto img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.foto button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}

table.res th{background:var(--crema);position:sticky;top:0}
.aviso{background:#fff7e0;border:1px solid #f1d58a;border-radius:10px;padding:9px 11px;font-size:13px;margin:8px 0}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--inf));transform:translate(-50%,20px);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:3000;max-width:90vw;text-align:center}
#toast.ver{opacity:1;transform:translate(-50%,0)}
#visor{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:4000;display:none;align-items:center;justify-content:center}
#visor.ver{display:flex}
#visor img{max-width:100%;max-height:100%}
.etq-lote{background:rgba(0,0,0,.55);color:#fff;border:0;box-shadow:none;font-weight:700;font-size:12px;padding:2px 6px}
.etq-lote:before{display:none}
.sin-etiquetas .etq-lote{display:none}
.etq-lote.trabajo{background:#c79a00}
.leaflet-container{font:inherit}
#guia{position:fixed;top:calc(62px + var(--sup));left:10px;right:64px;z-index:950;display:none;align-items:center;gap:10px;background:#37474f;color:#fff;border-radius:14px;padding:8px 8px 8px 14px;box-shadow:var(--sombra);cursor:pointer}
#guia.cerca{background:#1b5e20}
#guia.mala{background:#b26a00}
#guia .txt{flex:1;min-width:0}
#guiaTxt{font-size:22px;font-weight:800;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#guiaSub{font-size:12.5px;opacity:.9}
#guiaRepetir{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:10px;width:44px;height:44px;font-size:20px;cursor:pointer;flex:none}
#avisoZoom{position:fixed;bottom:calc(120px + var(--inf));left:50%;transform:translateX(-50%);z-index:900;background:rgba(27,77,46,.92);color:#fff;padding:7px 14px;border-radius:999px;font-size:13px;display:none;pointer-events:none;white-space:nowrap}
</style>

<script>
'use strict';
/* =====================================================================
   SANIDAD PALMA — Aplicación sin conexión para diagnóstico fitosanitario
   de palma de aceite sobre lotes (polígonos) y palmas (puntos).
   ===================================================================== */
const VERSION='1.3.0';

/* ---------- Catálogos del formulario (ajústelos a su protocolo) ---------- */
const ESTADOS=[
  {id:'sana',n:'Sana',c:'#2e7d32'},
  {id:'enferma',n:'Enferma',c:'#d32f2f'},
  {id:'tratamiento',n:'En tratamiento / recuperación',c:'#ef6c00'},
  {id:'muerta',n:'Muerta',c:'#212121'},
  {id:'erradicada',n:'Erradicada',c:'#8d8d8d'},
  {id:'faltante',n:'Sitio vacío / faltante',c:'#ffffff'},
  {id:'resiembra',n:'Resiembra',c:'#1e88e5'}
];
const SIN_EVALUAR='#fdd835';
const PROBLEMAS=[
  {id:'PC',n:'Pudrición del cogollo (PC)'},
  {id:'ML',n:'Marchitez letal (ML)'},
  {id:'AR',n:'Anillo rojo'},
  {id:'MS',n:'Marchitez sorpresiva'},
  {id:'PE',n:'Pudrición del estípite'},
  {id:'PB',n:'Pudrición basal'},
  {id:'RP',n:'Rhynchophorus palmarum (picudo)'},
  {id:'SA',n:'Strategus aloeus'},
  {id:'LG',n:'Leptopharsa / Pestalotiopsis'},
  {id:'OC',n:'Opsiphanes cassina'},
  {id:'SV',n:'Sagalassa valida'},
  {id:'DF',n:'Otros defoliadores'},
  {id:'RT',n:'Daño por roedores'},
  {id:'DN',n:'Deficiencia nutricional'},
  {id:'OT',n:'Otro'}
];
const SINTOMAS=[
  'Pudrición en flecha','Flechas acumuladas','Clorosis foliar','Secamiento de hojas bajeras',
  'Hojas partidas / dobladas','Racimos podridos','Galerías u orificios','Exudados',
  'Lesiones en estípite','Raíces afectadas','Defoliación'
];
const ACCIONES=[
  'Ninguna','Seguimiento','Cirugía / saneamiento','Aplicación de producto',
  'Erradicación','Trampeo','Fertilización correctiva','Resiembra','Otra'
];

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const estadoDe=id=>ESTADOS.find(e=>e.id===id);
const probDe=id=>PROBLEMAS.find(p=>p.id===id);
function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.classList.add('ver');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('ver'),ms);}
function ahoraLocal(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16);}
function fechaCorta(s){if(!s)return'';return s.replace('T',' ').slice(0,16);}
function dist(a,b,c,d){const R=6371000,r=Math.PI/180;const dl=(c-a)*r,dg=(d-b)*r;const h=Math.sin(dl/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function hoyArchivo(){return new Date().toISOString().slice(0,10);}

/* ---------- Almacenamiento local (IndexedDB) ---------- */
const DB={db:null};
function abrirDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open('sanidad_palma',2);
  r.onupgradeneeded=()=>{const d=r.result;
    if(!d.objectStoreNames.contains('capas'))d.createObjectStore('capas',{keyPath:'id'});
    if(!d.objectStoreNames.contains('registros')){const s=d.createObjectStore('registros',{keyPath:'id'});s.createIndex('palma','palma_id');}
    if(!d.objectStoreNames.contains('fotos'))d.createObjectStore('fotos',{keyPath:'id'});
    if(!d.objectStoreNames.contains('config'))d.createObjectStore('config',{keyPath:'clave'});
    if(!d.objectStoreNames.contains('palmas_lote'))d.createObjectStore('palmas_lote',{keyPath:'lote'});
  };
  r.onsuccess=()=>{DB.db=r.result;res();};
  r.onerror=()=>rej(r.error);
});}
function op(store,mode,fn){return new Promise((res,rej)=>{
  const t=DB.db.transaction(store,mode);const q=fn(t.objectStore(store));
  t.oncomplete=()=>res(q?q.result:undefined);t.onerror=t.onabort=()=>rej(t.error);
});}
const dbGet=(s,k)=>op(s,'readonly',o=>o.get(k));
const dbAll=s=>op(s,'readonly',o=>o.getAll());
const dbPut=(s,v)=>op(s,'readwrite',o=>o.put(v));
const dbDel=(s,k)=>op(s,'readwrite',o=>o.delete(k));
const dbClear=s=>op(s,'readwrite',o=>o.clear());

/* ---------- Estado de la aplicación ---------- */
const S={
  lotes:null, palmas:null, idx:new Map(), registros:[], ultimo:new Map(), marcadores:new Map(),
  gps:null, seguir:false,
  cfg:{evaluador:'',finca:'',base:'esri',urlPropia:'teselas/{z}/{x}/{y}.png',zmaxPropia:20,umbralVoz:4,precisionVoz:15,velocidadVoz:1,lotesTrabajo:[]}
};
async function guardarCfg(){await dbPut('config',{clave:'cfg',v:S.cfg});actualizarCab();}

/* ---------- Mapa ---------- */
const mapa=L.map('mapa',{preferCanvas:true,zoomControl:false,maxZoom:22}).setView([1.75,-78.7],11);
L.control.zoom({position:'topright'}).addTo(mapa);
L.control.scale({imperial:false,position:'bottomleft'}).addTo(mapa);
const rend=L.canvas({padding:.5,tolerance:8});
const capaLotes=L.layerGroup().addTo(mapa);
const capaPalmas=L.layerGroup().addTo(mapa);
const capaGps=L.layerGroup().addTo(mapa);
let resalte=null;
const BASES={
  esri:{n:'Satélite (Esri World Imagery)',url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',a:'Imágenes © Esri',max:19},
  osm:{n:'Calles (OpenStreetMap)',url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',a:'© colaboradores de OpenStreetMap',max:19},
  propia:{n:'Ortofoto propia (teselas XYZ)',url:'',a:'Ortofoto propia',max:20},
  ninguna:{n:'Sin mapa base (solo capas)',url:''}
};
let capaBase=null;
function urlBase(){return S.cfg.base==='propia'?S.cfg.urlPropia:(BASES[S.cfg.base]||{}).url;}
function ponerBase(){
  if(capaBase){mapa.removeLayer(capaBase);capaBase=null;}
  const b=BASES[S.cfg.base]||BASES.esri;const url=urlBase();if(!url)return;
  const zmax=S.cfg.base==='propia'?Number(S.cfg.zmaxPropia||20):b.max;
  capaBase=L.tileLayer(url,{maxZoom:22,maxNativeZoom:zmax,attribution:b.a,crossOrigin:true}).addTo(mapa);
  capaBase.bringToBack();
}
function radioPalma(){const z=mapa.getZoom();return z>=20?10:z>=19?8:z>=18?6:z>=17?4.5:z>=16?3:z>=15?2:1.4;}
mapa.on('moveend',()=>{mapa.getContainer().classList.toggle('sin-etiquetas',mapa.getZoom()<14);dibujarPalmas();if(resalte)resalte.setRadius(radioPalma()+6);});
mapa.on('dragstart',()=>{if(S.seguir){S.seguir=false;$('#btGps').classList.remove('activo');}});
mapa.on('contextmenu',e=>{ // pulsación larga en el celular
  if(confirm('¿Desea registrar una palma nueva en este punto del mapa?'))abrirFormulario({nueva:{lat:e.latlng.lat,lng:e.latlng.lng}});
});

function estiloPalma(f){
  const u=S.ultimo.get(f.properties._id);
  if(!u&&f.properties._existe===false)return {fillColor:'#ffffff',fillOpacity:.15,color:'#9e9e9e',weight:1};
  return {fillColor:u?((estadoDe(u.estado)||{}).c||SIN_EVALUAR):SIN_EVALUAR,fillOpacity:.95,color:'#222',weight:1};
}
function dibujarLotes(){
  capaLotes.clearLayers();if(!S.lotes)return;
  L.geoJSON(S.lotes,{renderer:rend,
    style:f=>esDeTrabajo(f.properties._lote)?{color:'#ffd600',weight:3,fillColor:'#ffd600',fillOpacity:.08}:{color:'#ffffff',weight:1,opacity:.7,dashArray:'4 4',fillColor:'#000',fillOpacity:.12},
    onEachFeature:(f,l)=>{
      l.bindTooltip(String(f.properties._lote??''),{permanent:true,direction:'center',className:'etq-lote'+(esDeTrabajo(f.properties._lote)?' trabajo':'')});
      l.on('click',()=>{if(mapa.getZoom()<17||!esDeTrabajo(f.properties._lote))resumenLote(f.properties._lote);});
    }}).addTo(capaLotes);
}
/* Solo se dibujan las palmas de la zona visible: permite trabajar con decenas de miles de puntos. */
function zMinPalmas(){return (S.palmas&&S.palmas.features.length>8000)?17:0;}
function dibujarPalmas(){
  capaPalmas.clearLayers();S.marcadores.clear();
  if(!S.palmas||!S.palmas.features.length){$('#avisoZoom').style.display='none';return;}
  if(mapa.getZoom()<zMinPalmas()){$('#avisoZoom').style.display='block';return;}
  $('#avisoZoom').style.display='none';
  const b=mapa.getBounds().pad(.25);
  const i0=Math.floor(b.getWest()/CELDA),i1=Math.floor(b.getEast()/CELDA),j0=Math.floor(b.getSouth()/CELDA),j1=Math.floor(b.getNorth()/CELDA);
  const grupos=[];
  if((i1-i0+1)*(j1-j0+1)>rejilla.size){for(const [k,arr] of rejilla){const [i,j]=k.split(',').map(Number);if(i>=i0&&i<=i1&&j>=j0&&j<=j1)grupos.push(arr);}}
  else for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const a2=rejilla.get(i+','+j);if(a2)grupos.push(a2);}
  const r=radioPalma();
  for(const arr of grupos)for(const f of arr){
    const [lng,lat]=f.geometry.coordinates;const id=f.properties._id;
    const m=L.circleMarker([lat,lng],{renderer:rend,radius:r,...estiloPalma(f)});
    m.on('click',()=>abrirPalma(id));m.addTo(capaPalmas);S.marcadores.set(id,m);
  }
}
function repintarPalma(id){const m=S.marcadores.get(id),f=S.idx.get(id);if(m&&f)m.setStyle(estiloPalma(f));}
function resaltar(lat,lng){
  if(resalte)capaGps.removeLayer(resalte);
  resalte=L.circleMarker([lat,lng],{radius:radioPalma()+6,color:'#00e5ff',weight:3,fill:false,interactive:false}).addTo(capaGps);
}
function encuadrar(){
  const fc=S.palmas&&S.palmas.features.length?S.palmas:(S.lotes&&S.lotes.features.length?S.lotes:null);if(!fc)return;
  let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
  const rec=x=>{if(typeof x[0]==='number'){if(x[0]<a)a=x[0];if(x[1]<b)b=x[1];if(x[0]>c)c=x[0];if(x[1]>d)d=x[1];}else x.forEach(rec);};
  fc.features.forEach(f=>rec(f.geometry.coordinates));
  if(isFinite(a))mapa.fitBounds([[b,a],[d,c]],{padding:[20,20]});
}
function pintarLeyenda(){
  $('#leyenda').innerHTML=ESTADOS.map(e=>`<div><span class="punto" style="background:${e.c}"></span>${esc(e.n)}</div>`).join('')+
  `<div><span class="punto" style="background:${SIN_EVALUAR}"></span>Sin evaluar</div><div><span class="punto" style="background:#fff;border-color:#9e9e9e;opacity:.6"></span>Sitio sin palma (cartografía)</div><div><span class="punto" style="background:transparent;border:2px solid #ffd600;border-radius:3px"></span>Límite de lote</div>`;
}
$('#leyendaBtn').onclick=()=>$('#leyenda').classList.toggle('ver');

/* ---------- Geometría ---------- */
function enAnillo(x,y,a){let d=false;for(let i=0,j=a.length-1;i<a.length;j=i++){const xi=a[i][0],yi=a[i][1],xj=a[j][0],yj=a[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))d=!d;}return d;}
function enPoligono(x,y,c){if(!enAnillo(x,y,c[0]))return false;for(let k=1;k<c.length;k++)if(enAnillo(x,y,c[k]))return false;return true;}
function cajasLotes(){
  if(!S.lotes)return;
  for(const f of S.lotes.features){let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
    const polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;
    for(const p of polys)for(const [x,y] of p[0]){if(x<a)a=x;if(y<b)b=y;if(x>c)c=x;if(y>d)d=y;}
    f._caja=[a,b,c,d];}
}
function loteDe(lat,lng){
  if(!S.lotes)return'';
  for(const f of S.lotes.features){const k=f._caja;if(k&&(lng<k[0]||lng>k[2]||lat<k[1]||lat>k[3]))continue;
    const polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;
    for(const p of polys)if(enPoligono(lng,lat,p))return String(f.properties._lote);}
  return'';
}
const CELDA=0.002;const rejilla=new Map();
function indexar(){
  S.idx.clear();rejilla.clear();
  if(S.palmas)for(const f of S.palmas.features){S.idx.set(f.properties._id,f);const [x,y]=f.geometry.coordinates;const k=Math.floor(x/CELDA)+','+Math.floor(y/CELDA);let a=rejilla.get(k);if(!a)rejilla.set(k,a=[]);a.push(f);}
  cajasLotes();
}
function recalcUltimo(){
  S.ultimo.clear();
  for(const r of S.registros){const u=S.ultimo.get(r.palma_id);if(!u||r.fecha>u.fecha||(r.fecha===u.fecha&&(r.modificado||'')>(u.modificado||'')))S.ultimo.set(r.palma_id,r);}
}

/* ---------- GPS ---------- */
let gpsWatch=null,gpsMarca=null,gpsCirc=null;
function iniciarGPS(){
  if(!navigator.geolocation){toast('Este dispositivo no permite usar el GPS en el navegador.');return;}
  if(gpsWatch!==null)return;
  gpsWatch=navigator.geolocation.watchPosition(p=>{
    S.gps={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:p.timestamp};pintarGPS();guiaGPS();
    if(S.seguir)mapa.setView([S.gps.lat,S.gps.lng],Math.max(mapa.getZoom(),18),{animate:false});
  },e=>{$('#gpsInfo').textContent='GPS: sin señal';if(e.code===1)toast('Debe autorizar el acceso a la ubicación para usar el GPS.');gpsWatch=null;},
  {enableHighAccuracy:true,maximumAge:2000,timeout:60000});
}
function pintarGPS(){

}
$('#btGps').onclick=()=>{
  iniciarGPS();
  if(!S.gps){toast('Buscando señal GPS… manténgase a cielo abierto.');S.seguir=true;$('#btGps').classList.add('activo');return;}
  S.seguir=!S.seguir;$('#btGps').classList.toggle('activo',S.seguir);

};
$('#btCercana').onclick=()=>{

/* ---------- Guía por voz: anuncia Lote – Línea – Palma al acercarse ---------- */
const VOZ={activa:false,candidata:null,cuenta:0,ultimaPalma:null,ultimoLote:undefined,voz:null,ctx:null,wake:null,avisoPrecision:0,ultimaFrase:''};
function elegirVoz(){
  if(!('speechSynthesis' in window))return;
  const vs=speechSynthesis.getVoices();
  VOZ.voz=vs.find(v=>/^es[-_]CO/i.test(v.lang))||vs.find(v=>/^es[-_](419|MX|US)/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null;
}
if('speechSynthesis' in window){elegirVoz();speechSynthesis.onvoiceschanged=elegirVoz;}
/* Separa letras y números para que la voz diga «I T 43» y no «it cuarenta y tres» */
function paraVoz(t){
  return String(t??'').trim()
    .replace(/([A-Za-zÑñ])(?=\d)/g,'$1 ').replace(/(\d)(?=[A-Za-zÑñ])/g,'$1 ')
    .replace(/\b[A-ZÑ]{2,3}\b/g,m=>m.split('').join(' '));
}
function hablar(txt){
  VOZ.ultimaFrase=txt;
  if(!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);u.lang=VOZ.voz?VOZ.voz.lang:'es-CO';if(VOZ.voz)u.voice=VOZ.voz;
    u.rate=Number(S.cfg.velocidadVoz)||1;u.volume=1;speechSynthesis.speak(u);
  }catch(e){}
}
function pitido(f=880,ms=140){
  try{if(!VOZ.ctx)return;const o=VOZ.ctx.createOscillator(),g=VOZ.ctx.createGain();o.frequency.value=f;o.type='sine';
    g.gain.setValueAtTime(.35,VOZ.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,VOZ.ctx.currentTime+ms/1000);
    o.connect(g).connect(VOZ.ctx.destination);o.start();o.stop(VOZ.ctx.currentTime+ms/1000);}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(120);}catch(e){}
}
async function pedirPantallaEncendida(){
  try{if('wakeLock' in navigator&&!VOZ.wake){VOZ.wake=await navigator.wakeLock.request('screen');VOZ.wake.addEventListener('release',()=>{VOZ.wake=null;});}}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(VOZ.activa&&document.visibilityState==='visible')pedirPantallaEncendida();});

/* Palma más cercana usando la rejilla espacial (solo celdas vecinas: rápido aun con miles de palmas) */
function palmaMasCercana(lat,lng){
  const i=Math.floor(lng/CELDA),j=Math.floor(lat/CELDA);let mejor=null,dm=Infinity;
  for(let a=i-1;a<=i+1;a++)for(let b=j-1;b<=j+1;b++){const arr=rejilla.get(a+','+b);if(!arr)continue;
    for(const f of arr){const [x,y]=f.geometry.coordinates;const d=dist(lat,lng,y,x);if(d<dm){dm=d;mejor=f;}}}
  return mejor?{f:mejor,d:dm}:null;
}
function etiquetaPalma(p){
  const partes=[];if(p._lote)partes.push(p._lote);if(p._linea)partes.push('L'+p._linea);if(p._num)partes.push('P'+p._num);
  return partes.length>1?partes.join(' · '):'Palma '+p._id;
}
function frasePalma(f){
  const p=f.properties;let t='';
  if(p._lote)t+='Lote '+paraVoz(p._lote)+', ';
  if(p._linea)t+='línea '+paraVoz(p._linea)+', ';
  t+=p._num?'palma '+paraVoz(p._num):'palma código '+paraVoz(p._id);
  if(p._existe===false)t+=', sitio vacío';
  const u=S.ultimo.get(p._id);if(u)t+=', ya evaluada: '+((estadoDe(u.estado)||{}).n||u.estado);
  return t+'.';
}
function pintarGuia(c){
  const g=$('#guia');if(!VOZ.activa){g.style.display='none';return;}
  g.style.display='flex';
  const umbral=Number(S.cfg.umbralVoz)||4,prec=Number(S.cfg.precisionVoz)||15;
  if(!S.gps){g.className='';$('#guiaTxt').textContent='Esperando señal GPS…';$('#guiaSub').textContent='Manténgase a cielo abierto';g.dataset.id='';return;}
  if(!c){g.className='';$('#guiaTxt').textContent=S.palmas?'Sin palmas cerca':'No hay palmas cargadas';$('#guiaSub').textContent=`GPS ±${Math.round(S.gps.acc)} m`;g.dataset.id='';return;}
  const cerca=c.d<=umbral;
  g.className=cerca?'cerca':(S.gps.acc>prec?'mala':'');
  $('#guiaTxt').textContent=etiquetaPalma(c.f.properties);
  $('#guiaSub').textContent=`a ${c.d.toFixed(1)} m · GPS ±${Math.round(S.gps.acc)} m${S.gps.acc>prec?' · precisión baja':''}${c.f.properties._existe===false?' · sitio vacío':''}`;
  g.dataset.id=c.f.properties._id;
}
function guiaGPS(){
  if(!VOZ.activa)return;
  if(!S.gps){pintarGuia(null);return;}
  const {lat,lng,acc}=S.gps;const umbral=Number(S.cfg.umbralVoz)||4,prec=Number(S.cfg.precisionVoz)||15;
  const c=S.palmas?palmaMasCercana(lat,lng):null;pintarGuia(c);
  let frase='';
  // Entrada a un lote nuevo
  const lote=loteDe(lat,lng);
  if(VOZ.ultimoLote===undefined)VOZ.ultimoLote=lote;
  else if(lote!==VOZ.ultimoLote){VOZ.ultimoLote=lote;frase=lote?'Entrando al lote '+paraVoz(lote)+'.'+(esDeTrabajo(lote)?'':' Este lote no está cargado.'):'Saliendo del lote.';}
  // Precisión insuficiente: aviso hablado como máximo cada 60 s
  if(acc>prec){
    if(Date.now()-VOZ.avisoPrecision>60000){VOZ.avisoPrecision=Date.now();frase+=' Precisión del GPS baja, '+Math.round(acc)+' metros.';}
    if(frase){pitido(440);hablar(frase.trim());}
    return;
  }
  if(c){
    const id=c.f.properties._id;
    if(c.d<=umbral){
      if(id===VOZ.candidata)VOZ.cuenta++;else{VOZ.candidata=id;VOZ.cuenta=1;}
      // se exige confirmación en dos lecturas seguidas (o estar muy cerca) para no anunciar saltos del GPS
      if(id!==VOZ.ultimaPalma&&(VOZ.cuenta>=2||c.d<=umbral/2)){
        VOZ.ultimaPalma=id;frase=frasePalma(c.f);
        const [x,y]=c.f.geometry.coordinates;resaltar(y,x);
      }
    }else{
      VOZ.candidata=null;VOZ.cuenta=0;
      if(c.d>umbral*1.6)VOZ.ultimaPalma=null; // al alejarse, permite volver a anunciarla
    }
  }
  if(frase){pitido();hablar(frase);}
}
async function alternarVoz(){
  VOZ.activa=!VOZ.activa;$('#btVoz').classList.toggle('activo',VOZ.activa);
  $('#btVoz span').textContent=VOZ.activa?'🔊':'🔈';
  if(VOZ.activa){
    try{if(!VOZ.ctx)VOZ.ctx=new (window.AudioContext||window.webkitAudioContext)();else VOZ.ctx.resume();}catch(e){}
    elegirVoz();iniciarGPS();pedirPantallaEncendida();
    VOZ.candidata=null;VOZ.cuenta=0;VOZ.ultimaPalma=null;VOZ.ultimoLote=undefined;VOZ.avisoPrecision=0;
    S.seguir=true;$('#btGps').classList.add('activo');
    if(S.gps)mapa.setView([S.gps.lat,S.gps.lng],Math.max(mapa.getZoom(),19));
    pitido();hablar('Guía por voz activada.');
    if(!('speechSynthesis' in window))toast('Este navegador no tiene voz: se usarán pitido y vibración.',4000);
    guiaGPS();
  }else{
    try{speechSynthesis.cancel();}catch(e){}
    try{if(VOZ.wake){await VOZ.wake.release();VOZ.wake=null;}}catch(e){}
    pintarGuia(null);toast('Guía por voz desactivada.');
  }
}
$('#btVoz').onclick=alternarVoz;
$('#guia').onclick=e=>{
  if(e.target.id==='guiaRepetir'){e.stopPropagation();const id=$('#guia').dataset.id;const f=id&&S.idx.get(id);hablar(f?frasePalma(f):(VOZ.ultimaFrase||'Sin palma cercana.'));return;}
  const id=$('#guia').dataset.id;if(id)abrirPalma(id);
};

/* ---------- Lotes de trabajo ----------
   Las palmas se guardan en el dispositivo separadas por lote (almacén «palmas_lote»).
   En memoria y en el mapa solo se cargan los lotes de trabajo que el usuario elige. */
const LOTE_VACIO='(sin lote)';
const claveLote=l=>String(l??'').trim()||LOTE_VACIO;
let META={}; // lote -> {n, vacios}
const ordenLotes=a=>a.sort((x,y)=>x.localeCompare(y,'es',{numeric:true}));
async function guardarMeta(){await dbPut('config',{clave:'lotesMeta',v:META});}
async function escribirChunk(lote,feats){
  const k=claveLote(lote);
  if(feats.length){await dbPut('palmas_lote',{lote:k,features:feats});META[k]={n:feats.length,vacios:feats.filter(f=>f.properties._existe===false).length};}
  else{await dbDel('palmas_lote',k);delete META[k];}
}
async function leerChunk(lote){const r=await dbGet('palmas_lote',claveLote(lote));return r?r.features:[];}
async function todasLasPalmas(){const out=[];for(const c of await dbAll('palmas_lote'))for(const f of c.features)out.push(f);return out;}
function agrupar(feats){const m=new Map();for(const f of feats){const k=claveLote(f.properties._lote);let a=m.get(k);if(!a)m.set(k,a=[]);a.push(f);}return m;}
const lotesTrabajo=()=>S.cfg.lotesTrabajo||(S.cfg.lotesTrabajo=[]);
const esDeTrabajo=l=>lotesTrabajo().includes(claveLote(l));
async function cargarTrabajo(){
  const feats=[];
  for(const l of lotesTrabajo()){const fs=await leerChunk(l);for(const f of fs)feats.push(f);}
  S.palmas=feats.length?{type:'FeatureCollection',features:feats}:null;
  indexar();dibujarLotes();dibujarPalmas();actualizarCab();
}
async function persistirLote(lote){ // reescribe un lote de trabajo a partir de la memoria
  const k=claveLote(lote);
  await escribirChunk(k,S.palmas?S.palmas.features.filter(f=>claveLote(f.properties._lote)===k):[]);
  await guardarMeta();
}
async function asegurarTrabajo(lote){ // incluye un lote en el trabajo (p. ej. al crear una palma nueva en él)
  const k=claveLote(lote);if(esDeTrabajo(k))return;
  lotesTrabajo().push(k);await guardarCfg();
  const fs=await leerChunk(k);if(!S.palmas)S.palmas={type:'FeatureCollection',features:[]};
  for(const f of fs)S.palmas.features.push(f);
}
async function fijarTrabajo(lista,{encuadre=true}={}){
  S.cfg.lotesTrabajo=ordenLotes([...new Set(lista)].filter(l=>META[l]));await guardarCfg();
  await cargarTrabajo();if(encuadre)encuadrar();
}
function elegirLotes(msg){
  const disp=ordenLotes(Object.keys(META));
  if(!disp.length){
    abrirHoja('Lotes de trabajo',`<p>Aún no hay palmas guardadas en este dispositivo.</p><p class="tenue">Importe primero la capa de palmas (puede ser un programa completo); luego elija aquí los lotes del día.</p>
      <button class="btn prim ancho" id="lImp">🌴 Importar palmas</button>`);
    $('#lImp').onclick=()=>importar('palmas');return;
  }
  const atrib=new Map();if(S.lotes)S.lotes.features.forEach(f=>{const p=f.properties;const extra=Object.entries(p).filter(([k,v])=>k[0]!=='_'&&v!=null&&String(v)!==String(p._lote)).map(([,v])=>v).join(' · ');atrib.set(String(p._lote),extra);});
  const sel=new Set(lotesTrabajo());
  abrirHoja('Lotes de trabajo',`
    ${msg?`<div class="aviso">${esc(msg)}</div>`:''}
    <p class="tenue">Solo los lotes marcados se cargan en la aplicación y en el mapa. Los demás quedan guardados en el dispositivo y puede activarlos cuando los necesite.</p>
    <input type="text" id="lBusca" placeholder="Filtrar, p. ej.: IT4  o  Z2">
    <div class="fila" style="margin-top:8px"><button type="button" class="btn" id="lTodos">Marcar los visibles</button><button type="button" class="btn" id="lNing">Desmarcar todo</button></div>
    <div id="lLista" style="max-height:45vh;overflow:auto;border:1px solid #eee;border-radius:10px;padding:8px;margin-top:8px"></div>
    <div class="ficha" id="lTotal" style="margin-top:8px"></div>
    <button class="btn prim ancho" id="lOk" style="margin-top:10px">🎯 Trabajar con estos lotes</button>
    <p class="tenue">También puede tocar un lote en el mapa (con el mapa alejado) para agregarlo o quitarlo.</p>`);
  const vis=()=>{const t=$('#lBusca').value.trim().toUpperCase();return disp.filter(l=>!t||l.toUpperCase().includes(t)||String(atrib.get(l)||'').toUpperCase().includes(t));};
  function total(){
    let n=0;sel.forEach(l=>{if(META[l])n+=META[l].n;});
    $('#lTotal').innerHTML=`<b>${sel.size}</b> lote(s) · <b>${n.toLocaleString('es-CO')}</b> sitios de palma`+(n>LIMITE_CELULAR?'<br><span style="color:var(--rojo)">⚠️ Demasiadas palmas para un celular: reduzca la selección.</span>':'');
  }
  function pintar(){
    $('#lLista').innerHTML=`<div class="chips">${vis().map(l=>`<label class="chip"><input type="checkbox" data-l="${esc(l)}" ${sel.has(l)?'checked':''}><span><b>${esc(l)}</b>&nbsp;${META[l].n.toLocaleString('es-CO')}${atrib.get(l)?` · <small>${esc(atrib.get(l))}</small>`:''}</span></label>`).join('')}</div>`;
    $$('#lLista input').forEach(i=>i.onchange=()=>{i.checked?sel.add(i.dataset.l):sel.delete(i.dataset.l);total();});total();
  }
  $('#lBusca').oninput=pintar;
  $('#lTodos').onclick=()=>{vis().forEach(l=>sel.add(l));pintar();};
  $('#lNing').onclick=()=>{sel.clear();pintar();};
  $('#lOk').onclick=async()=>{
    let n=0;sel.forEach(l=>{if(META[l])n+=META[l].n;});
    if(n>LIMITE_CELULAR&&!confirm(`Va a cargar ${n.toLocaleString('es-CO')} palmas; en un celular puede ser lento. ¿Continuar?`))return;
    $('#lOk').disabled=true;$('#lOk').textContent='Cargando…';
    await fijarTrabajo([...sel]);cerrarHoja();

  };
  pintar();
}

function agregarMiniatura(fid,blob,nueva){
  const url=URL.createObjectURL(blob);F.urls.push(url);
  const d=document.createElement('div');d.className='foto';d.dataset.id=fid;
  d.innerHTML=`<img src="${url}" alt="foto"><button type="button" aria-label="Quitar">✕</button>`;
  d.querySelector('img').onclick=()=>verFoto(url);
  d.querySelector('button').onclick=()=>{if(nueva)F.fotosNuevas=F.fotosNuevas.filter(x=>x.id!==fid);else F.fotosQuitar.push(fid);d.remove();};
  $('#fotos').appendChild(d);
}
$('#inFoto').onchange=async()=>{
  const files=Array.from($('#inFoto').files||[]);if(!F)return;
  for(const file of files){try{const c=await comprimir(file);const id=uid();F.fotosNuevas.push({id,...c});agregarMiniatura(id,new Blob([c.buf],{type:c.type}),true);}
    catch(e){toast('No se pudo procesar la foto: '+e.message);}}
};
function cargarImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i);};i.onerror=()=>rej(new Error('formato no soportado'));i.src=u;});}
async function comprimir(file){
  const img=await cargarImg(file);const M=1600;const k=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.78));
  return {buf:await blob.arrayBuffer(),type:'image/jpeg'};
}
async function guardarRegistro(frm){
  const fd=new FormData(frm);const r=F.r;
  r.fecha=fd.get('fecha');r.evaluador=(fd.get('evaluador')||'').trim();r.estado=fd.get('estado')||'';
  r.problemas=fd.getAll('problemas');r.sintomas=fd.getAll('sintomas');
  r.grado_pc=r.problemas.includes('PC')?(fd.get('grado_pc')||''):'';
  r.severidad=fd.get('severidad')||'';r.accion=fd.get('accion')||'';r.observaciones=(fd.get('observaciones')||'').trim();
  if(r.estado==='faltante'){r.problemas=[];r.sintomas=[];r.grado_pc='';r.severidad='';}
  if(!r.fecha||!r.evaluador){alert('Debe indicar la fecha y el nombre del evaluador.');return;}
  if(!r.estado){alert('Debe seleccionar el estado de la palma.');return;}
  if((r.estado==='enferma'||r.estado==='tratamiento')&&!r.problemas.length){alert('Para una palma enferma o en tratamiento debe marcar al menos un problema sanitario.');return;}
  // palma nueva: se crea en la capa de palmas
  if(F.nueva){
    const lote=(fd.get('lote')||'').trim(),linea=(fd.get('linea')||'').trim(),numero=(fd.get('numero')||'').trim();
    let id=(lote&&linea&&numero)?`${lote}-L${linea}-P${numero}`:'N-'+uid().slice(0,8).toUpperCase();
    while(S.idx.has(id))id+='b';
    await asegurarTrabajo(lote);if(!S.palmas)S.palmas={type:'FeatureCollection',features:[]};
    const feat={type:'Feature',geometry:{type:'Point',coordinates:[F.lng,F.lat]},properties:{_id:id,_lote:lote,_linea:linea,_num:numero,_nueva:true}};
    S.palmas.features.push(feat);await persistirLote(lote);indexar();dibujarLotes();
    r.palma_id=id;F.nueva=null;dibujarPalmas();
  }
  const f=S.idx.get(r.palma_id);
  if(f){const p=f.properties;r.lng=f.geometry.coordinates[0];r.lat=f.geometry.coordinates[1];r.lote=p._lote||loteDe(r.lat,r.lng);r.linea=p._linea??'';r.numero=p._num??'';}
  if(!F.edit){
    r.creado=new Date().toISOString();
    if(S.gps){r.gps_lat=S.gps.lat;r.gps_lng=S.gps.lng;r.gps_acc=Math.round(S.gps.acc*10)/10;r.dist_gps=Math.round(dist(S.gps.lat,S.gps.lng,r.lat,r.lng)*10)/10;}
    else{r.gps_lat=null;r.gps_lng=null;r.gps_acc=null;r.dist_gps=null;}
  }
  r.modificado=new Date().toISOString();
  try{
    for(const fo of F.fotosNuevas){await dbPut('fotos',{id:fo.id,registro_id:r.id,buf:fo.buf,type:fo.type});r.fotos.push(fo.id);}
    for(const q of F.fotosQuitar){await dbDel('fotos',q);r.fotos=r.fotos.filter(x=>x!==q);}
    await dbPut('registros',r);
  }catch(e){alert('Error al guardar: '+e.message);return;}
  S.cfg.evaluador=r.evaluador;await guardarCfg();
  const i=S.registros.findIndex(x=>x.id===r.id);if(i>=0)S.registros[i]=r;else S.registros.push(r);
  recalcUltimo();repintarPalma(r.palma_id);liberarUrls();F=null;actualizarCab();
  toast('✅ Diagnóstico guardado en el dispositivo.');abrirPalma(r.palma_id);
}
function liberarUrls(){if(F)F.urls.forEach(u=>URL.revokeObjectURL(u));}
async function borrarRegistro(id){
  if(!confirm('¿Eliminar definitivamente este diagnóstico y sus fotos?'))return;
  const r=S.registros.find(x=>x.id===id);if(!r)return;
  for(const fid of (r.fotos||[]))await dbDel('fotos',fid);
  await dbDel('registros',id);S.registros=S.registros.filter(x=>x.id!==id);
  recalcUltimo();repintarPalma(r.palma_id);liberarUrls();F=null;actualizarCab();toast('Diagnóstico eliminado.');abrirPalma(r.palma_id);
}

/* ---------- Resumen / incidencia por lote ---------- */
function calcularResumen(){
  const R=new Map();
  const fila=l=>{if(!R.has(l))R.set(l,{lote:l,total:0,vacios:0,evaluadas:0,est:{},prob:{}});return R.get(l);};
  for(const [k,m] of Object.entries(META)){const x=fila(k);x.total+=m.n-m.vacios;x.vacios+=m.vacios;}
  for(const u of S.ultimo.values()){const x=fila(claveLote(u.lote));x.evaluadas++;x.est[u.estado]=(x.est[u.estado]||0)+1;(u.problemas||[]).forEach(q=>x.prob[q]=(x.prob[q]||0)+1);}
  return Array.from(R.values()).filter(x=>x.total||x.vacios||x.evaluadas).sort((a,b)=>a.lote.localeCompare(b.lote,'es',{numeric:true}));
}
const incid=x=>x.evaluadas?((x.est.enferma||0)+(x.est.tratamiento||0))/x.evaluadas*100:0;
function resumen(){
  const R=calcularResumen();
  const tot={lote:'TOTAL',total:0,vacios:0,evaluadas:0,est:{},prob:{}};
  R.forEach(x=>{tot.total+=x.total;tot.vacios+=x.vacios;tot.evaluadas+=x.evaluadas;for(const k in x.est)tot.est[k]=(tot.est[k]||0)+x.est[k];for(const k in x.prob)tot.prob[k]=(tot.prob[k]||0)+x.prob[k];});
  const filaH=x=>`<tr><td>${esc(x.lote)}</td><td>${x.total}</td><td>${x.evaluadas}</td><td>${x.est.sana||0}</td><td>${(x.est.enferma||0)+(x.est.tratamiento||0)}</td><td>${(x.est.muerta||0)+(x.est.erradicada||0)}</td><td><b>${incid(x).toFixed(1)}%</b></td></tr>`;
  const probs=PROBLEMAS.filter(p=>tot.prob[p.id]).map(p=>`<tr><td>${esc(p.n)}</td><td>${tot.prob[p.id]}</td><td>${tot.evaluadas?(tot.prob[p.id]/tot.evaluadas*100).toFixed(1):'0.0'}%</td></tr>`).join('');
  abrirHoja('Resumen por lote',`
    <p class="tenue">«Palmas» cuenta solo los sitios con palma según la cartografía. Se toma el último diagnóstico de cada palma. Incidencia = (enfermas + en tratamiento) / palmas evaluadas.</p>
    <div style="overflow:auto"><table class="res"><thead><tr><th>Lote</th><th>Palmas</th><th>Eval.</th><th>Sanas</th><th>Enf.</th><th>Muertas/Err.</th><th>Incid.</th></tr></thead>
    <tbody>${R.map(filaH).join('')}${filaH(tot)}</tbody></table></div>
    <h3>Problemas detectados</h3>
    ${probs?`<table class="res"><thead><tr><th>Problema</th><th>Palmas</th><th>% de evaluadas</th></tr></thead><tbody>${probs}</tbody></table>`:'<p class="tenue">Aún no se han registrado problemas.</p>'}
    <button class="btn ancho" id="btResCsv" style="margin-top:14px">⬇️ Descargar resumen (CSV)</button>`);
  $('#btResCsv').onclick=()=>{
    const cab=['lote','palmas','sitios_sin_palma_cartografia','evaluadas',...ESTADOS.map(e=>'est_'+e.id),'incidencia_pct',...PROBLEMAS.map(p=>'prob_'+p.id)];
    const filas=[...R,tot].map(x=>[x.lote,x.total,x.vacios,x.evaluadas,...ESTADOS.map(e=>x.est[e.id]||0),incid(x).toFixed(2),...PROBLEMAS.map(p=>x.prob[p.id]||0)]);
    descargar(new Blob(['﻿'+aCSV(cab,filas)],{type:'text/csv'}),`resumen_sanidad_${hoyArchivo()}.csv`);
  };
}
function resumenLote(l){
  const k=claveLote(l);const x=calcularResumen().find(y=>y.lote===k)||{total:0,vacios:0,evaluadas:0,est:{}};const trab=esDeTrabajo(k);
  abrirHoja('Lote '+l,`<div class="ficha">
    <div>${trab?'🎯 <b>Lote de trabajo</b>':(META[k]?'Palmas guardadas, no cargadas':'<span class="tenue">Sin palmas guardadas en el dispositivo</span>')}</div>
    <div><b>Palmas:</b> ${x.total.toLocaleString('es-CO')}${x.vacios?` (+${x.vacios} sitios vacíos)`:''} · <b>Evaluadas:</b> ${x.evaluadas} (${x.total?(x.evaluadas/x.total*100).toFixed(0):0}%)</div>
    ${ESTADOS.filter(e=>x.est[e.id]).map(e=>`<div><span class="punto" style="background:${e.c}"></span> ${esc(e.n)}: ${x.est[e.id]}</div>`).join('')}
    <div><b>Incidencia:</b> ${incid(x).toFixed(1)}%</div></div>
    ${META[k]?(trab?`<button class="btn ancho" id="rlQuitar">Quitar de los lotes de trabajo</button>`:`<button class="btn prim ancho" id="rlAgregar">🎯 Agregar a los lotes de trabajo</button><button class="btn ancho" id="rlSolo">Trabajar solo en este lote</button>`):''}
    ${trab?'<p class="tenue">Acérquese (zoom) para seleccionar palmas individuales.</p>':''}`);
  const on=(s,fn)=>{const e=$(s);if(e)e.onclick=fn;};
  on('#rlAgregar',async()=>{await fijarTrabajo([...lotesTrabajo(),k],{encuadre:false});cerrarHoja();toast('Lote '+k+' agregado.');});
  on('#rlSolo',async()=>{await fijarTrabajo([k]);cerrarHoja();toast('Trabajando solo en el lote '+k+'.');});
  on('#rlQuitar',async()=>{await fijarTrabajo(lotesTrabajo().filter(z=>z!==k),{encuadre:false});cerrarHoja();toast('Lote '+k+' retirado del trabajo.');});
}

/* ---------- Importación de capas ---------- */
/* Fuentes admitidas: GeoPackage (.gpkg), GeoJSON, KML, KMZ y Shapefile en .zip.
   Cada fuente expone la misma interfaz: campos, n, distintos(campo), obtener(campo, valores), cerrar(). */
const LIMITE_CELULAR=60000;
let SQLP=null;
function cargarSQL(){
  if(!SQLP){const bin=Uint8Array.from(atob(SQL_WASM_B64),c=>c.charCodeAt(0));SQLP=initSqlJs({wasmBinary:bin});}
  return SQLP;
}
const qid=s=>'"'+String(s).replace(/"/g,'""')+'"';
const ordenar=a=>a.sort((x,y)=>x.v.localeCompare(y.v,'es',{numeric:true}));

/* Geometría GeoPackage: encabezado «GP» + WKB (admite Z/M, ISO y EWKB) */
function gpkgGeom(u8){
  if(!u8||u8.length<9||u8[0]!==0x47||u8[1]!==0x50)return null;
  const flags=u8[3];if(flags&0x10)return null;
  const env=[0,32,48,48,64][(flags>>1)&7]||0;
  return leerWKB(new DataView(u8.buffer,u8.byteOffset+8+env,u8.length-8-env));
}
function leerWKB(dv){
  let o=0;
  function geom(){
    const le=dv.getUint8(o)===1;o+=1;let t=dv.getUint32(o,le);o+=4;
    let z=(t&0x80000000)!==0,m=(t&0x40000000)!==0;const srid=(t&0x20000000)!==0;t&=0x0FFFFFFF;
    if(t>=1000){const k=Math.floor(t/1000);if(k===1||k===3)z=true;if(k===2||k===3)m=true;t%=1000;}
    if(srid)o+=4;
    const dim=2+(z?1:0)+(m?1:0);
    const pt=()=>{const x=dv.getFloat64(o,le),y=dv.getFloat64(o+8,le);o+=8*dim;return [x,y];};
    const u32=()=>{const v=dv.getUint32(o,le);o+=4;return v;};
    const pts=()=>{const n=u32(),a=[];for(let i=0;i<n;i++)a.push(pt());return a;};
    switch(t){
      case 1:{const c=pt();return isNaN(c[0])?null:{type:'Point',coordinates:c};}
      case 2:return {type:'LineString',coordinates:pts()};
      case 3:{const n=u32(),r=[];for(let i=0;i<n;i++)r.push(pts());return {type:'Polygon',coordinates:r};}
      case 4:case 5:case 6:{const n=u32(),g=[];for(let i=0;i<n;i++){const x=geom();if(x)g.push(x.coordinates);}
        return {type:['','','','','MultiPoint','MultiLineString','MultiPolygon'][t],coordinates:g};}
      case 7:{const n=u32(),g=[];for(let i=0;i<n;i++){const x=geom();if(x)g.push(x);}return {type:'GeometryCollection',geometries:g};}
      default:throw new Error('Tipo de geometría WKB no soportado: '+t);
    }
  }
  return geom();
}

function fuenteFC(fc){
  const claves=new Set();fc.features.slice(0,500).forEach(f=>Object.keys(f.properties||{}).forEach(k=>claves.add(k)));
  return {
    campos:Array.from(claves),n:fc.features.length,
    distintos:async c=>{const m=new Map();for(const f of fc.features){const v=String(f.properties[c]??'');m.set(v,(m.get(v)||0)+1);}return ordenar(Array.from(m,([v,n])=>({v,n})));},
    obtener:async(c,vals)=>{if(!c||!vals)return fc;const s=new Set(vals);return {type:'FeatureCollection',features:fc.features.filter(f=>s.has(String(f.properties[c]??'')))};},
    cerrar(){}
  };
}

async function fuenteGPKG(file,tipo){
  const movil=/Android|iPhone|iPad/i.test(navigator.userAgent);
  if(movil&&file.size>60*1048576&&!confirm(`El archivo pesa ${(file.size/1048576).toFixed(0)} MB y puede agotar la memoria del celular. Se recomienda usar los archivos por programa o abrirlo desde un computador. ¿Desea intentarlo de todos modos?`))throw new Error('Importación cancelada.');
  toast('Abriendo GeoPackage…',15000);
  const SQL=await cargarSQL();
  const db=new SQL.Database(new Uint8Array(await file.arrayBuffer()));
  const val=(sql,p)=>{const r=db.exec(sql,p);return r.length?r[0].values:[];};
  let capas;
  try{capas=val("SELECT g.table_name,g.column_name,UPPER(g.geometry_type_name),g.srs_id FROM gpkg_geometry_columns g JOIN gpkg_contents c ON c.table_name=g.table_name WHERE c.data_type='features'");}
  catch(e){db.close();throw new Error('El archivo no es un GeoPackage válido.');}
  if(!capas.length){db.close();throw new Error('El GeoPackage no contiene capas vectoriales.');}
  const aptas=capas.filter(c=>tipo==='lotes'?/POLYGON|GEOMETRY/.test(c[2]):/POINT|GEOMETRY/.test(c[2]));
  if(aptas.length)capas=aptas;
  let elegida=capas[0];
  if(capas.length>1){
    const r=prompt('El GeoPackage tiene varias capas. Escriba el número de la que desea importar:\n'+capas.map((c,i)=>`${i+1}. ${c[0]} (${c[2]})`).join('\n'),'1');
    const i=parseInt(r,10)-1;if(!(i>=0&&i<capas.length)){db.close();throw new Error('Importación cancelada.');}
    elegida=capas[i];
  }
  const [tabla,colGeom,,srs]=elegida;
  const campos=val(`PRAGMA table_info(${qid(tabla)})`).filter(r=>r[1]!==colGeom&&!(r[5]&&/^(fid|ogc_fid)$/i.test(r[1]))).map(r=>r[1]);
  const n=val(`SELECT COUNT(*) FROM ${qid(tabla)}`)[0][0];
  let conv=null;
  if(srs!==4326&&srs>0){
    const d=val('SELECT definition FROM gpkg_spatial_ref_sys WHERE srs_id=?',[srs]);
    try{conv=proj4(d[0][0],'EPSG:4326');}catch(e){db.close();throw new Error(`No se pudo interpretar el sistema de coordenadas (SRS ${srs}). Exporte la capa en EPSG:4326.`);}
  }
  const tr=c=>Array.isArray(c[0])?c.map(tr):conv.forward(c.slice(0,2));
  const textoCampo=c=>`COALESCE(CAST(${qid(c)} AS TEXT),'')`;
  return {
    campos,n,
    distintos:async c=>ordenar(val(`SELECT ${textoCampo(c)},COUNT(*) FROM ${qid(tabla)} GROUP BY 1`).map(r=>({v:String(r[0]),n:r[1]}))),
    obtener:async(c,vals)=>{
      let sql=`SELECT ${[colGeom,...campos].map(qid).join(',')} FROM ${qid(tabla)}`,p=[];
      if(c&&vals){if(!vals.length)return {type:'FeatureCollection',features:[]};sql+=` WHERE ${textoCampo(c)} IN (${vals.map(()=>'?').join(',')})`;p=vals;}
      const st=db.prepare(sql);st.bind(p);const feats=[];
      while(st.step()){
        const r=st.get();const g=gpkgGeom(r[0]);if(!g)continue;
        if(conv&&g.coordinates)g.coordinates=tr(g.coordinates);
        const props={};campos.forEach((k,i)=>{props[k]=r[i+1];});
        feats.push({type:'Feature',properties:props,geometry:g});
      }
      st.free();return {type:'FeatureCollection',features:feats};
    },
    cerrar(){try{db.close();}catch(e){}}
  };
}

function importar(tipo){
  const inp=$('#inArchivo');inp.accept='.gpkg,.geojson,.json,.kml,.kmz,.zip';inp.value='';
  inp.onchange=async()=>{const file=inp.files[0];if(!file)return;
    try{
      toast('Leyendo '+file.name+'…',10000);let fuente;
      if(file.name.toLowerCase().endsWith('.gpkg'))fuente=await fuenteGPKG(file,tipo);
      else{const fc=normalizar(await leerArchivoGeo(file),tipo);validarWGS(fc);fuente=fuenteFC(fc);}
      await mapeoCampos(tipo,fuente,file.name);
    }catch(e){alert('No se pudo leer el archivo:\n'+e.message);}};
  inp.click();
}
async function leerArchivoGeo(file){
  const n=file.name.toLowerCase();
  if(n.endsWith('.geojson')||n.endsWith('.json'))return JSON.parse(await file.text());
  if(n.endsWith('.kml'))return toGeoJSON.kml(new DOMParser().parseFromString(await file.text(),'text/xml'));
  if(n.endsWith('.kmz')){const z=await JSZip.loadAsync(file);const k=Object.keys(z.files).find(f=>f.toLowerCase().endsWith('.kml'));if(!k)throw new Error('El KMZ no contiene un archivo KML.');
    return toGeoJSON.kml(new DOMParser().parseFromString(await z.file(k).async('string'),'text/xml'));}
  if(n.endsWith('.zip'))return await shp(await file.arrayBuffer()); // shapefile comprimido (.shp, .dbf, .shx, .prj)
  throw new Error('Formato no soportado. Use GeoPackage, GeoJSON, KML, KMZ o Shapefile comprimido en .zip.');
}
function normalizar(gj,tipo){
  let feats=[];const agregar=g=>{if(!g)return;if(Array.isArray(g))g.forEach(agregar);else if(g.type==='FeatureCollection')feats.push(...g.features);else if(g.type==='Feature')feats.push(g);else if(g.type)feats.push({type:'Feature',properties:{},geometry:g});};
  agregar(gj);const out=[];
  for(const f of feats){const g=f.geometry;if(!g)continue;const props=f.properties||{};
    if(tipo==='lotes'&&(g.type==='Polygon'||g.type==='MultiPolygon'))out.push({type:'Feature',properties:props,geometry:{type:g.type,coordinates:quitarZ(g.coordinates)}});
    if(tipo==='lotes'&&g.type==='GeometryCollection')g.geometries.filter(x=>x.type==='Polygon'||x.type==='MultiPolygon').forEach(x=>out.push({type:'Feature',properties:{...props},geometry:{type:x.type,coordinates:quitarZ(x.coordinates)}}));
    if(tipo==='palmas'&&g.type==='Point')out.push({type:'Feature',properties:props,geometry:{type:'Point',coordinates:g.coordinates.slice(0,2)}});
    if(tipo==='palmas'&&g.type==='MultiPoint'){if(g.coordinates.length===1)out.push({type:'Feature',properties:props,geometry:{type:'Point',coordinates:g.coordinates[0].slice(0,2)}});else g.coordinates.forEach(c=>out.push({type:'Feature',properties:{...props},geometry:{type:'Point',coordinates:c.slice(0,2)}}));}
  }
  if(!out.length)throw new Error(tipo==='lotes'?'El archivo no contiene polígonos.':'El archivo no contiene puntos.');
  return {type:'FeatureCollection',features:out};
}
function quitarZ(c){return Array.isArray(c[0])?c.map(quitarZ):c.slice(0,2);}
function validarWGS(fc){
  if(!fc.features.length)return;
  const f=fc.features[0];let c=f.geometry.coordinates;while(Array.isArray(c[0]))c=c[0];
  if(Math.abs(c[0])>180||Math.abs(c[1])>90)throw new Error('Las coordenadas no están en grados geográficos. Exporte la capa en WGS84 (EPSG:4326) desde QGIS o ArcGIS e inténtelo de nuevo. (Si es un shapefile, incluya el archivo .prj dentro del .zip).');
}

async function mapeoCampos(tipo,fuente,nombre){
  fuenteAbierta=fuente;
  const K=fuente.campos;
  const adivina=(...res)=>{for(const re of res){const k=K.find(x=>re.test(x));if(k)return k;}return '';};
  const sel=(id,def,vacio)=>`<select id="${id}"><option value="">${esc(vacio)}</option>${K.map(k=>`<option ${k===def?'selected':''}>${esc(k)}</option>`).join('')}</select>`;
  let cuerpo;
  if(tipo==='lotes'){
    cuerpo=`<label class="campo">Campo que identifica el lote</label>${sel('mLote',adivina(/^(lote|id[ _]?lote|cod[ _]?lote|lot|bloque|name|nombre)$/i,/lote|lot|name|nombre/i),'(numerar automáticamente)')}`;
  }else{
    cuerpo=`
      <label class="campo">Identificador único de la palma</label>${sel('mId',adivina(/^(id[ _]?palma|palma[ _]?id|cod[ _]?palma|codigo|id)$/i),'(generar: Lote-Línea-Palma)')}
      <label class="campo">Campo de lote</label>${sel('mLote',adivina(/^(lote|id[ _]?lote|cod[ _]?lote|lot|bloque)$/i,/lote/i),'(calcular según el polígono que la contiene)')}
      <label class="campo">Campo de línea</label>${sel('mLinea',adivina(/^(linea|línea|line|fila|row|lin)$/i,/linea|línea|fila/i),'(sin línea)')}
      <label class="campo">Campo de número de palma</label>${sel('mNum',adivina(/^(palma|num|numero|número|n[ _]?palma|pos|posicion|planta)$/i),'(sin número)')}
      <label class="campo">Campo que indica si la palma existe (0 = sitio vacío)</label>${sel('mExist',adivina(/^exist/i),'(todas existen)')}
      ${!S.lotes?'<div class="aviso">Aún no ha cargado los lotes. Se recomienda cargarlos primero.</div>':''}`;
  }
  const hay=tipo==='lotes'?S.lotes:S.palmas;
  abrirHoja('Importar '+(tipo==='lotes'?'lotes':'palmas'),`
    <div class="ficha"><b>${esc(nombre)}</b><br>${fuente.n.toLocaleString('es-CO')} ${tipo==='lotes'?'polígonos':'puntos'} · ${K.length} campos</div>
    ${cuerpo}
    <h3>Lotes a cargar</h3>
    <input type="text" id="fBusca" placeholder="Filtrar, p. ej.: IT   o   GU12">
    <div class="fila" style="margin-top:8px"><button type="button" class="btn" id="fTodos">Marcar los visibles</button><button type="button" class="btn" id="fNing">Desmarcar todo</button></div>
    <div id="fSel" style="max-height:230px;overflow:auto;border:1px solid #eee;border-radius:10px;padding:8px;margin-top:8px"></div>
    <div class="ficha" id="fTotal" style="margin-top:8px"></div>
    ${hay?`<label class="campo">Capa existente en el dispositivo</label><select id="mModo"><option value="reemplazar">Reemplazar la capa actual</option><option value="agregar">Agregar o actualizar lotes en la capa actual</option></select>
    ${tipo==='palmas'&&S.registros.length?'<div class="aviso">Los diagnósticos se vinculan por el identificador de la palma. Use siempre el mismo identificador para no perder la relación.</div>':''}`:''}
    <button class="btn prim ancho" id="mOk" style="margin-top:14px">Importar</button>`);

  let dist=[];const marcados=new Set();
  const campoLote=()=>$('#mLote').value;
  const filtro=()=>$('#fBusca').value.trim().toUpperCase();
  const visibles=()=>dist.filter(d=>!filtro()||d.v.toUpperCase().includes(filtro()));
  const seleccion=()=>campoLote()?dist.filter(d=>marcados.has(d.v)):null;
  function total(){
    const s=seleccion();const n=s?s.reduce((a,d)=>a+d.n,0):fuente.n;
    $('#fTotal').innerHTML=`<b>${n.toLocaleString('es-CO')}</b> ${tipo==='lotes'?'polígonos seleccionados':'palmas seleccionadas'}${s?` en ${s.length} lote(s)`:''}`+
      (tipo==='palmas'?'<br><span class="tenue">Se guardan en el dispositivo separadas por lote; después usted elige qué lotes de trabajo cargar en el mapa.</span>':'')+(tipo==='palmas'&&n>150000?'<br><span style="color:var(--rojo)">⚠️ Más de 150 000 palmas puede agotar la memoria de un celular durante la importación. Importe por programa.</span>':'');
  }
  function pintarLista(){
    const v=visibles();
    $('#fSel').innerHTML=dist.length?`<div class="chips">${v.slice(0,800).map(d=>`<label class="chip"><input type="checkbox" data-v="${esc(d.v)}" ${marcados.has(d.v)?'checked':''}><span>${esc(d.v||'(vacío)')} · ${d.n.toLocaleString('es-CO')}</span></label>`).join('')}</div>`+(v.length>800?'<p class="tenue">Se muestran 800; use el filtro.</p>':'')
      :`<p class="tenue">Sin campo de lote: se cargarán todos los elementos${tipo==='palmas'?' y el lote se calculará por ubicación':''}.</p>`;
    $$('#fSel input').forEach(i=>i.onchange=()=>{i.checked?marcados.add(i.dataset.v):marcados.delete(i.dataset.v);total();});
    total();
  }
  async function cargarDist(){
    const c=campoLote();marcados.clear();
    if(!c){dist=[];$('#fBusca').disabled=true;pintarLista();return;}
    $('#fBusca').disabled=false;dist=await fuente.distintos(c);
    if(tipo==='lotes'||fuente.n<=LIMITE_CELULAR)dist.forEach(d=>marcados.add(d.v));
    pintarLista();
  }
  $('#fBusca').oninput=pintarLista;
  $('#fTodos').onclick=()=>{visibles().forEach(d=>marcados.add(d.v));pintarLista();};
  $('#fNing').onclick=()=>{marcados.clear();pintarLista();};
  $('#mLote').addEventListener('change',cargarDist);
  await cargarDist();

  $('#mOk').onclick=async()=>{
    const s=seleccion();
    if(s&&!s.length){alert('Seleccione al menos un lote.');return;}
    const n=s?s.reduce((a,d)=>a+d.n,0):fuente.n;
    if(tipo==='palmas'&&n>150000&&!confirm(`Va a importar ${n.toLocaleString('es-CO')} palmas de una vez. En un celular puede agotar la memoria. ¿Continuar?`))return;
    const bt=$('#mOk');bt.disabled=true;bt.textContent='Importando…';
    try{
      await new Promise(r=>setTimeout(r,50));
      const fc=normalizar(await fuente.obtener(campoLote(),s?s.map(d=>d.v):null),tipo);validarWGS(fc);
      const modo=$('#mModo')?$('#mModo').value:'reemplazar';
      if(tipo==='lotes'){
        const c=$('#mLote').value;
        fc.features.forEach((f,i)=>{f.properties._lote=c?String(f.properties[c]??('Lote '+(i+1))).trim():'Lote '+(i+1);});
        if(modo==='agregar'&&S.lotes){const nuevos=new Set(fc.features.map(f=>f.properties._lote));S.lotes={type:'FeatureCollection',features:[...S.lotes.features.filter(f=>!nuevos.has(f.properties._lote)),...fc.features]};}
        else S.lotes=fc;
        S.lotes.features.forEach(f=>delete f._caja);
        await dbPut('capas',{id:'lotes',fc:S.lotes});indexar();
        if(META[LOTE_VACIO]){const sinL=await leerChunk(LOTE_VACIO);for(const f of sinL){const [x,y]=f.geometry.coordinates;f.properties._lote=loteDe(y,x);}
          await escribirChunk(LOTE_VACIO,[]);for(const [k2,fs] of agrupar(sinL)){const prev=await leerChunk(k2);await escribirChunk(k2,prev.concat(fs));}
          await guardarMeta();S.cfg.lotesTrabajo=lotesTrabajo().filter(z=>META[z]);await guardarCfg();await cargarTrabajo();}
        dibujarLotes();
      }else{
        const cId=$('#mId').value,cL=$('#mLote').value,cLi=$('#mLinea').value,cN=$('#mNum').value,cEx=$('#mExist').value;
        const vistos=new Set();
        fc.features.forEach((f,i)=>{const p=f.properties;const [x,y]=f.geometry.coordinates;
          p._lote=cL?String(p[cL]??'').trim():loteDe(y,x);p._linea=cLi?String(p[cLi]??'').trim():'';p._num=cN?String(p[cN]??'').trim():'';
          if(cEx&&/^(0|0\.0|no|n|false|falso)$/i.test(String(p[cEx]??'').trim()))p._existe=false;
          let id=cId?String(p[cId]??'').trim():'';
          if(!id)id=(p._lote&&p._linea&&p._num)?`${p._lote}-L${p._linea}-P${p._num}`:'P'+(i+1);
          let k=id,m=2;while(vistos.has(k))k=id+'_'+(m++);p._id=k;vistos.add(k);});
        bt.textContent='Guardando por lote…';
        const grupos=agrupar(fc.features);
        const sumar=(f)=>{const k=claveLote(f.properties._lote);if(!grupos.has(k))grupos.set(k,[]);grupos.get(k).push(f);};
        if(modo==='agregar'){
          for(const k of Array.from(grupos.keys()))(await leerChunk(k)).filter(f=>!vistos.has(f.properties._id)).forEach(sumar);
        }else{ // reemplazar: conserva las palmas creadas en campo
          const campo=[];for(const k of Object.keys(META))(await leerChunk(k)).filter(f=>f.properties._nueva&&!vistos.has(f.properties._id)).forEach(f=>campo.push(f));
          await dbClear('palmas_lote');META={};campo.forEach(sumar);
        }
        for(const [k,fs] of grupos)await escribirChunk(k,fs);
        await guardarMeta();
        const importados=Array.from(grupos.keys());
        let base=lotesTrabajo().filter(z=>META[z]);
        if(fc.features.length<=8000)base=base.concat(importados);
        S.cfg.lotesTrabajo=ordenLotes([...new Set(base)]);await guardarCfg();await cargarTrabajo();
        if(fc.features.length>8000){fuente.cerrar();fuenteAbierta=null;
          elegirLotes(`Se guardaron ${fc.features.length.toLocaleString('es-CO')} palmas de ${importados.length} lotes en el dispositivo. Elija ahora los lotes con los que trabajará.`);return;}
      }
      fuente.cerrar();fuenteAbierta=null;
      cerrarHoja();encuadrar();actualizarCab();
      toast(`Capa de ${tipo} cargada: ${fc.features.length.toLocaleString('es-CO')} elementos.`,4000);
    }catch(e){alert('No se pudo importar:\n'+e.message);bt.disabled=false;bt.textContent='Importar';}
  };
}

/* ---------- Datos de ejemplo (para practicar) ---------- */
async function generarEjemplo(){
  if((S.lotes||Object.keys(META).length)&&!confirm('Esto reemplazará las capas de lotes y palmas actuales. ¿Continuar?'))return;
  const lat0=1.6420,lng0=-78.6050,kLat=1/111320,kLng=1/(111320*Math.cos(lat0*Math.PI/180));
  const ancho=200,alto=250,calle=20,dEntre=9,dLineas=9*Math.sqrt(3)/2,borde=4.5;
  const lotes=[],palmas=[];
  ['L01','L02','L03'].forEach((nom,i)=>{
    const x0=i*(ancho+calle);const P=(x,y)=>[lng0+x*kLng,lat0+y*kLat];
    lotes.push({type:'Feature',properties:{lote:nom,_lote:nom},geometry:{type:'Polygon',coordinates:[[P(x0,0),P(x0+ancho,0),P(x0+ancho,alto),P(x0,alto),P(x0,0)]]}});
    let linea=0;for(let x=x0+borde;x<=x0+ancho-borde;x+=dLineas){linea++;let num=0;const off=(linea%2)?0:dEntre/2;
      for(let y=borde+off;y<=alto-borde;y+=dEntre){num++;palmas.push({type:'Feature',properties:{_id:`${nom}-L${linea}-P${num}`,_lote:nom,_linea:String(linea),_num:String(num)},geometry:{type:'Point',coordinates:P(x,y)}});}}
  });
  S.lotes={type:'FeatureCollection',features:lotes};await dbPut('capas',{id:'lotes',fc:S.lotes});
  await dbClear('palmas_lote');META={};for(const [k,fs] of agrupar(palmas))await escribirChunk(k,fs);await guardarMeta();
  await fijarTrabajo(['L01','L02','L03']);cerrarHoja();
  toast('Se generaron 3 lotes de ejemplo con '+palmas.length+' palmas (siembra en triángulo de 9 m).');
}

/* ---------- Exportación ---------- */
function aCSV(cab,filas){const q=v=>{v=v==null?'':String(v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};return [cab.map(q).join(';'),...filas.map(f=>f.map(q).join(';'))].join('\r\n');}
function planos(r){
  const o={id:r.id,palma_id:r.palma_id,lote:r.lote,linea:r.linea,numero:r.numero,fecha:r.fecha,evaluador:r.evaluador,
    estado:r.estado,estado_nombre:(estadoDe(r.estado)||{}).n||'',problemas:(r.problemas||[]).join('|'),grado_pc:r.grado_pc,severidad:r.severidad,
    sintomas:(r.sintomas||[]).join('|'),accion:r.accion,observaciones:r.observaciones,n_fotos:(r.fotos||[]).length,
    fotos:(r.fotos||[]).map(f=>'fotos/'+f+'.jpg').join('|'),lat:r.lat,lng:r.lng,gps_lat:r.gps_lat,gps_lng:r.gps_lng,
    gps_precision_m:r.gps_acc,dist_gps_palma_m:r.dist_gps,creado:r.creado,modificado:r.modificado};
  PROBLEMAS.forEach(p=>o['p_'+p.id]=(r.problemas||[]).includes(p.id)?1:0);
  return o;
}
function regsFiltrados(soloUlt){return soloUlt?Array.from(S.ultimo.values()):S.registros.slice();}
function geojsonRegs(rs){return {type:'FeatureCollection',features:rs.filter(r=>r.lat!=null).map(r=>({type:'Feature',geometry:{type:'Point',coordinates:[r.lng,r.lat]},properties:planos(r)}))};}
function csvRegs(rs){if(!rs.length)return '﻿';const cab=Object.keys(planos(rs[0]));return '﻿'+aCSV(cab,rs.map(r=>{const o=planos(r);return cab.map(k=>o[k]);}));}
function kmlRegs(rs){
  const x=s=>String(s??'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
  const estilos=ESTADOS.map(e=>`<Style id="${e.id}"><IconStyle><color>ff${e.c.slice(5,7)}${e.c.slice(3,5)}${e.c.slice(1,3)}</color><scale>0.7</scale><Icon><href>http://maps.google.com/mapfiles/kml/shapes/placemark_circle.png</href></Icon></IconStyle></Style>`).join('');
  const pm=rs.filter(r=>r.lat!=null).map(r=>{const o=planos(r);return `<Placemark><name>${x(r.palma_id)}</name><styleUrl>#${x(r.estado)}</styleUrl><ExtendedData>${Object.entries(o).map(([k,v])=>`<Data name="${k}"><value>${x(v)}</value></Data>`).join('')}</ExtendedData><Point><coordinates>${r.lng},${r.lat}</coordinates></Point></Placemark>`;}).join('');
  return `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Sanidad palma ${hoyArchivo()}</name>${estilos}${pm}</Document></kml>`;
}
function descargar(blob,nombre){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);}
async function compartir(blob,nombre){
  try{const file=new File([blob],nombre,{type:blob.type||'application/octet-stream'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:nombre});return;}}
  catch(e){if(e.name==='AbortError')return;}
  descargar(blob,nombre);
}
async function zipCompleto(){
  const z=new JSZip();const rs=S.registros;
  z.file('registros.geojson',JSON.stringify(geojsonRegs(rs)));
  z.file('registros.csv',csvRegs(rs));
  z.file('ultimo_estado_por_palma.geojson',JSON.stringify(geojsonRegs(regsFiltrados(true))));
  z.file('registros.kml',kmlRegs(rs));
  if(S.lotes)z.file('capas/lotes.geojson',JSON.stringify(S.lotes));
  const todas=await todasLasPalmas();if(todas.length)z.file('capas/palmas.geojson',JSON.stringify({type:'FeatureCollection',features:todas}));
  for(const r of rs)for(const fid of (r.fotos||[])){const f=await dbGet('fotos',fid);if(f)z.file('fotos/'+fid+'.jpg',f.buf);}
  return await z.generateAsync({type:'blob',compression:'DEFLATE'});
}

/* ---------- Respaldo y restauración ---------- */
const aB64=buf=>{const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);};
const deB64=s=>{const t=atob(s);const b=new Uint8Array(t.length);for(let i=0;i<t.length;i++)b[i]=t.charCodeAt(i);return b.buffer;};
async function respaldar(){
  toast('Creando respaldo…',8000);
  const fotos=(await dbAll('fotos')).map(f=>({id:f.id,registro_id:f.registro_id,type:f.type,b64:aB64(f.buf)}));
  const data={app:'sanidad_palma',version:VERSION,fecha:new Date().toISOString(),cfg:S.cfg,lotes:S.lotes,palmas:{type:'FeatureCollection',features:await todasLasPalmas()},registros:S.registros,fotos};
  const z=new JSZip();z.file('respaldo.json',JSON.stringify(data));
  compartir(await z.generateAsync({type:'blob',compression:'DEFLATE'}),`respaldo_sanidad_${hoyArchivo()}.zip`);
}
function restaurar(){
  const inp=$('#inArchivo');inp.accept='.zip,.json';inp.value='';
  inp.onchange=async()=>{const file=inp.files[0];if(!file)return;
    try{let txt;if(file.name.toLowerCase().endsWith('.zip')){const z=await JSZip.loadAsync(file);const f=z.file('respaldo.json');if(!f)throw new Error('El ZIP no contiene respaldo.json');txt=await f.async('string');}else txt=await file.text();
      const d=JSON.parse(txt);if(d.app!=='sanidad_palma')throw new Error('El archivo no es un respaldo de esta aplicación.');
      const modo=confirm('ACEPTAR = combinar con los datos actuales (recomendado, p. ej. para unir datos de varios evaluadores).\nCANCELAR = no hacer nada.');if(!modo)return;
      if(d.lotes&&!S.lotes){S.lotes=d.lotes;await dbPut('capas',{id:'lotes',fc:S.lotes});}
      if(d.palmas&&d.palmas.features){for(const [k,fs] of agrupar(d.palmas.features)){const prev=await leerChunk(k);const ids=new Set(prev.map(f=>f.properties._id));await escribirChunk(k,prev.concat(fs.filter(f=>!ids.has(f.properties._id))));}await guardarMeta();}
      for(const f of (d.fotos||[]))await dbPut('fotos',{id:f.id,registro_id:f.registro_id,type:f.type,buf:deB64(f.b64)});
      for(const r of (d.registros||[]))await dbPut('registros',r);
      S.registros=await dbAll('registros');recalcUltimo();await cargarTrabajo();cerrarHoja();
      toast('Respaldo restaurado: '+(d.registros||[]).length+' diagnósticos.');
    }catch(e){alert('No se pudo restaurar:\n'+e.message);}};
  inp.click();
}

/* ---------- Mapas para uso sin conexión ---------- */
const lon2x=(l,z)=>Math.floor((l+180)/360*2**z);
const lat2y=(a,z)=>{const r=a*Math.PI/180;return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*2**z);};
async function guardarZona(){
  if(!('caches' in window)){alert('Esta función requiere abrir la aplicación desde una dirección https:// (vea la guía).');return;}
  const url=urlBase();if(!url){alert('Seleccione primero un mapa base.');return;}
  if(!navigator.onLine){alert('Necesita conexión a internet para descargar el mapa.');return;}
  const b=mapa.getBounds(),z0=Math.max(13,mapa.getZoom()),zTope=S.cfg.base==='propia'?Number(S.cfg.zmaxPropia||20):19,z1=Math.min(zTope,z0+3);
  const L1=[];for(let z=z0;z<=z1;z++){const xa=lon2x(b.getWest(),z),xb=lon2x(b.getEast(),z),ya=lat2y(b.getNorth(),z),yb=lat2y(b.getSouth(),z);
    for(let x=xa;x<=xb;x++)for(let y=ya;y<=yb;y++)L1.push(url.replace('{z}',z).replace('{x}',x).replace('{y}',y).replace('{s}','a'));}
  const MAX=S.cfg.base==='propia'?20000:2500;
  if(L1.length>MAX){alert(`La zona visible requiere ${L1.length} teselas (máximo ${MAX}). Acerque más el mapa e inténtelo de nuevo.`);return;}
  if(!confirm(`Se descargarán ${L1.length} teselas (zoom ${z0} a ${z1}) para usar sin conexión. ¿Continuar?`))return;
  const c=await caches.open('teselas-v1');let ok=0,fal=0,i=0;
  const trabajador=async()=>{while(i<L1.length){const u=L1[i++];try{if(await c.match(u)){ok++;continue;}const r=await fetch(u,{mode:'cors'});if(r.ok){await c.put(u,r);ok++;}else fal++;}catch(e){fal++;}
    if((ok+fal)%50===0)toast(`Descargando mapa… ${ok+fal}/${L1.length}`,4000);}};
  await Promise.all(Array.from({length:6},trabajador));
  toast(`Mapa guardado: ${ok} teselas${fal?` (${fal} fallidas)`:''}.`,5000);
}
async function borrarMapas(){if(!('caches' in window))return;if(!confirm('¿Borrar los mapas base guardados? (Los lotes, palmas y diagnósticos NO se borran).'))return;await caches.delete('teselas-v1');toast('Mapas guardados eliminados.');}

    if(navigator.storage&&navigator.storage.persisted)t+=(await navigator.storage.persisted())?' Almacenamiento protegido ✔':' Almacenamiento no protegido (instale la app para protegerlo).';}catch(e){}
  return t;
}

    <p class="tenue" id="mAlmacen"></p>

  const on=(id,fn)=>{const e=$(id);if(e)e.onclick=fn;};

  on('#mExportar',menuExportar);on('#mRespaldo',respaldar);on('#mRestaurar',restaurar);on('#mConfig',()=>abrirConfig(false));
  on('#mZona',()=>{cerrarHoja();setTimeout(guardarZona,300);});on('#mBorrarMapas',borrarMapas);
  on('#mBorrarTodo',async()=>{if(!confirm('Se borrarán TODOS los lotes, palmas, diagnósticos y fotos de este dispositivo. ¿Ya exportó o respaldó sus datos?'))return;if(prompt('Escriba BORRAR para confirmar')!=='BORRAR')return;
    for(const s of ['capas','registros','fotos','palmas_lote'])await dbClear(s);META={};await guardarMeta();S.cfg.lotesTrabajo=[];await guardarCfg();S.lotes=null;S.palmas=null;S.registros=[];recalcUltimo();indexar();dibujarLotes();dibujarPalmas();actualizarCab();cerrarHoja();toast('Datos borrados.');});
  $('#mAlmacen').textContent=await infoAlmacen();
}

/* ---------- Arranque ---------- */
(async function iniciar(){
  pintarLeyenda();
  try{await abrirDB();}catch(e){alert('No fue posible abrir el almacenamiento local del navegador: '+e.message);return;}
  const c=await dbGet('config','cfg');if(c)Object.assign(S.cfg,c.v);
  const l=await dbGet('capas','lotes');if(l)S.lotes=l.fc;
  const m=await dbGet('config','lotesMeta');META=m?m.v:{};
  indexar();
  const viejo=await dbGet('capas','palmas'); // migración desde v1.0/v1.1 (palmas en un solo bloque)
  if(viejo&&viejo.fc){const g=agrupar(viejo.fc.features);for(const [k,fs] of g)await escribirChunk(k,fs);await guardarMeta();await dbDel('capas','palmas');
    if(!lotesTrabajo().length&&viejo.fc.features.length<=8000)S.cfg.lotesTrabajo=Array.from(g.keys());await guardarCfg();}
  S.cfg.lotesTrabajo=lotesTrabajo().filter(z=>META[z]);
  S.registros=await dbAll('registros');recalcUltimo();
  ponerBase();await cargarTrabajo();encuadrar();iniciarGPS();
  if(S.cfg.evaluador&&!S.palmas&&Object.keys(META).length)setTimeout(()=>elegirLotes('Elija los lotes con los que trabajará hoy.'),600);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(!S.cfg.evaluador)setTimeout(()=>abrirConfig(true),500);
})();
