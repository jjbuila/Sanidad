<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06140f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sanidad Vegetal · Palmas de Tumaco</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>/*LEAFLET_CSS*/</style>
<style>/*FUENTES*/</style>
<style>
:root{
  --fondo:#06140f;--panel:rgba(8,25,19,.82);--panel2:#0c2219;--borde:rgba(144,205,241,.18);--borde2:rgba(255,255,255,.10);
  --texto:#eaf5f0;--tenue:#94b6a9;--acento:#22d39a;--acento2:#0f9d6b;--marca:#036545;--naranja:#ee7633;--azul:#2f93d5;--celeste:#90cdf1;
  --rojo:#ff5d5d;--ambar:#ffc53d;--sup:env(safe-area-inset-top,0px);--inf:env(safe-area-inset-bottom,0px);
  --hud:58px;--dock:76px;--t:'Rajdhani',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--fondo);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.glass{background:var(--panel);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid var(--borde);box-shadow:0 12px 32px rgba(0,0,0,.45)}
.ic svg,svg.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tit,h2,h3,.num{font-family:var(--t)}

/* ---------- Pantalla de inicio ---------- */
#splash{position:fixed;inset:0;z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;
  background:radial-gradient(120% 80% at 50% 0%,#0d3a2a 0%,#06140f 60%);transition:opacity .4s}
#splash.fuera{opacity:0;pointer-events:none}
.tarjeta-logo{background:#fff;border-radius:22px;padding:18px 26px;box-shadow:0 0 0 1px rgba(255,255,255,.4),0 20px 60px rgba(0,0,0,.5),0 0 60px rgba(34,211,154,.18)}
.tarjeta-logo img{display:block;width:min(70vw,300px);height:auto}
#splash .tit{font-size:26px;letter-spacing:6px;font-weight:700;text-align:center}
#splash .tit small{display:block;font-size:13px;letter-spacing:2px;color:var(--tenue);font-weight:600;margin-top:4px}
.carga{width:min(70vw,280px);height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.carga i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--acento),transparent);animation:barrido 1.2s infinite}
@keyframes barrido{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
#splashMsg{color:var(--tenue);font-size:13px;min-height:18px;text-align:center}

/* ---------- Ingreso ---------- */
#login{position:fixed;inset:0;z-index:4500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;overflow:auto;
  background:radial-gradient(120% 80% at 50% 0%,#0d3a2a 0%,#06140f 60%)}
#login .tit{font-size:24px;letter-spacing:6px;font-weight:700;text-align:center}
#login .tit small{display:block;font-size:12.5px;letter-spacing:2px;color:var(--tenue);font-weight:600;margin-top:4px}
#frmLogin{width:min(92vw,380px);border-radius:22px;padding:6px 18px 18px}
#lgMsg{min-height:20px;text-align:center;margin:8px 0 0}
#lgRed{font-size:12.5px;color:var(--tenue);text-align:center}

/* ---------- Cabecera ---------- */
#hud{position:fixed;top:0;left:0;right:0;z-index:1000;padding:calc(var(--sup) + 8px) 10px 8px;display:flex;align-items:center;gap:9px;
  background:linear-gradient(180deg,rgba(6,20,15,.96),rgba(6,20,15,.78));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--borde)}
.insignia{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 0 0 2px rgba(34,211,154,.45),0 0 18px rgba(34,211,154,.3)}
.insignia img{width:32px;height:32px;object-fit:contain}
.marca{flex:1;min-width:0;line-height:1.05}
.marca b{font-family:var(--t);font-size:19px;letter-spacing:2.5px;font-weight:700;display:block;white-space:nowrap}
.marca small{display:block;color:var(--tenue);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chips-hud{display:flex;gap:5px;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--t);font-weight:700;font-size:13px;letter-spacing:.4px;padding:4px 9px;border-radius:999px;border:1px solid var(--borde2);background:rgba(255,255,255,.06);white-space:nowrap;line-height:1.2}
.chip .led{width:8px;height:8px;border-radius:50%;background:var(--tenue);flex:none}
.chip.ok .led{background:var(--acento);box-shadow:0 0 8px var(--acento)}
.chip.med .led{background:var(--ambar);box-shadow:0 0 8px var(--ambar)}
.chip.mal .led{background:var(--rojo);box-shadow:0 0 8px var(--rojo)}
.chip.pend{border-color:rgba(238,118,51,.6);color:#ffc7a8}
.chip.gira svg{animation:gira 1s linear infinite}
.chip svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@keyframes gira{to{transform:rotate(360deg)}}
@media(max-width:400px){.marca small{display:none}.marca b{font-size:16px;letter-spacing:1.5px}.chip{padding:4px 7px;font-size:12px}}

/* ---------- Mapa ---------- */
#mapa{position:fixed;top:0;left:0;right:0;bottom:calc(var(--dock) + var(--inf));background:#0b1b15}
.leaflet-container{font:inherit;background:#0b1b15}
.leaflet-bar a{background:var(--panel)!important;color:var(--texto)!important;border-color:var(--borde)!important;backdrop-filter:blur(10px)}
.leaflet-control-attribution{background:rgba(6,20,15,.6)!important;color:#9bb!important;font-size:10px}
.leaflet-control-attribution a{color:#bdd!important}
.leaflet-control-scale-line{background:rgba(6,20,15,.6);color:#dfe;border-color:#9bb}
.etq-lote{background:rgba(6,20,15,.78);color:#d8efe6;border:1px solid rgba(144,205,241,.35);border-radius:6px;font-family:var(--t);font-weight:700;font-size:12.5px;letter-spacing:.5px;padding:0 6px;box-shadow:none}
.etq-lote:before{display:none}
.etq-lote.sel{background:var(--naranja);color:#fff;border-color:#fff}
.etq-lote.jor{background:var(--acento2);color:#fff;border-color:#bff5df}
.sin-etiquetas .etq-lote{display:none}

/* ---------- Paneles superiores ---------- */
#superior{position:fixed;top:calc(var(--sup) + var(--hud) + 8px);left:10px;right:10px;z-index:950;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#superior>*{pointer-events:auto}
@media(min-width:900px){#superior{right:auto;width:440px}}
#pj{border-radius:16px;padding:9px 12px 10px;cursor:pointer}
.pj-fila{display:flex;align-items:center;gap:10px;font-family:var(--t);font-weight:700;font-size:18px;letter-spacing:.5px}
.pj-fila .sep{width:1px;height:18px;background:var(--borde)}
.pj-fila.pj2{font-size:15.5px;margin-top:5px}
.pj-fila small{font-size:12px;color:var(--tenue);font-weight:600;letter-spacing:1px;margin-right:2px}
.rec{width:11px;height:11px;border-radius:50%;background:var(--rojo);box-shadow:0 0 0 0 rgba(255,93,93,.7);animation:latido 1.6s infinite;flex:none}
@keyframes latido{0%{box-shadow:0 0 0 0 rgba(255,93,93,.7)}70%{box-shadow:0 0 0 10px rgba(255,93,93,0)}100%{box-shadow:0 0 0 0 rgba(255,93,93,0)}}
.barra{height:6px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento2),var(--acento));box-shadow:0 0 10px var(--acento);transition:width .4s}
#guia{border-radius:16px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;border-left:4px solid var(--tenue)}
#guia.cerca{border-left-color:var(--acento);box-shadow:0 0 0 1px rgba(34,211,154,.5),0 0 26px rgba(34,211,154,.35)}
#guia.mala{border-left-color:var(--ambar)}
#guia .txt{flex:1;min-width:0}
#guiaTxt{font-family:var(--t);font-size:26px;font-weight:700;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
#guiaSub{font-size:12.5px;color:var(--tenue)}
.redondo{width:46px;height:46px;border-radius:14px;border:1px solid var(--borde);background:rgba(255,255,255,.07);display:grid;place-items:center;flex:none}
.redondo:active{background:rgba(255,255,255,.15)}

/* ---------- Botones flotantes ---------- */
#flot{position:fixed;right:10px;bottom:calc(var(--dock) + var(--inf) + 96px);z-index:900;display:flex;flex-direction:column;gap:10px}
#flot button{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:var(--texto)}
#flot button.on{color:#06140f;background:var(--acento);box-shadow:0 0 22px rgba(34,211,154,.55);border-color:transparent}
#btLeyenda{position:fixed;left:10px;bottom:calc(var(--dock) + var(--inf) + 34px);z-index:900;border-radius:12px;padding:7px 11px;font-size:12.5px;font-family:var(--t);font-weight:700;letter-spacing:1px;color:var(--texto)}
#leyenda{position:fixed;left:10px;bottom:calc(var(--dock) + var(--inf) + 76px);z-index:900;border-radius:14px;padding:10px 12px;font-size:13px}
#leyenda div{display:flex;align-items:center;gap:8px;margin:3px 0}
.punto{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.6);display:inline-block;flex:none}

/* ---------- Barra inferior ---------- */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:1000;height:calc(var(--dock) + var(--inf));padding:6px 6px var(--inf);display:grid;grid-template-columns:1fr 1fr 1.25fr 1fr 1fr;align-items:end;border-radius:20px 20px 0 0;border-bottom:0}
#dock>button{border:0;background:transparent;color:var(--tenue);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:62px;border-radius:14px;font-family:var(--t);font-weight:700;font-size:12.5px;letter-spacing:.6px;text-transform:uppercase}
#dock>button:active,#dock>button.on{color:var(--acento);background:rgba(34,211,154,.08)}
#dock>button.central{height:auto;padding-bottom:6px;color:var(--texto)}
.anillo{width:64px;height:64px;margin-top:-30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ff9a5c,var(--naranja) 55%,#c4531b);box-shadow:0 0 0 4px var(--fondo),0 0 0 5px rgba(238,118,51,.6),0 8px 28px rgba(238,118,51,.55);color:#fff}
.anillo svg{width:28px;height:28px}
.central.activa .anillo{background:linear-gradient(145deg,#4ff0b8,var(--acento2) 60%,#066b46);box-shadow:0 0 0 4px var(--fondo),0 0 0 5px rgba(34,211,154,.7),0 8px 30px rgba(34,211,154,.6);animation:respira 2.4s infinite}
@keyframes respira{50%{box-shadow:0 0 0 4px var(--fondo),0 0 0 8px rgba(34,211,154,.25),0 8px 36px rgba(34,211,154,.75)}}

/* ---------- Hoja (panel deslizante) ---------- */
#hoja{position:fixed;left:0;right:0;bottom:0;z-index:2000;max-height:88vh;display:flex;flex-direction:column;border-radius:24px 24px 0 0;transition:transform .26s cubic-bezier(.2,.8,.2,1);background:rgba(7,22,17,.94)}
#hoja.media{max-height:58vh}
#hoja.oculto{transform:translateY(110%)}
@media(min-width:900px){#hoja{left:auto;right:14px;top:calc(var(--sup) + var(--hud) + 14px);bottom:14px;width:470px;max-height:none;border-radius:22px}#hoja.media{max-height:none}#hoja.oculto{transform:translateX(115%)}}
.asa{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:8px auto 0;flex:none}
.hoja-cab{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 18px;border-bottom:1px solid var(--borde2)}
.hoja-cab h2{flex:1;margin:0;font-size:21px;letter-spacing:1px;font-weight:700}
#hojaCuerpo{overflow:auto;padding:12px 16px calc(22px + var(--inf));-webkit-overflow-scrolling:touch}
.icono{background:transparent;border:0;color:var(--texto);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px}
.icono:active{background:rgba(255,255,255,.1)}
h3{font-size:14px;margin:18px 0 8px;color:var(--acento);text-transform:uppercase;letter-spacing:1.6px;font-weight:700}
.tenue{color:var(--tenue);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--borde);background:rgba(255,255,255,.06);color:var(--texto);padding:12px 14px;border-radius:14px;font-family:var(--t);font-weight:700;font-size:16px;letter-spacing:.8px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45}
.btn svg{width:20px;height:20px}
.btn.prim{background:linear-gradient(145deg,#26d9a0,var(--acento2));border-color:transparent;color:#032a1d;box-shadow:0 6px 20px rgba(34,211,154,.3)}
.btn.nar{background:linear-gradient(145deg,#ff9a5c,var(--naranja));border-color:transparent;color:#fff;box-shadow:0 6px 20px rgba(238,118,51,.35)}
.btn.peligro{color:#ffb3b3;border-color:rgba(255,93,93,.45);background:rgba(255,93,93,.08)}
.btn.ancho{width:100%;margin:6px 0}
.btn.grande{padding:16px;font-size:19px;letter-spacing:2px}
.fila{display:flex;gap:8px;flex-wrap:wrap}
.fila>*{flex:1;min-width:0}
label.campo{display:block;margin:13px 0 5px;font-weight:600;font-size:13px;color:#cfe6dc;letter-spacing:.3px}
label.campo i{color:var(--rojo);font-style:normal}
input[type=text],input[type=number],input[type=password],input[type=url],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--borde2);border-radius:12px;background:rgba(255,255,255,.06);font-size:15px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acento);box-shadow:0 0 0 3px rgba(34,211,154,.18)}
select option{background:#0c2219;color:#eaf5f0}
textarea{min-height:80px;resize:vertical}
input.mini{width:64px;padding:7px 8px;text-align:center}
fieldset{border:0;padding:0;margin:0;min-width:0}
fieldset:disabled .chip-op span{opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip-op{position:relative}
.chip-op input{position:absolute;opacity:0;pointer-events:none}
.chip-op span{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--borde2);border-radius:999px;font-size:13.5px;background:rgba(255,255,255,.05);user-select:none;cursor:pointer}
.chip-op input:checked+span{background:var(--acento);border-color:var(--acento);color:#032a1d;font-weight:700;box-shadow:0 0 14px rgba(34,211,154,.35)}
.chip-op input:focus-visible+span{outline:2px solid var(--celeste)}
.ficha{background:rgba(255,255,255,.05);border:1px solid var(--borde2);border-radius:14px;padding:11px 13px;font-size:14px;line-height:1.6}
.ficha.gran{display:flex;align-items:center;gap:12px}
.ficha .big{font-family:var(--t);font-size:30px;font-weight:700;letter-spacing:1px;line-height:1}
.coord{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--tenue)}
.aviso{background:rgba(255,197,61,.10);border:1px solid rgba(255,197,61,.45);color:#ffe6a6;border-radius:12px;padding:9px 11px;font-size:13px;margin:8px 0}
.candado{background:rgba(144,205,241,.10);border:1px solid rgba(144,205,241,.45);color:#d4ecfb;border-radius:12px;padding:9px 11px;font-size:13px;margin:8px 0}
.tarjeta{border:1px solid var(--borde2);border-left:5px solid #999;border-radius:12px;padding:9px 11px;margin:7px 0;cursor:pointer;font-size:13.5px;background:rgba(255,255,255,.04)}
.tarjeta:active{background:rgba(255,255,255,.09)}
.tarjeta b{font-size:14.5px}
.fotos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.foto{position:relative;width:84px;height:84px;border-radius:12px;overflow:hidden;background:#123}
.foto img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.foto button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(255,255,255,.05);border:1px solid var(--borde2);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--t);font-size:24px;font-weight:700;color:var(--acento);line-height:1.1}
.stat span{font-size:11.5px;color:var(--tenue);text-transform:uppercase;letter-spacing:.8px}
.pasos{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--tenue);margin-bottom:10px;align-items:center}
.pasos b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--naranja);color:#fff;font-family:var(--t);font-size:13px;margin-right:4px}
.lista-lotes{max-height:24vh;overflow:auto;border:1px solid var(--borde2);border-radius:14px;padding:8px;margin-top:8px}
.sel-item{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border:1px solid rgba(238,118,51,.45);background:rgba(238,118,51,.08);border-radius:12px;margin:6px 0;font-size:13.5px}
.sel-item b{font-family:var(--t);font-size:18px;letter-spacing:.5px;min-width:52px}
.sel-item .crece{flex:1 1 90px;font-size:12.5px}
.sel-item [data-q]{margin-left:auto;width:36px;height:36px}
.prog-lote{display:grid;grid-template-columns:60px 1fr 86px;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.prog-lote b{font-family:var(--t);font-size:16px}
.menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mosaico{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:16px;border:1px solid var(--borde2);background:rgba(255,255,255,.05);text-align:left;color:var(--texto);min-height:96px}
.mosaico svg{color:var(--acento)}
.mosaico b{font-family:var(--t);font-size:17px;letter-spacing:.5px}
.mosaico small{color:var(--tenue);font-size:12px;line-height:1.3}
.mosaico:active{background:rgba(255,255,255,.1)}
.logo-menu{background:#fff;border-radius:16px;padding:10px 16px;display:flex;justify-content:center;margin-bottom:12px}
.logo-menu img{height:54px;width:auto}

/* ---------- Base de datos ---------- */
#bd{position:fixed;inset:0;z-index:1500;background:var(--fondo);display:flex;flex-direction:column}
.bd-cab{display:flex;align-items:center;gap:8px;padding:calc(var(--sup) + 8px) 10px 8px;border-bottom:1px solid var(--borde);background:linear-gradient(180deg,#0b261c,#06140f)}
.bd-cab .tit{flex:1;line-height:1.1}
.bd-cab .tit b{display:block;font-size:21px;letter-spacing:2px}
.bd-cab .tit small{color:var(--tenue);font-family:system-ui;font-size:12px}
.tabs{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--borde2);overflow:auto}
.tabs button{border:1px solid var(--borde2);background:transparent;color:var(--tenue);border-radius:999px;padding:7px 14px;font-family:var(--t);font-weight:700;font-size:15px;letter-spacing:.8px;white-space:nowrap}
.tabs button.on{background:var(--acento);color:#032a1d;border-color:var(--acento)}
#bdCuerpo{flex:1;overflow:auto;padding:10px 10px calc(16px + var(--inf))}
.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.filtros select,.filtros input{padding:9px 10px;font-size:14px}
.resumen-bd{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.tabla-cont{overflow:auto;border:1px solid var(--borde2);border-radius:14px;max-height:calc(100vh - 290px)}
table.tabla{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;white-space:nowrap}
table.tabla th{position:sticky;top:0;background:#0f2a20;font-family:var(--t);font-weight:700;letter-spacing:.8px;text-transform:uppercase;font-size:13px;text-align:left;padding:9px 10px;border-bottom:1px solid var(--borde);cursor:pointer;user-select:none;z-index:1}
table.tabla th.ord:after{content:' ▾';color:var(--acento)}
table.tabla th.ord.asc:after{content:' ▴'}
table.tabla td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.06)}

  'Racimos podridos','Galerías u orificios','Exudados','Lesiones en estípite','Raíces afectadas','Defoliación'];

/* ---------- Íconos ---------- */
const IC={
  ubic:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg>',

  sync:'<svg class="ic" viewBox="0 0 24 24"><path d="M20 12a8 8 0 01-14.2 5"/><path d="M4 12A8 8 0 0118.2 7"/><path d="M18.5 3v4.2h-4.2M5.5 21v-4.2h4.2"/></svg>',
  ok:'<svg class="ic" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></svg>',
  nube:'<svg class="ic" viewBox="0 0 24 24"><path d="M7 18.5h10.5a4 4 0 00.6-8 6 6 0 00-11.6 1.5A3.3 3.3 0 007 18.5z"/><path d="M12 15.5v-6M9.5 12l2.5-2.5 2.5 2.5"/></svg>',
  alerta:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.5v.3"/></svg>',
  ruta:'<svg class="ic" viewBox="0 0 24 24"><circle cx="5.5" cy="18.5" r="2.2"/><circle cx="18.5" cy="5.5" r="2.2"/><path d="M7.7 18.5H15a3.5 3.5 0 000-7H9a3.5 3.5 0 010-7h7.3"/></svg>',

  config:'<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12H5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>',

  instalar:'<svg class="ic" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M12 7.5v7M9 12l3 3 3-3"/></svg>',

  repetir:'<svg class="ic" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0113.7-5.6L20 8.5"/><path d="M20 3.5v5h-5"/><path d="M20 12a8 8 0 01-13.7 5.6L4 15.5"/><path d="M4 20.5v-5h5"/></svg>',

};
document.querySelectorAll('[data-ic]').forEach(e=>e.insertAdjacentHTML('afterbegin',IC[e.dataset.ic]));

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,12);
const estadoDe=id=>ESTADOS.find(e=>e.id===id);
const probDe=id=>PROBLEMAS.find(p=>p.id===id);
const pad=n=>String(n).padStart(2,'0');
const num=x=>Number(x||0).toLocaleString('es-CO');
const esperar=ms=>new Promise(r=>setTimeout(r,ms));
function toast(m,ms=2800){const t=$('#toast');t.textContent=m;t.classList.add('ver');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('ver'),ms);}
function fmtDur(ms){ms=Math.max(0,ms||0);const s=Math.floor(ms/1000);return pad(Math.floor(s/3600))+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60);}
function fmtHora(t){const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());}
function fmtFecha(t){if(!t)return'';const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function fechaLocal(t){const d=t?new Date(t):new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function ahoraLocal(){const d=new Date();return `${fechaLocal(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function dist(a,b,c,d){const R=6371000,r=Math.PI/180;const dl=(c-a)*r,dg=(d-b)*r;const h=Math.sin(dl/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const aB64=buf=>{const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);};
const textoB64=t=>btoa(unescape(encodeURIComponent(t)));
const b64Texto=b=>decodeURIComponent(escape(atob(b)));
const ordenNat=(a,b)=>String(a).localeCompare(String(b),'es',{numeric:true});

/* ---------- Almacenamiento local (IndexedDB) ---------- */
const DB={db:null};
function abrirDB(){return new Promise((res,rej)=>{
  const r=indexedDB.open('sanidad_palma_v2',1);
  r.onupgradeneeded=()=>{const d=r.result;
    d.createObjectStore('config',{keyPath:'clave'});
    d.createObjectStore('capas',{keyPath:'id'});
    d.createObjectStore('palmas_lote',{keyPath:'lote'});
    d.createObjectStore('registros',{keyPath:'id'}).createIndex('jornada','jornada_id');
    d.createObjectStore('fotos',{keyPath:'id'});
    d.createObjectStore('jornadas',{keyPath:'id'});
    const t=d.createObjectStore('track',{keyPath:'k',autoIncrement:true});t.createIndex('j','j');t.createIndex('s','s');
  };
  r.onsuccess=()=>{DB.db=r.result;res();};
  r.onerror=()=>rej(r.error);
});}
function op(store,mode,fn){return new Promise((res,rej)=>{
  const t=DB.db.transaction(store,mode);const q=fn(t.objectStore(store));
  t.oncomplete=()=>res(q&&'result' in q?q.result:undefined);t.onerror=t.onabort=()=>rej(t.error);
});}
const dbGet=(s,k)=>op(s,'readonly',o=>o.get(k));
const dbAll=s=>op(s,'readonly',o=>o.getAll());
const dbPut=(s,v)=>op(s,'readwrite',o=>o.put(v));
const dbDel=(s,k)=>op(s,'readwrite',o=>o.delete(k));
const dbClear=s=>op(s,'readwrite',o=>o.clear());
const dbIndice=(s,i,v)=>op(s,'readonly',o=>o.index(i).getAll(v));
const dbContar=(s,i,v)=>op(s,'readonly',o=>o.index(i).count(v));
function dbPutVarios(s,arr){return new Promise((res,rej)=>{const t=DB.db.transaction(s,'readwrite');const o=t.objectStore(s);arr.forEach(v=>o.put(v));t.oncomplete=()=>res();t.onerror=t.onabort=()=>rej(t.error);});}

/* ---------- Estado ---------- */
const S={
  lotes:null,palmas:null,idx:new Map(),registros:[],ultimo:new Map(),hechos:new Map(),marcadores:new Map(),
  gps:null,seguir:false,jornada:null,plan:[],planAbierto:false,planModo:'nueva',

    umbralVoz:4,precisionVoz:15,velocidadVoz:1,precisionTrack:30,densidad:115,bufferVisita:10,soloWifi:true,esperaSync:2,jornadaActiva:null,
    gh:{owner:'jjbuila',repo:'Sanidad-datos',rama:'main',token:''}}
};
let CARTO={version:'',lotes:{}};
async function guardarCfg(){await dbPut('config',{clave:'cfg',v:{...S.cfg,gh:{...S.cfg.gh,token:''}}});actualizarCab();}

/* ---------- Capas de interfaz y botón «atrás» de Android ---------- */
const PILA=[];let guardia=false;
function abrirCapa(n){if(!PILA.includes(n))PILA.push(n);if(!guardia){history.pushState({g:1},'');guardia=true;}}
function cerrarCapa(n){const i=PILA.indexOf(n);if(i>=0)PILA.splice(i,1);cerrarVisual(n);}

/* ---------- Mapa ---------- */
const mapa=L.map('mapa',{preferCanvas:true,zoomControl:false,maxZoom:22,attributionControl:true}).setView([1.6,-78.75],11);
L.control.zoom({position:'bottomright'}).addTo(mapa);
L.control.scale({imperial:false,position:'bottomleft'}).addTo(mapa);
const rend=L.canvas({padding:.5,tolerance:8});
const capaLotes=L.layerGroup().addTo(mapa);
const capaTrack=L.layerGroup().addTo(mapa);
const capaPalmas=L.layerGroup().addTo(mapa);
const capaGps=L.layerGroup().addTo(mapa);
let resalte=null;
const BASES={
  esri:{n:'Satélite (Esri World Imagery)',url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',a:'Imágenes © Esri',max:19},
  osm:{n:'Calles (OpenStreetMap)',url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',a:'© colaboradores de OpenStreetMap',max:19},
  propia:{n:'Ortofoto propia (teselas XYZ)',url:'',a:'Ortofoto Palmas de Tumaco',max:20},
  ninguna:{n:'Sin mapa base',url:''}
};
let capaBase=null;
function urlBase(){return S.cfg.base==='propia'?S.cfg.urlPropia:(BASES[S.cfg.base]||{}).url;}
function ponerBase(){
  if(capaBase){mapa.removeLayer(capaBase);capaBase=null;}
  const b=BASES[S.cfg.base]||BASES.esri;const url=urlBase();if(!url)return;
  const zmax=S.cfg.base==='propia'?Number(S.cfg.zmaxPropia||20):b.max;
  capaBase=L.tileLayer(url,{maxZoom:22,maxNativeZoom:zmax,attribution:b.a,crossOrigin:true}).addTo(mapa);capaBase.bringToBack();
}
function radioPalma(){const z=mapa.getZoom();return z>=20?10:z>=19?8:z>=18?6:z>=17?4.5:z>=16?3:z>=15?2:1.4;}
mapa.on('moveend',()=>{mapa.getContainer().classList.toggle('sin-etiquetas',mapa.getZoom()<13);dibujarPalmas();if(resalte)resalte.setRadius(radioPalma()+6);});
mapa.on('dragstart',()=>{if(S.seguir){S.seguir=false;$('#btUbic').classList.remove('on');}});

/* ---------- Lotes ---------- */
const enJornada=l=>!!(S.jornada&&S.jornada.seleccion.some(p=>p.lote===l));
const enPlan=l=>S.plan.some(p=>p.lote===l);
function estiloLote(f){const l=f.properties._lote;
  if(S.planAbierto&&enPlan(l))return {color:'#ee7633',weight:3,opacity:1,fillColor:'#ee7633',fillOpacity:.28};
  if(enJornada(l))return {color:'#22d39a',weight:2.5,opacity:1,fillColor:'#22d39a',fillOpacity:.07};
  return {color:'#90cdf1',weight:1.2,opacity:.8,fillColor:'#90cdf1',fillOpacity:.04};
}
function claseEtiqueta(l){return 'etq-lote'+(S.planAbierto&&enPlan(l)?' sel':enJornada(l)?' jor':'');}
function dibujarLotes(){
  capaLotes.clearLayers();if(!S.lotes)return;
  L.geoJSON(S.lotes,{renderer:rend,style:estiloLote,onEachFeature:(f,l)=>{
    const lote=f.properties._lote;
    l.bindTooltip(String(lote),{permanent:true,direction:'center',className:claseEtiqueta(lote)});
    l.on('click',()=>{
      if(PLAY.on)return;
      if(S.planAbierto){alternarPlan(lote);return;}
      if(!S.jornada||!enJornada(lote)||mapa.getZoom()<16)resumenLote(lote);
    });
  }}).addTo(capaLotes);
}
function enAnillo(x,y,a){let d=false;for(let i=0,j=a.length-1;i<a.length;j=i++){const xi=a[i][0],yi=a[i][1],xj=a[j][0],yj=a[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))d=!d;}return d;}
function enPoligono(x,y,c){if(!enAnillo(x,y,c[0]))return false;for(let k=1;k<c.length;k++)if(enAnillo(x,y,c[k]))return false;return true;}
function cajasLotes(){
  if(!S.lotes)return;
  for(const f of S.lotes.features){let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
    const polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;
    for(const p of polys)for(const [x,y] of p[0]){if(x<a)a=x;if(y<b)b=y;if(x>c)c=x;if(y>d)d=y;}
    f._caja=[a,b,c,d];}
}
function loteDe(lat,lng){
  if(!S.lotes)return'';
  for(const f of S.lotes.features){const k=f._caja;if(k&&(lng<k[0]||lng>k[2]||lat<k[1]||lat>k[3]))continue;
    const polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;
    for(const p of polys)if(enPoligono(lng,lat,p))return String(f.properties._lote);}
  return'';
}
function cajaDe(feats){let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;const rec=x=>{if(typeof x[0]==='number'){if(x[0]<a)a=x[0];if(x[1]<b)b=x[1];if(x[0]>c)c=x[0];if(x[1]>d)d=x[1];}else x.forEach(rec);};
  feats.forEach(f=>rec(f.geometry.coordinates));return isFinite(a)?[[b,a],[d,c]]:null;}
function encuadrar(lotes){
  let feats=[];
  if(lotes&&lotes.length&&S.lotes)feats=S.lotes.features.filter(f=>lotes.includes(f.properties._lote));
  if(!feats.length&&S.lotes)feats=S.lotes.features;
  const c=cajaDe(feats);if(c)mapa.fitBounds(c,{padding:[30,30],maxZoom:18});
}

/* ---------- Palmas (solo las de la jornada) ---------- */
const CELDA=0.002;const rejilla=new Map();
function indexar(){
  S.idx.clear();rejilla.clear();
  if(S.palmas)for(const f of S.palmas.features){S.idx.set(f.properties._id,f);const [x,y]=f.geometry.coordinates;const k=Math.floor(x/CELDA)+','+Math.floor(y/CELDA);let a=rejilla.get(k);if(!a)rejilla.set(k,a=[]);a.push(f);}
}
function estiloPalma(f){
  const h=S.hechos.get(f.properties._id);
  if(h){const e=estadoDe(h.estado)||{c:'#fff'};return {fillColor:e.c,fillOpacity:1,color:'#ffffff',weight:2};}
  if(VIS&&VIS.set.has(f.properties._id))return f.properties._existe===false?{fillColor:'#4dd0e1',fillOpacity:.25,color:'#4dd0e1',weight:1}:{fillColor:'#4dd0e1',fillOpacity:.95,color:'#0b3d44',weight:1};
  if(f.properties._existe===false)return {fillColor:'#ffffff',fillOpacity:.12,color:'#b0bec5',weight:1};
  return {fillColor:SIN_EVALUAR,fillOpacity:.95,color:'#3a2a00',weight:1};
}
function zMinPalmas(){return (S.palmas&&S.palmas.features.length>8000)?17:0;}
function dibujarPalmas(){
  capaPalmas.clearLayers();S.marcadores.clear();
  if(!S.palmas||!S.palmas.features.length||mapa.getZoom()<zMinPalmas())return;
  const b=mapa.getBounds().pad(.25);
  const i0=Math.floor(b.getWest()/CELDA),i1=Math.floor(b.getEast()/CELDA),j0=Math.floor(b.getSouth()/CELDA),j1=Math.floor(b.getNorth()/CELDA);
  const grupos=[];
  if((i1-i0+1)*(j1-j0+1)>rejilla.size){for(const [k,arr] of rejilla){const [i,j]=k.split(',').map(Number);if(i>=i0&&i<=i1&&j>=j0&&j<=j1)grupos.push(arr);}}
  else for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const a=rejilla.get(i+','+j);if(a)grupos.push(a);}
  const r=radioPalma();
  for(const arr of grupos)for(const f of arr){
    const [lng,lat]=f.geometry.coordinates;const id=f.properties._id;
    const m=L.circleMarker([lat,lng],{renderer:rend,radius:r,...estiloPalma(f)});
    m.on('click',()=>{if(!PLAY.on)abrirPalma(id);});m.addTo(capaPalmas);S.marcadores.set(id,m);
  }
}
function repintarPalma(id){const m=S.marcadores.get(id),f=S.idx.get(id);if(m&&f)m.setStyle(estiloPalma(f));}
function resaltar(lat,lng){
  if(resalte)capaGps.removeLayer(resalte);
  resalte=L.circleMarker([lat,lng],{radius:radioPalma()+6,color:'#00e5ff',weight:3,fill:false,interactive:false}).addTo(capaGps);
}
function pintarLeyenda(){

}
$('#btLeyenda').onclick=()=>{$('#leyenda').hidden=!$('#leyenda').hidden;};

/* ---------- Cartografía (lotes y palmas) ---------- */
const cacheChunk=new Map();
async function leerChunk(l){if(cacheChunk.has(l))return cacheChunk.get(l);const r=await dbGet('palmas_lote',l);const d=r?r.d:[];if(cacheChunk.size>40)cacheChunk.clear();cacheChunk.set(l,d);return d;}
function enRango(linea,desde,hasta){const n=parseInt(linea,10);if(isNaN(n))return true;return (desde==null||desde===''||n>=desde)&&(hasta==null||hasta===''||n<=hasta);}
function featPalma(a,lote){return {type:'Feature',geometry:{type:'Point',coordinates:[a[4],a[5]]},properties:{_id:String(a[0]),_lote:lote,_linea:a[1]==null?'':String(a[1]),_num:a[2]==null?'':String(a[2]),_existe:a[3]!==0}};}
async function procesarCartografia(lotesTxt,zipBuf,extra){
  avance('Procesando lotes…');
  const gj=JSON.parse(lotesTxt);
  const feats=(gj.features||[]).filter(f=>f.geometry&&/Polygon/.test(f.geometry.type));
  if(!feats.length)throw new Error('lotes.geojson no contiene polígonos.');
  feats.forEach(f=>{const p=f.properties||(f.properties={});p._lote=String(p.Lote??p.LOTE??p.lote??'').trim();});
  avance('Abriendo paquete de palmas…');
  const z=await JSZip.loadAsync(zipBuf);
  const fi=z.file('indice.json');if(!fi)throw new Error('palmas.zip no contiene indice.json.');
  const ind=JSON.parse(await fi.async('string'));
  const nombres=Object.keys(z.files).filter(n=>/^palmas\/.+\.json$/.test(n));
  await dbClear('palmas_lote');cacheChunk.clear();
  let i=0,lote=[];
  for(const n of nombres){const o=JSON.parse(await z.file(n).async('string'));lote.push({lote:String(o.lote),d:o.d});
    if(lote.length>=25){await dbPutVarios('palmas_lote',lote);lote=[];}
    if(++i%25===0)avance(`Guardando palmas: ${i} de ${nombres.length} lotes…`);}
  if(lote.length)await dbPutVarios('palmas_lote',lote);
  S.lotes={type:'FeatureCollection',features:feats};await dbPut('capas',{id:'lotes',fc:S.lotes});cajasLotes();
  CARTO={version:ind.version||'',lotes:ind.lotes||{},fecha:new Date().toISOString(),...extra};
  await dbPut('config',{clave:'carto',v:CARTO});
  dibujarLotes();actualizarCab();
}
function cartoDesdeArchivos(){
  const inp=$('#inCarto');inp.value='';
  inp.onchange=async()=>{const fs=Array.from(inp.files||[]);
    const fl=fs.find(f=>/\.(geo)?json$/i.test(f.name)),fz=fs.find(f=>/\.zip$/i.test(f.name));
    if(!fl||!fz){alert('Seleccione los dos archivos a la vez: lotes.geojson y palmas.zip.');return;}
    try{await procesarCartografia(await fl.text(),await fz.arrayBuffer(),{origen:'archivo',paquete:ACCESO&&ACCESO.carto?ACCESO.carto.version:''});toast(`Cartografía cargada: ${S.lotes.features.length} lotes.`);cerrarHoja();encuadrar();}
    catch(e){alert('No se pudo cargar la cartografía:\n'+e.message);}};
  inp.click();
}
const totalPalmasCarto=()=>Object.values(CARTO.lotes||{}).reduce((a,m)=>a+m.n-(m.vacios||0),0);

/* ---------- Cabecera ---------- */
function actualizarCab(){
  let t;
  if(S.jornada)t=`${S.jornada.evaluador} · ${S.jornada.seleccion.length} lote(s) en jornada`;
  else if(S.lotes)t=`${S.lotes.features.length} lotes · ${num(totalPalmasCarto())} palmas`;
  else t='Palmas de Tumaco';
  $('#sub').textContent=t;
}

/* ---------- GPS ---------- */
let gpsWatch=null,gpsMarca=null,gpsCirc=null;
function iniciarGPS(){
  if(!navigator.geolocation){toast('Este dispositivo no permite usar el GPS en el navegador.');return;}
  if(gpsWatch!==null)return;
  gpsWatch=navigator.geolocation.watchPosition(p=>{
    S.gps={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:p.timestamp};pintarGPS();
    if(S.seguir&&!PLAY.on)mapa.setView([S.gps.lat,S.gps.lng],Math.max(mapa.getZoom(),18),{animate:false});
    registrarPunto(S.gps);guiaGPS();
  },e=>{$('#chGpsTxt').textContent='Sin GPS';$('#chGps').className='chip mal';if(e.code===1)toast('Debe autorizar el acceso a la ubicación.');gpsWatch=null;},
  {enableHighAccuracy:true,maximumAge:2000,timeout:60000});
}
function pintarGPS(){
  const ll=[S.gps.lat,S.gps.lng];
  if(!gpsMarca){
    gpsCirc=L.circle(ll,{radius:S.gps.acc,color:'#2f93d5',weight:1,fillOpacity:.12,interactive:false}).addTo(capaGps);
    gpsMarca=L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#2f93d5',fillOpacity:1,interactive:false}).addTo(capaGps);
  }else{gpsMarca.setLatLng(ll);gpsCirc.setLatLng(ll).setRadius(S.gps.acc);}
  const a=Math.round(S.gps.acc);$('#chGpsTxt').textContent='±'+a+' m';$('#chGps').className='chip '+(a<=6?'ok':a<=15?'med':'mal');
}
$('#chGps').onclick=()=>$('#btUbic').click();
$('#btUbic').onclick=()=>{
  iniciarGPS();
  if(!S.gps){toast('Buscando señal GPS… manténgase a cielo abierto.');S.seguir=true;$('#btUbic').classList.add('on');return;}
  S.seguir=!S.seguir;$('#btUbic').classList.toggle('on',S.seguir);
  if(S.seguir){mapa.setView([S.gps.lat,S.gps.lng],Math.max(mapa.getZoom(),18));toast('El mapa sigue su posición.');}
};
$('#btCercana').onclick=()=>{
  if(!S.jornada){toast('Inicie una jornada para trabajar con palmas.');return;}
  if(!S.palmas||!S.palmas.features.length){toast('La jornada no tiene palmas cargadas.');return;}
  if(!S.gps){iniciarGPS();toast('Esperando señal GPS…');return;}
  let mejor=null,dm=Infinity;
  for(const f of S.palmas.features){const [x,y]=f.geometry.coordinates;const d=dist(S.gps.lat,S.gps.lng,y,x);if(d<dm){dm=d;mejor=f;}}
  const [x,y]=mejor.geometry.coordinates;mapa.setView([y,x],Math.max(mapa.getZoom(),19));abrirPalma(mejor.properties._id,dm);
};

/* =====================================================================
   PLANIFICACIÓN Y JORNADA
   ===================================================================== */
function lotesProgramas(){return [...new Set((S.lotes?S.lotes.features:[]).map(f=>f.properties.Programa).filter(Boolean))].sort(ordenNat);}
function itemPlan(l){const m=CARTO.lotes[l]||{};return {lote:l,desde:m.linea_min??null,hasta:m.linea_max??null};}
function alternarPlan(l){
  if(!CARTO.lotes[l]){toast('El lote '+l+' no tiene palmas en la cartografía.');return;}
  const i=S.plan.findIndex(p=>p.lote===l);if(i>=0)S.plan.splice(i,1);else S.plan.push(itemPlan(l));
  S.plan.sort((a,b)=>ordenNat(a.lote,b.lote));dibujarLotes();pintarPlanLista();pintarPlanSel();
}
async function contarItem(it){const d=await leerChunk(it.lote);let n=0;for(const a of d)if(a[3]!==0&&enRango(a[1],it.desde,it.hasta))n++;return n;}
function abrirPlanificador(modo){
  if(!S.lotes){toast('La cartografía aún no está cargada.');return;}
  S.planModo=modo;if(modo==='agregar')S.plan=[];
  abrirHoja(modo==='agregar'?'Agregar lotes a la jornada':'Planificar jornada',`
    <div class="pasos"><span><b>1</b>Toque los lotes en el mapa o búsquelos</span><span><b>2</b>Ajuste las líneas</span><span><b>3</b>${modo==='agregar'?'Agregue':'Inicie la jornada'}</span></div>
    <div class="fila"><input type="text" id="plBusca" placeholder="Buscar: IT43, GU1…"><select id="plProg"><option value="">Todos los programas</option>${lotesProgramas().map(p=>`<option>${esc(p)}</option>`).join('')}</select></div>
    <div class="lista-lotes" id="plLista"></div>
    <h3>Lotes y palmas seleccionados</h3>
    <div id="plSel"></div>
    <div class="ficha" id="plTotal" style="margin-top:8px"></div>
    ${modo==='nueva'?`<div class="ficha" style="margin-top:8px">Evaluador: <b>${esc(SES?SES.nombre:'')}</b> <span class="tenue">(${esc(SES?SES.u:'')})</span></div>`:''}
    <button class="btn nar ancho grande" id="plOk" style="margin-top:14px">${modo==='agregar'?IC.mas+' AGREGAR A LA JORNADA':IC.play+' INICIAR JORNADA'}</button>
    <p class="tenue">${modo==='agregar'?'Si elige un lote que ya está en la jornada, se reemplaza su rango de líneas.':'Al iniciar, comienza a guardarse el recorrido (track) y se cargan solo las palmas elegidas.'}</p>`,
    {media:true,alCerrar:()=>{S.planAbierto=false;dibujarLotes();}});
  S.planAbierto=true;
  $('#plBusca').oninput=pintarPlanLista;$('#plProg').onchange=pintarPlanLista;
  $('#plOk').onclick=confirmarPlan;
  dibujarLotes();pintarPlanLista();pintarPlanSel();
}
function pintarPlanLista(){
  const c=$('#plLista');if(!c)return;
  const t=($('#plBusca').value||'').trim().toUpperCase(),pr=$('#plProg').value;
  const ls=S.lotes.features.map(f=>f.properties).filter(p=>CARTO.lotes[p._lote]&&(!t||p._lote.toUpperCase().includes(t))&&(!pr||p.Programa===pr)).map(p=>p._lote).sort(ordenNat);
  c.innerHTML=`<div class="chips">${ls.slice(0,400).map(l=>`<label class="chip-op"><input type="checkbox" data-l="${esc(l)}" ${enPlan(l)?'checked':''}><span><b>${esc(l)}</b>${enJornada(l)?' ✓':''}&nbsp;<small>${num(CARTO.lotes[l].n-(CARTO.lotes[l].vacios||0))}</small></span></label>`).join('')}</div>${ls.length>400?'<p class="tenue">Use el buscador para ver más.</p>':''}`;
  c.querySelectorAll('input').forEach(i=>i.onchange=()=>{alternarPlan(i.dataset.l);const f=S.lotes.features.find(x=>x.properties._lote===i.dataset.l);if(f&&i.checked){const k=cajaDe([f]);if(k)mapa.fitBounds(k,{padding:[40,40],maxZoom:17});}});
}
async function pintarPlanSel(){
  const c=$('#plSel');if(!c)return;

  c.innerHTML=S.plan.map(it=>{const m=CARTO.lotes[it.lote]||{};return `<div class="sel-item" data-l="${esc(it.lote)}"><b>${esc(it.lote)}</b>
    <span class="tenue">Líneas</span><input type="number" class="mini" data-k="desde" min="${m.linea_min??''}" max="${m.linea_max??''}" value="${it.desde??''}">
    <span class="tenue">a</span><input type="number" class="mini" data-k="hasta" min="${m.linea_min??''}" max="${m.linea_max??''}" value="${it.hasta??''}">
    <span class="crece tenue" data-n>…</span><button class="icono" data-q aria-label="Quitar">✕</button></div>`;}).join('');

async function pintarConteos(){
  let tot=0;
  for(const it of S.plan){const n=await contarItem(it);tot+=n;const e=document.querySelector(`.sel-item[data-l="${CSS.escape(it.lote)}"] [data-n]`);if(e)e.textContent=num(n)+' palmas';}
  const e=$('#plTotal');if(e)e.innerHTML=`<b>${S.plan.length}</b> lote(s) · <b class="num" style="font-size:18px">${num(tot)}</b> palmas por censar`+(tot>60000?'<br><span style="color:var(--rojo)">⚠️ Demasiadas palmas para un celular: reduzca la selección.</span>':'');

async function confirmarPlan(){
  if(!S.plan.length){alert('Elija al menos un lote.');return;}
  for(const it of S.plan)if(it.desde!=null&&it.hasta!=null&&it.desde>it.hasta){alert(`En el lote ${it.lote} la línea inicial es mayor que la final.`);return;}
  if(S.planModo==='agregar'){
    const sel=S.jornada.seleccion.filter(p=>!enPlan(p.lote)).concat(S.plan.map(p=>({...p})));
    S.jornada.seleccion=sel.sort((a,b)=>ordenNat(a.lote,b.lote));S.jornada.sync='pendiente';await dbPut('jornadas',S.jornada);
    S.plan=[];cerrarHoja();await cargarPalmasJornada();dibujarLotes();actualizarJornadaUI();toast('Lotes agregados a la jornada.');
  }else{
    if(!SES){alert('Inicie sesión para iniciar una jornada.');return;}
    const sel=S.plan.map(p=>({...p}));S.plan=[];cerrarHoja();await iniciarJornada(sel,SES.nombre);
  }
}
function idJornada(){const d=new Date();return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}-${uid().slice(0,6)}`;}
async function iniciarJornada(sel,evaluador){
  const j={id:idJornada(),inicio:new Date().toISOString(),fin:null,evaluador,usuario:SES?SES.u:'',dispositivo:S.cfg.dispositivo,seleccion:sel,estado:'activa',
    km:0,sync:'pendiente',version_app:VERSION,carto_version:CARTO.version,densidad:Number(S.cfg.densidad)||115,buffer:Number(S.cfg.bufferVisita)||10};
  await dbPut('jornadas',j);S.jornada=j;S.cfg.jornadaActiva=j.id;S.cfg.evaluador=evaluador;await guardarCfg();
  TRACK.ultimo=null;TRACK.n=0;prepararTrack([]);VIS=nuevoEstadoVisita(j.densidad,j.buffer);
  await cargarPalmasJornada();iniciarGPS();pantallaEncendida(true);actualizarJornadaUI();dibujarLotes();encuadrar(sel.map(s=>s.lote));
  if(VOZ.activa)hablar('Jornada iniciada.');

async function cargarPalmasJornada(){
  const feats=[];
  if(S.jornada)for(const it of S.jornada.seleccion){const d=await leerChunk(it.lote);for(const a of d)if(enRango(a[1],it.desde,it.hasta))feats.push(featPalma(a,it.lote));}
  S.palmas=feats.length?{type:'FeatureCollection',features:feats}:null;
  S.hechos.clear();if(S.jornada)S.registros.forEach(r=>{if(r.jornada_id===S.jornada.id)S.hechos.set(r.palma_id,r);});
  indexar();dibujarPalmas();actualizarCenso();actualizarCab();
}

  const regs=S.registros.filter(r=>r.jornada_id===j.id);const pts=await puntosTrack(j.id);

    <button class="btn prim ancho" id="fPlay">${IC.play} Ver el recorrido del día</button>

function censoTotal(){let tot=0,hec=0;if(S.palmas)for(const f of S.palmas.features){if(f.properties._existe===false)continue;tot++;if(S.hechos.has(f.properties._id))hec++;}return {tot,hec};}

/* ---------- Registro del recorrido (track) ---------- */
const TRACK={ultimo:null,n:0,linea:null,brillo:null};
function prepararTrack(latlngs){
  capaTrack.clearLayers();
  TRACK.brillo=L.polyline(latlngs,{color:'#22d39a',weight:10,opacity:.18,interactive:false}).addTo(capaTrack);
  TRACK.linea=L.polyline(latlngs,{color:'#22d39a',weight:3.5,opacity:.95,interactive:false}).addTo(capaTrack);
}
async function registrarPunto(g){
  if(!S.jornada||!g)return;
  const maxAcc=Number(S.cfg.precisionTrack)||30;if(g.acc>maxAcc)return;
  const t=Date.now(),u=TRACK.ultimo;
  if(u){const d=dist(u.lat,u.lng,g.lat,g.lng),dt=(t-u.t)/1000;
    if(d<3&&dt<60)return;
    if(dt>0&&d/dt>15)return; // salto del GPS (>54 km/h)
    if(d<500)S.jornada.km=(S.jornada.km||0)+d/1000;}
  const p={j:S.jornada.id,t,lat:+g.lat.toFixed(7),lng:+g.lng.toFixed(7),acc:Math.round(g.acc*10)/10,s:0};
  TRACK.ultimo=p;TRACK.n++;
  if(TRACK.linea){TRACK.linea.addLatLng([p.lat,p.lng]);TRACK.brillo.addLatLng([p.lat,p.lng]);}
  if(VIS){try{const nv=await visitarTramo(VIS,p);if(nv.length){nv.forEach(repintarPalma);actualizarVisitaUI();}}catch(e){}}
  try{await dbPut('track',p);if(TRACK.n%10===0)await dbPut('jornadas',S.jornada);}catch(e){}
}
async function puntosTrack(jid){return (await dbIndice('track','j',jid)).sort((a,b)=>a.t-b.t);}

/* ---------- Palmas visitadas y hectáreas recorridas (buffer del recorrido) ----------
   Una palma (sitio) se cuenta como visitada si queda a <= buffer (10 m) del recorrido.
   Hectáreas = sitios visitados / densidad (115 palmas/ha). No requiere marcar palmas. */
let KX=0;const KY=111320,CV=10,SALTO_MAX=50;
function prepK(){if(KX)return;let lat=1.7;const f=S.lotes&&S.lotes.features[0];if(f&&f._caja)lat=(f._caja[1]+f._caja[3])/2;KX=KY*Math.cos(lat*Math.PI/180);}
const IDXV=new Map();
async function indiceVisita(l){
  if(IDXV.has(l))return IDXV.get(l);
  const d=await leerChunk(l);const grid=new Map();
  for(const a of d){const x=a[4]*KX,y=a[5]*KY;const k=Math.floor(x/CV)+','+Math.floor(y/CV);let g=grid.get(k);if(!g)grid.set(k,g=[]);g.push({id:String(a[0]),x,y,e:a[3]!==0});}
  if(IDXV.size>60)IDXV.clear();IDXV.set(l,grid);return grid;
}
function nuevoEstadoVisita(densidad,buffer){return {set:new Set(),lotes:new Map(),densidad:Number(densidad)||115,buffer:Number(buffer)||10,ult:null};}
function lotesCercanos(ax,ay,bx,by,B){
  const out=[];if(!S.lotes)return out;const mx=B/KX,my=B/KY;
  const w=Math.min(ax,bx)/KX-mx,e=Math.max(ax,bx)/KX+mx,s=Math.min(ay,by)/KY-my,n=Math.max(ay,by)/KY+my;
  for(const f of S.lotes.features){const k=f._caja;if(!k||k[0]>e||k[2]<w||k[1]>n||k[3]<s)continue;out.push(f.properties._lote);}
  return out;
}
function dSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy;let t=L?((px-ax)*dx+(py-ay)*dy)/L:0;t=t<0?0:t>1?1:t;const qx=ax+t*dx-px,qy=ay+t*dy-py;return Math.sqrt(qx*qx+qy*qy);}
async function visitarTramo(E,p){
  prepK();
  const a=E.ult&&dist(E.ult.lat,E.ult.lng,p.lat,p.lng)<=SALTO_MAX?E.ult:p;E.ult=p; // tramos con saltos grandes no barren área
  const ax=a.lng*KX,ay=a.lat*KY,bx=p.lng*KX,by=p.lat*KY,B=E.buffer;const nuevos=[];
  for(const l of lotesCercanos(ax,ay,bx,by,B)){
    if(!CARTO.lotes[l])continue;const grid=await indiceVisita(l);
    const i0=Math.floor((Math.min(ax,bx)-B)/CV),i1=Math.floor((Math.max(ax,bx)+B)/CV),j0=Math.floor((Math.min(ay,by)-B)/CV),j1=Math.floor((Math.max(ay,by)+B)/CV);
    for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const g=grid.get(i+','+j);if(!g)continue;
      for(const q of g){if(E.set.has(q.id))continue;
        if(dSeg(q.x,q.y,ax,ay,bx,by)<=B){E.set.add(q.id);let r=E.lotes.get(l);if(!r)E.lotes.set(l,r={v:0,vac:0,ids:[]});r.v++;if(!q.e)r.vac++;r.ids.push(Number(q.id)||q.id);nuevos.push(q.id);}}}
  }
  return nuevos;
}
async function calcularVisita(pts,densidad,buffer){const E=nuevoEstadoVisita(densidad,buffer);for(const p of pts)await visitarTramo(E,p);return E;}
function resumenVisita(E,regs,conIds){
  const filas=new Map();const fila=l=>{if(!filas.has(l))filas.set(l,{lote:l,palmas_visitadas:0,palmas_existentes:0,sitios_vacios:0,ha:0,diagnosticos:0});return filas.get(l);};
  for(const [l,r] of E.lotes){const x=fila(l);x.palmas_visitadas=r.v;x.palmas_existentes=r.v-r.vac;x.sitios_vacios=r.vac;x.ha=+(r.v/E.densidad).toFixed(2);if(conIds)x.ids_palmas_visitadas=r.ids;}
  for(const r of regs||[])fila(r.lote||'—').diagnosticos++;
  const por_lote=[...filas.values()].sort((a,b)=>ordenNat(a.lote,b.lote));
  const tv=por_lote.reduce((a,x)=>a+x.palmas_visitadas,0);
  return {densidad_palmas_ha:E.densidad,buffer_m:E.buffer,palmas_visitadas:tv,palmas_existentes_visitadas:por_lote.reduce((a,x)=>a+x.palmas_existentes,0),
    ha_recorridas:+(tv/E.densidad).toFixed(2),por_lote};
}
let VIS=null;
function actualizarVisitaUI(){
  if(!S.jornada||!VIS)return;let v=0;for(const r of VIS.lotes.values())v+=r.v;
  $('#pjVis').textContent=num(v);$('#pjHa').textContent=(v/VIS.densidad).toFixed(2);
}
const hhmm=t=>t?fmtHora(t).slice(0,5):'—';
function tablaLotes(res,j){
  const sel=j&&j.seleccion?new Map(j.seleccion.map(s=>[s.lote,s])):new Map();
  const filas=res.por_lote.map(x=>`<tr><td><b>${esc(x.lote)}</b>${sel.has(x.lote)?'':' <span class="tenue">(fuera de selección)</span>'}</td><td>${num(x.palmas_visitadas)}</td><td><b>${x.ha.toFixed(2)}</b></td><td>${num(x.diagnosticos)}</td></tr>`).join('');
  return `<table class="res"><thead><tr><th>Lote</th><th>Palmas visitadas</th><th>Ha</th><th>Diagnósticos</th></tr></thead><tbody>${filas||'<tr><td colspan="4" class="tenue">Aún sin recorrido.</td></tr>'}
    ${res.por_lote.length>1?`<tr><td><b>TOTAL</b></td><td><b>${num(res.palmas_visitadas)}</b></td><td><b>${res.ha_recorridas.toFixed(2)}</b></td><td><b>${num(res.por_lote.reduce((a,x)=>a+x.diagnosticos,0))}</b></td></tr>`:''}</tbody></table>
    <p class="tenue">Palmas visitadas = sitios a ${res.buffer_m} m o menos del recorrido (dos líneas por calle). Ha = palmas visitadas ÷ ${res.densidad_palmas_ha} palmas/ha.</p>`;
}

/* ---------- Ficha de palma ---------- */
function etiquetaPalma(p){const a=[];if(p._lote)a.push(p._lote);if(p._linea)a.push('L'+p._linea);if(p._num)a.push('P'+p._num);return a.length>1?a.join(' · '):'Palma '+p._id;}
const etiquetaReg=r=>[r.lote,r.linea?'L'+r.linea:'',r.numero?'P'+r.numero:''].filter(Boolean).join(' · ')||('Palma '+r.palma_id);
function selloSync(r){return r.sync==='sincronizado'?'<span class="sello ok">🔒 SINCRONIZADO</span>':'<span class="sello pend">⏳ PENDIENTE</span>';}
function tarjetaRegistro(r){
  const e=estadoDe(r.estado)||{n:r.estado,c:'#999'};const probs=(r.problemas||[]).map(p=>(probDe(p)||{n:p}).n).join(', ');
  return `<div class="tarjeta" data-id="${esc(r.id)}" style="border-left-color:${e.c==='#ffffff'?'#bbb':e.c}">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>${esc(e.n)}</b>${selloSync(r)}</div>
    <span class="tenue">${esc(fmtFecha(r.creado))} · ${esc(etiquetaReg(r))} · ${esc(r.evaluador||'')}</span>
    ${probs?`<br>${esc(probs)}${r.grado_pc?` · Grado PC ${esc(r.grado_pc)}`:''}`:''}${(r.fotos||[]).length?` · 📷 ${(r.fotos||[]).length}`:''}</div>`;
}
function enlazarTarjetas(cont){(cont||$('#hojaCuerpo')).querySelectorAll('.tarjeta').forEach(el=>el.onclick=()=>{const r=S.registros.find(x=>x.id===el.dataset.id);if(r)abrirFormulario(r);});}
function abrirPalma(id,dm){
  const f=S.idx.get(id);if(!f)return;const p=f.properties;const [lng,lat]=f.geometry.coordinates;resaltar(lat,lng);
  const hist=S.registros.filter(r=>r.palma_id===id).sort((a,b)=>String(b.creado).localeCompare(String(a.creado)));
  const hoy=S.hechos.get(id);
  const dGps=dm!=null?dm:(S.gps?dist(S.gps.lat,S.gps.lng,lat,lng):null);
  abrirHoja(etiquetaPalma(p),`
    <div class="ficha gran"><div><div class="big">${esc(p._lote)}</div><span class="tenue">LOTE</span></div><div><div class="big">${esc(p._linea||'—')}</div><span class="tenue">LÍNEA</span></div><div><div class="big">${esc(p._num||'—')}</div><span class="tenue">PALMA</span></div></div>
    <div class="ficha" style="margin-top:8px">
      ${dGps!=null?`<div><b>Distancia a usted:</b> ${dGps.toFixed(1)} m</div>`:''}
      <div><b>ID palma:</b> ${esc(p._id)}</div>
      <div class="coord">${lat.toFixed(7)}, ${lng.toFixed(7)}</div>
      ${p._existe===false?'<div style="color:var(--ambar)"><b>Sitio sin palma según la cartografía</b></div>':''}
    </div>
    ${S.jornada?(hoy?`<button class="btn ancho ${hoy.sync==='sincronizado'?'':'prim'}" id="btDiag">${hoy.sync==='sincronizado'?IC.candado+' Ver diagnóstico de hoy':'✎ Editar diagnóstico de hoy'}</button>`
      :`<button class="btn prim ancho grande" id="btDiag">${IC.mas} REGISTRAR DIAGNÓSTICO</button>`)
      :'<div class="aviso">Inicie una jornada para registrar diagnósticos.</div>'}
    <h3>Historial (${hist.length})</h3>
    ${hist.map(tarjetaRegistro).join('')||'<p class="tenue">Esta palma aún no tiene diagnósticos.</p>'}`);
  const b=$('#btDiag');if(b)b.onclick=()=>abrirFormulario(hoy||{palma_id:id});
  enlazarTarjetas();
}

/* ---------- Formulario de diagnóstico ---------- */
let F=null;
async function abrirFormulario(base){
  const edit=!!base.id;
  if(!edit&&!S.jornada){toast('Inicie una jornada para registrar diagnósticos.');return;}
  const f0=S.idx.get(base.palma_id);
  if(!edit&&!f0){toast('Esa palma no pertenece a la jornada.');return;}
  const r=edit?JSON.parse(JSON.stringify(base)):{id:uid(),palma_id:base.palma_id,jornada_id:S.jornada.id,evaluador:S.jornada.evaluador,
    estado:'',problemas:[],sintomas:[],grado_pc:'',severidad:'',accion:'',observaciones:'',fotos:[],sync:'pendiente'};
  const bloq=r.sync==='sincronizado';
  let lat,lng,lote,linea,numero;
  if(f0){[lng,lat]=f0.geometry.coordinates;const p=f0.properties;lote=p._lote;linea=p._linea;numero=p._num;}
  else{lat=r.lat;lng=r.lng;lote=r.lote;linea=r.linea;numero=r.numero;}
  F={r,edit,lat,lng,lote,linea,numero,fotosNuevas:[],fotosQuitar:[],urls:[]};
  if(lat!=null)resaltar(lat,lng);
  const dGps=S.gps&&lat!=null?dist(S.gps.lat,S.gps.lng,lat,lng):null;
  const chip=(tipo,name,val,txt,on)=>`<label class="chip-op"><input type="${tipo}" name="${name}" value="${esc(val)}" ${on?'checked':''}><span>${esc(txt)}</span></label>`;
  abrirHoja(bloq?'Diagnóstico (solo lectura)':edit?'Editar diagnóstico':'Nuevo diagnóstico',`
    <form id="frm" autocomplete="off">
      <div class="ficha gran"><div><div class="big">${esc(lote||'—')}</div><span class="tenue">LOTE</span></div><div><div class="big">${esc(linea||'—')}</div><span class="tenue">LÍNEA</span></div><div><div class="big">${esc(numero||'—')}</div><span class="tenue">PALMA</span></div></div>
      <div class="ficha" style="margin-top:8px">
        <div><b>Evaluador:</b> ${esc(r.evaluador)} · <b>Fecha:</b> ${esc(edit?fmtFecha(r.creado):fmtFecha(Date.now()))}</div>
        <div class="tenue">${S.gps&&dGps!=null?`GPS ±${Math.round(S.gps.acc)} m · a ${dGps.toFixed(1)} m de la palma`:'Sin lectura GPS en este momento'}</div>
      </div>
      ${bloq?`<div class="candado">🔒 Sincronizado el ${esc(fmtFecha(r.sync_fecha))}. Este diagnóstico ya no se puede modificar ni eliminar.</div>`:''}
      ${!bloq&&S.gps&&dGps>25?'<div class="aviso">⚠️ Usted está a más de 25 m de esta palma. Verifique que sea la palma correcta.</div>':''}
      <fieldset ${bloq?'disabled':''}>
      <label class="campo">Estado de la palma <i>*</i></label>
      <div class="chips">${ESTADOS.map(e=>chip('radio','estado',e.id,e.n,r.estado===e.id)).join('')}</div>
      <div id="secProblemas">
        <label class="campo">Problema sanitario (puede marcar varios)</label>
        <div class="chips">${PROBLEMAS.map(p=>chip('checkbox','problemas',p.id,p.n,(r.problemas||[]).includes(p.id))).join('')}</div>
        <div id="secPC"><label class="campo">Grado de PC (1 a 5)</label>
          <select name="grado_pc"><option value="">—</option>${[1,2,3,4,5].map(g=>`<option ${String(r.grado_pc)===String(g)?'selected':''}>${g}</option>`).join('')}</select></div>
        <label class="campo">Severidad general del daño</label>
        <select name="severidad"><option value="">—</option>${[['0','0 · Sin daño'],['1','1 · Muy leve'],['2','2 · Leve'],['3','3 · Moderado'],['4','4 · Severo'],['5','5 · Muy severo']].map(([v,t])=>`<option value="${v}" ${String(r.severidad)===v?'selected':''}>${t}</option>`).join('')}</select>
        <label class="campo">Síntomas observados</label>
        <div class="chips">${SINTOMAS.map(s=>chip('checkbox','sintomas',s,s,(r.sintomas||[]).includes(s))).join('')}</div>
      </div>
      <label class="campo">Acción recomendada</label>
      <select name="accion"><option value="">—</option>${ACCIONES.map(a=>`<option ${r.accion===a?'selected':''}>${esc(a)}</option>`).join('')}</select>
      <label class="campo">Observaciones</label>
      <textarea name="observaciones" placeholder="Detalle de la evaluación">${esc(r.observaciones)}</textarea>
      </fieldset>
      <label class="campo">Fotografías</label>
      ${bloq?'':'<button type="button" class="btn ancho" id="btFoto">📷 Tomar o adjuntar foto</button>'}
      <div class="fotos" id="fotos"></div>
      ${bloq?'':`<div class="fila" style="margin-top:16px"><button type="submit" class="btn prim grande">💾 GUARDAR</button>${edit?'<button type="button" class="btn peligro" id="btBorrarReg">🗑 Eliminar</button>':''}</div>`}
    </form>`);
  for(const fid of (r.fotos||[])){const fo=await dbGet('fotos',fid);if(fo)agregarMiniatura(fid,new Blob([fo.buf],{type:fo.type}),false,bloq);}
  const frm=$('#frm');
  const vis=()=>{const est=(frm.querySelector('input[name=estado]:checked')||{}).value;
    $('#secProblemas').style.display=est==='faltante'?'none':'';
    $('#secPC').style.display=frm.querySelector('input[name=problemas][value=PC]').checked?'':'none';};
  frm.addEventListener('change',vis);vis();
  const bf=$('#btFoto');if(bf)bf.onclick=()=>{const i=$('#inFoto');i.value='';i.click();};
  const bb=$('#btBorrarReg');if(bb)bb.onclick=()=>borrarRegistro(r.id);
  frm.onsubmit=e=>{e.preventDefault();if(!bloq)guardarRegistro(frm);};
}
function agregarMiniatura(fid,blob,nueva,bloq){
  const url=URL.createObjectURL(blob);F.urls.push(url);
  const d=document.createElement('div');d.className='foto';
  d.innerHTML=`<img src="${url}" alt="foto">${bloq?'':'<button type="button" aria-label="Quitar">✕</button>'}`;
  d.querySelector('img').onclick=()=>verFoto(url);
  const b=d.querySelector('button');if(b)b.onclick=()=>{if(nueva)F.fotosNuevas=F.fotosNuevas.filter(x=>x.id!==fid);else F.fotosQuitar.push(fid);d.remove();};
  $('#fotos').appendChild(d);
}
$('#inFoto').onchange=async()=>{
  const files=Array.from($('#inFoto').files||[]);if(!F)return;
  for(const file of files){try{const c=await comprimir(file);const id=uid();F.fotosNuevas.push({id,...c});agregarMiniatura(id,new Blob([c.buf],{type:c.type}),true,false);}
    catch(e){toast('No se pudo procesar la foto: '+e.message);}}
};
function cargarImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i);};i.onerror=()=>rej(new Error('formato no soportado'));i.src=u;});}
async function comprimir(file){
  const img=await cargarImg(file);const M=1280;const k=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.74));
  return {buf:await blob.arrayBuffer(),type:'image/jpeg'};
}
async function marcarJornadaPendiente(jid){
  if(S.jornada&&S.jornada.id===jid){S.jornada.sync='pendiente';await dbPut('jornadas',S.jornada);return;}
  const j=await dbGet('jornadas',jid);if(j){j.sync='pendiente';await dbPut('jornadas',j);}
}
async function guardarRegistro(frm){
  if(SYNC.activo){alert('Se está sincronizando con GitHub. Intente de nuevo en unos segundos.');return;}
  const r=F.r;if(r.sync==='sincronizado'){alert('Este diagnóstico ya fue sincronizado y no se puede modificar.');return;}
  const fd=new FormData(frm);
  r.estado=fd.get('estado')||'';r.problemas=fd.getAll('problemas');r.sintomas=fd.getAll('sintomas');
  r.grado_pc=r.problemas.includes('PC')?(fd.get('grado_pc')||''):'';r.severidad=fd.get('severidad')||'';r.accion=fd.get('accion')||'';
  r.observaciones=(fd.get('observaciones')||'').trim();
  if(r.estado==='faltante'){r.problemas=[];r.sintomas=[];r.grado_pc='';r.severidad='';}
  if(!r.estado){alert('Seleccione el estado de la palma.');return;}
  if((r.estado==='enferma'||r.estado==='tratamiento')&&!r.problemas.length){alert('Para una palma enferma o en tratamiento marque al menos un problema sanitario.');return;}
  r.lote=F.lote;r.linea=F.linea||'';r.numero=F.numero||'';r.lat=F.lat;r.lng=F.lng;
  if(!F.edit){
    r.creado=new Date().toISOString();r.fecha=ahoraLocal();
    if(S.gps){r.gps_lat=+S.gps.lat.toFixed(7);r.gps_lng=+S.gps.lng.toFixed(7);r.gps_acc=Math.round(S.gps.acc*10)/10;r.dist_gps=Math.round(dist(S.gps.lat,S.gps.lng,r.lat,r.lng)*10)/10;}
    else{r.gps_lat=null;r.gps_lng=null;r.gps_acc=null;r.dist_gps=null;}
  }
  r.modificado=new Date().toISOString();r.sync='pendiente';
  try{
    for(const fo of F.fotosNuevas){await dbPut('fotos',{id:fo.id,registro_id:r.id,buf:fo.buf,type:fo.type});r.fotos.push(fo.id);}
    for(const q of F.fotosQuitar){await dbDel('fotos',q);r.fotos=r.fotos.filter(x=>x!==q);}
    await dbPut('registros',r);await marcarJornadaPendiente(r.jornada_id);
  }catch(e){alert('Error al guardar: '+e.message);return;}
  const i=S.registros.findIndex(x=>x.id===r.id);if(i>=0)S.registros[i]=r;else S.registros.push(r);
  recalcUltimo();if(S.jornada&&r.jornada_id===S.jornada.id)S.hechos.set(r.palma_id,r);
  repintarPalma(r.palma_id);actualizarCenso();estadoSync();F=null;
  toast('✅ Diagnóstico guardado en el dispositivo.');
  if(S.idx.has(r.palma_id))abrirPalma(r.palma_id);else cerrarHoja();
  refrescarBD();
}
function liberarUrls(){if(F&&F.urls)F.urls.forEach(u=>URL.revokeObjectURL(u));}
async function borrarRegistro(id){
  const r=S.registros.find(x=>x.id===id);if(!r)return;
  if(r.sync==='sincronizado'){alert('Este diagnóstico ya fue sincronizado y no se puede eliminar.');return;}
  if(SYNC.activo){alert('Se está sincronizando. Intente de nuevo en unos segundos.');return;}
  if(!confirm('¿Eliminar definitivamente este diagnóstico y sus fotos?'))return;
  for(const fid of (r.fotos||[]))await dbDel('fotos',fid);
  await dbDel('registros',id);S.registros=S.registros.filter(x=>x.id!==id);await marcarJornadaPendiente(r.jornada_id);
  recalcUltimo();if(S.hechos.get(r.palma_id)&&S.hechos.get(r.palma_id).id===id)S.hechos.delete(r.palma_id);
  repintarPalma(r.palma_id);actualizarCenso();estadoSync();F=null;toast('Diagnóstico eliminado.');
  if(S.idx.has(r.palma_id))abrirPalma(r.palma_id);else cerrarHoja();refrescarBD();
}
function recalcUltimo(){
  S.ultimo.clear();
  for(const r of S.registros){const u=S.ultimo.get(r.palma_id);if(!u||String(r.creado)>String(u.creado))S.ultimo.set(r.palma_id,r);}
}

/* ---------- Guía por voz ---------- */
const VOZ={activa:false,candidata:null,cuenta:0,ultimaPalma:null,ultimoLote:undefined,voz:null,ctx:null,avisoPrecision:0,ultimaFrase:''};
function elegirVoz(){if(!('speechSynthesis' in window))return;const vs=speechSynthesis.getVoices();
  VOZ.voz=vs.find(v=>/^es[-_]CO/i.test(v.lang))||vs.find(v=>/^es[-_](419|MX|US)/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null;}
if('speechSynthesis' in window){elegirVoz();speechSynthesis.onvoiceschanged=elegirVoz;}
function paraVoz(t){return String(t??'').trim().replace(/([A-Za-zÑñ])(?=\d)/g,'$1 ').replace(/(\d)(?=[A-Za-zÑñ])/g,'$1 ').replace(/\b[A-ZÑ]{2,3}\b/g,m=>m.split('').join(' '));}
function hablar(txt){VOZ.ultimaFrase=txt;if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=VOZ.voz?VOZ.voz.lang:'es-CO';if(VOZ.voz)u.voice=VOZ.voz;u.rate=Number(S.cfg.velocidadVoz)||1;speechSynthesis.speak(u);}catch(e){}}
function pitido(f=880,ms=140){
  try{if(VOZ.ctx){const o=VOZ.ctx.createOscillator(),g=VOZ.ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.35,VOZ.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,VOZ.ctx.currentTime+ms/1000);o.connect(g).connect(VOZ.ctx.destination);o.start();o.stop(VOZ.ctx.currentTime+ms/1000);}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(120);}catch(e){}
}
function palmaMasCercana(lat,lng){
  const i=Math.floor(lng/CELDA),j=Math.floor(lat/CELDA);let mejor=null,dm=Infinity;
  for(let a=i-1;a<=i+1;a++)for(let b=j-1;b<=j+1;b++){const arr=rejilla.get(a+','+b);if(!arr)continue;
    for(const f of arr){const [x,y]=f.geometry.coordinates;const d=dist(lat,lng,y,x);if(d<dm){dm=d;mejor=f;}}}
  return mejor?{f:mejor,d:dm}:null;
}
function frasePalma(f){
  const p=f.properties;let t='';
  if(p._lote)t+='Lote '+paraVoz(p._lote)+', ';if(p._linea)t+='línea '+paraVoz(p._linea)+', ';
  t+=p._num?'palma '+paraVoz(p._num):'palma código '+paraVoz(p._id);
  if(p._existe===false)t+=', sitio vacío';
  const h=S.hechos.get(p._id);if(h)t+=', ya censada: '+((estadoDe(h.estado)||{}).n||h.estado);
  return t+'.';
}
function pintarGuia(c){
  const g=$('#guia');if(!VOZ.activa){g.hidden=true;return;}
  g.hidden=false;const umbral=Number(S.cfg.umbralVoz)||4,prec=Number(S.cfg.precisionVoz)||15;
  if(!S.gps){g.className='glass';$('#guiaTxt').textContent='Buscando GPS…';$('#guiaSub').textContent='Manténgase a cielo abierto';g.dataset.id='';return;}
  if(!c){g.className='glass';$('#guiaTxt').textContent=S.palmas?'Sin palmas cerca':'Sin jornada activa';$('#guiaSub').textContent=`GPS ±${Math.round(S.gps.acc)} m`;g.dataset.id='';return;}
  g.className='glass'+(c.d<=umbral?' cerca':(S.gps.acc>prec?' mala':''));
  $('#guiaTxt').textContent=etiquetaPalma(c.f.properties);
  $('#guiaSub').textContent=`a ${c.d.toFixed(1)} m · GPS ±${Math.round(S.gps.acc)} m${S.gps.acc>prec?' · precisión baja':''}${S.hechos.has(c.f.properties._id)?' · ✓ censada':''}`;
  g.dataset.id=c.f.properties._id;
}
function guiaGPS(){
  if(!VOZ.activa)return;
  if(!S.gps){pintarGuia(null);return;}
  const {lat,lng,acc}=S.gps;const umbral=Number(S.cfg.umbralVoz)||4,prec=Number(S.cfg.precisionVoz)||15;
  const c=S.palmas?palmaMasCercana(lat,lng):null;pintarGuia(c);
  let frase='';const lote=loteDe(lat,lng);
  if(VOZ.ultimoLote===undefined)VOZ.ultimoLote=lote;
  else if(lote!==VOZ.ultimoLote){VOZ.ultimoLote=lote;frase=lote?'Entrando al lote '+paraVoz(lote)+'.'+(enJornada(lote)?'':' Este lote no está en la jornada.'):'Saliendo del lote.';}
  if(acc>prec){if(Date.now()-VOZ.avisoPrecision>60000){VOZ.avisoPrecision=Date.now();frase+=' Precisión del GPS baja, '+Math.round(acc)+' metros.';}
    if(frase){pitido(440);hablar(frase.trim());}return;}
  if(c){const id=c.f.properties._id;
    if(c.d<=umbral){if(id===VOZ.candidata)VOZ.cuenta++;else{VOZ.candidata=id;VOZ.cuenta=1;}
      if(id!==VOZ.ultimaPalma&&(VOZ.cuenta>=2||c.d<=umbral/2)){VOZ.ultimaPalma=id;frase=frasePalma(c.f);const [x,y]=c.f.geometry.coordinates;resaltar(y,x);}}
    else{VOZ.candidata=null;VOZ.cuenta=0;if(c.d>umbral*1.6)VOZ.ultimaPalma=null;}}
  if(frase){pitido();hablar(frase);}
}
function alternarVoz(){
  VOZ.activa=!VOZ.activa;const b=$('#btVoz');b.classList.toggle('on',VOZ.activa);b.innerHTML=VOZ.activa?IC.voz:IC.vozOff;
  if(VOZ.activa){
    try{if(!VOZ.ctx)VOZ.ctx=new (window.AudioContext||window.webkitAudioContext)();else VOZ.ctx.resume();}catch(e){}
    elegirVoz();iniciarGPS();pantallaEncendida(true);
    VOZ.candidata=null;VOZ.cuenta=0;VOZ.ultimaPalma=null;VOZ.ultimoLote=undefined;VOZ.avisoPrecision=0;
    S.seguir=true;$('#btUbic').classList.add('on');if(S.gps)mapa.setView([S.gps.lat,S.gps.lng],Math.max(mapa.getZoom(),19));
    pitido();hablar('Guía por voz activada.');if(!('speechSynthesis' in window))toast('Este navegador no tiene voz: se usarán pitido y vibración.',4000);
    guiaGPS();
  }else{try{speechSynthesis.cancel();}catch(e){}if(!S.jornada)pantallaEncendida(false);pintarGuia(null);}
}
$('#btVoz').onclick=alternarVoz;
$('#guia').onclick=e=>{
  if(e.target.closest('#guiaRepetir')){e.stopPropagation();const id=$('#guia').dataset.id;const f=id&&S.idx.get(id);hablar(f?frasePalma(f):(VOZ.ultimaFrase||'Sin palma cercana.'));return;}
  const id=$('#guia').dataset.id;if(id)abrirPalma(id);
};

const BD={tab:'diag',orden:'creado',asc:false,f:{q:'',jornada:'',lote:'',estado:'',sync:''},limite:200};
function abrirBD(tab){if(tab)BD.tab=tab;$('#bd').hidden=false;abrirCapa('bd');pintarBD();}
function refrescarBD(){if(!$('#bd').hidden)pintarBD();}
$('#btBD').onclick=()=>{if(!PLAY.on)abrirBD();};
$('#bdVolver').onclick=()=>cerrarCapa('bd');
$('#bdTabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;BD.tab=b.dataset.t;pintarBD();};
async function pintarBD(){
  $$('#bdTabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===BD.tab));
  const pend=S.registros.filter(r=>r.sync!=='sincronizado').length;
  $('#bdSub').textContent=`${num(S.registros.length)} diagnósticos · ${num(pend)} pendientes · ${num(S.registros.length-pend)} sincronizados`;
  if(BD.tab==='diag')pintarDiag();else if(BD.tab==='jor')await pintarJornadas();else pintarResumen();
}
const COLS=[
  {k:'sync',n:'Sync',v:r=>r.sync==='sincronizado'?'🔒':'⏳'},
  {k:'creado',n:'Fecha y hora',v:r=>fmtFecha(r.creado)},
  {k:'lote',n:'Lote',v:r=>r.lote},{k:'linea',n:'Línea',v:r=>r.linea,num:1},{k:'numero',n:'Palma',v:r=>r.numero,num:1},
  {k:'estado',n:'Estado',v:r=>(estadoDe(r.estado)||{}).n||r.estado,h:r=>{const e=estadoDe(r.estado)||{c:'#999',n:r.estado};return `<span class="est"><i style="background:${e.c}"></i>${esc(e.n)}</span>`;}},
  {k:'problemas',n:'Problemas',v:r=>(r.problemas||[]).join(', ')},{k:'grado_pc',n:'PC',v:r=>r.grado_pc,num:1},{k:'severidad',n:'Sev.',v:r=>r.severidad,num:1},
  {k:'accion',n:'Acción',v:r=>r.accion},{k:'evaluador',n:'Evaluador',v:r=>r.evaluador},{k:'fotos',n:'Fotos',v:r=>(r.fotos||[]).length,num:1},
  {k:'dist_gps',n:'Dist. GPS (m)',v:r=>r.dist_gps??'',num:1},{k:'palma_id',n:'ID palma',v:r=>r.palma_id,num:1},{k:'jornada_id',n:'Jornada',v:r=>r.jornada_id}
];
function filtrarRegs(){
  const f=BD.f,q=f.q.trim().toUpperCase();
  let L2=S.registros.filter(r=>(!f.jornada||r.jornada_id===f.jornada)&&(!f.lote||r.lote===f.lote)&&(!f.estado||r.estado===f.estado)&&
    (!f.sync||(f.sync==='ok'?r.sync==='sincronizado':r.sync!=='sincronizado'))&&
    (!q||[r.lote,r.linea,r.numero,r.palma_id,r.evaluador,r.observaciones,(r.problemas||[]).join(' ')].join(' ').toUpperCase().includes(q)));
  const c=COLS.find(x=>x.k===BD.orden)||COLS[1];
  L2.sort((a,b)=>{let x=c.k==='creado'?a.creado:c.v(a),y=c.k==='creado'?b.creado:c.v(b);
    const r2=c.num?((parseFloat(x)||0)-(parseFloat(y)||0)):ordenNat(x??'',y??'');return BD.asc?r2:-r2;});
  return L2;
}
function pintarDiag(){
  const lotes=[...new Set(S.registros.map(r=>r.lote).filter(Boolean))].sort(ordenNat);
  const jors=[...new Set(S.registros.map(r=>r.jornada_id))].sort().reverse();
  const L2=filtrarRegs();const f=BD.f;
  $('#bdCuerpo').innerHTML=`

function idxPlay(t){let lo=0,hi=PLAY.pts.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(PLAY.pts[m].t<=t)lo=m;else hi=m-1;}return lo;}
function pintarPlay(){
  const P=PLAY.pts,i=idxPlay(PLAY.t),a=P[i],b=P[Math.min(i+1,P.length-1)];
  const k=b.t>a.t?Math.min(1,Math.max(0,(PLAY.t-a.t)/(b.t-a.t))):0;
  const lat=a.lat+(b.lat-a.lat)*k,lng=a.lng+(b.lng-a.lng)*k;
  const ll=P.slice(0,i+1).map(p=>[p.lat,p.lng]);ll.push([lat,lng]);
  PLAY.estela.setLatLngs(ll);PLAY.brillo.setLatLngs(ll);PLAY.marca.setLatLng([lat,lng]);
  let n=0;for(const r of PLAY.regs){const v=r.t<=PLAY.t;if(v)n++;if(v&&!r.on){r.m.addTo(PLAY.capa);r.on=true;}else if(!v&&r.on){PLAY.capa.removeLayer(r.m);r.on=false;}}

/* =====================================================================
   SINCRONIZACIÓN CON GITHUB
   ===================================================================== */
const GH='https://api.github.com';
function errorGH(s,m){
  if(s===401)return 'El token de GitHub no es válido o está vencido.';
  if(s===403)return 'El token no tiene permiso de escritura (Contents: Read and write) o se superó el límite de GitHub. '+m;
  if(s===404)return 'No se encontró el repositorio, la rama o el archivo, o el token no tiene acceso a él. '+m;
  if(s===409)return 'El repositorio de datos está vacío. Créelo con un archivo README.';
  if(s===422)return 'GitHub rechazó la actualización. '+m;
  return `Error de GitHub (${s}). ${m}`;
}
async function ghFetch(ruta,{method='GET',body,accept='application/vnd.github+json'}={}){
  const g=S.cfg.gh;if(!g.token)throw new Error('Falta configurar el token de GitHub.');
  let r;
  try{r=await fetch(`${GH}/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}${ruta}`,{method,cache:'no-store',
    headers:{'Authorization':'Bearer '+g.token,'Accept':accept,'X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},
    body:body?JSON.stringify(body):undefined});}
  catch(e){throw new Error('No hay conexión con GitHub.');}
  if(!r.ok){let m='';try{m=(await r.json()).message||'';}catch(e){}
    const limite=r.status===429||(r.status===403&&(/rate limit/i.test(m)||r.headers.get('x-ratelimit-remaining')==='0'));
    const e=new Error(limite?'GitHub pidió esperar por exceso de solicitudes; se reintentará automáticamente.':errorGH(r.status,m));e.status=r.status;e.limite=limite;
    if(limite){const ra=Number(r.headers.get('retry-after'));const rs=Number(r.headers.get('x-ratelimit-reset'));
      e.esperaSeg=ra>0?ra:(rs>0?Math.max(60,rs-Date.now()/1000):0);}
    throw e;}
  return r;
}
const rutaGH=p=>p.split('/').map(encodeURIComponent).join('/');
function ghRaw(path){return ghFetch(`/contents/${rutaGH(path)}?ref=${encodeURIComponent(S.cfg.gh.rama)}`,{accept:'application/vnd.github.raw+json'});}
async function ghCommit(archivos,mensaje){
  const rama=encodeURIComponent(S.cfg.gh.rama);const tree=[];
  for(const a of archivos){
    const r=await (await ghFetch('/git/blobs',{method:'POST',body:a.b64!=null?{content:a.b64,encoding:'base64'}:{content:textoB64(a.texto),encoding:'base64'}})).json();
    tree.push({path:a.path,mode:'100644',type:'blob',sha:r.sha});
  }
  for(let intento=0;;intento++){
    const ref=await (await ghFetch(`/git/ref/heads/${rama}`)).json();const base=ref.object.sha;
    const com=await (await ghFetch(`/git/commits/${base}`)).json();
    const arbol=await (await ghFetch('/git/trees',{method:'POST',body:{base_tree:com.tree.sha,tree}})).json();
    const nuevo=await (await ghFetch('/git/commits',{method:'POST',body:{message:mensaje,tree:arbol.sha,parents:[base]}})).json();
    try{await ghFetch(`/git/refs/heads/${rama}`,{method:'PATCH',body:{sha:nuevo.sha,force:false}});return nuevo.sha;}
    catch(e){if(e.status!==422||intento>=6)throw e;await esperar((1000+Math.random()*3000)*(intento+1));}
  }
}
function planos(r){

    evaluador:r.evaluador,estado:r.estado,estado_nombre:(estadoDe(r.estado)||{}).n||'',problemas:(r.problemas||[]).join('|'),grado_pc:r.grado_pc,
