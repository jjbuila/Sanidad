<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>/*LEAFLET_CSS*/.persona-ic{background:none;border:0}
.persona{border-radius:50%;border:3px solid #fff;display:grid;place-items:center;box-shadow:0 0 0 2px rgba(0,0,0,.35),0 4px 14px rgba(0,0,0,.45)}
.persona svg{display:block}
.punto.est{border:0!important;border-radius:0!important;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
</style>
<style>/*FUENTES*/</style>
<style>
:root{
  --fondo:#06140f;--panel:rgba(8,25,19,.92);--panel2:#0c2219;--borde:rgba(144,205,241,.18);--borde2:rgba(255,255,255,.10);
  --texto:#eaf5f0;--tenue:#94b6a9;--acento:#22d39a;--acento2:#0f9d6b;--marca:#036545;--naranja:#ee7633;--azul:#2f93d5;--celeste:#90cdf1;
  --rojo:#ff5d5d;--ambar:#ffc53d;--t:'Rajdhani',system-ui,sans-serif;--lat:430px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--fondo);color:var(--texto);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
.tit{font-family:var(--t);font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.tenue{color:var(--tenue)}
.glass{background:var(--panel);border:1px solid var(--borde);backdrop-filter:blur(10px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--borde);background:rgba(255,255,255,.05);border-radius:10px;padding:7px 12px;cursor:pointer;font-family:var(--t);font-weight:700;letter-spacing:.8px;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--acento)}
.btn.prim{background:linear-gradient(135deg,var(--acento),var(--acento2));color:#03140d;border-color:transparent}
.btn.nar{background:linear-gradient(135deg,#ff9a5a,var(--naranja));color:#1d0b00;border-color:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn.mini{padding:4px 8px;font-size:12.5px;border-radius:8px}
input[type=date],input[type=text],input[type=password],select{background:#0a1d16;border:1px solid var(--borde);border-radius:9px;padding:7px 9px;min-width:0}
input:focus,select:focus{outline:2px solid rgba(34,211,154,.45);outline-offset:1px}
label.campo{display:block;font-size:11.5px;color:var(--tenue);text-transform:uppercase;letter-spacing:1px;margin:0 0 3px;font-family:var(--t);font-weight:600}

/* Ingreso */
#login{position:fixed;inset:0;z-index:5000;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(1200px 600px at 20% 0%,rgba(34,211,154,.16),transparent 60%),radial-gradient(900px 500px at 100% 100%,rgba(47,147,213,.16),transparent 60%),var(--fondo)}
#login .caja{width:min(420px,100%);border-radius:22px;padding:26px 24px}
#login img{width:min(260px,70%);display:block;margin:0 auto 6px}
#login h1{text-align:center;margin:4px 0 2px;font-size:26px}
#login .sub{text-align:center;margin:0 0 16px}
#login form{display:grid;gap:12px}
#login input{width:100%;padding:11px 12px;font-size:15px}
#lgMsg{min-height:20px;font-size:13.5px}
#lgVer{text-align:center;font-family:var(--t);letter-spacing:2px;color:var(--tenue);font-size:12px;margin-top:10px}

/* Estructura */
#app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--borde);background:linear-gradient(90deg,rgba(3,101,69,.35),rgba(6,20,15,.9))}
header img.app{height:40px;width:40px;border-radius:10px}
header .empresa{background:#fff;border-radius:10px;padding:4px 10px;display:flex;align-items:center}
header .empresa img{height:28px;width:auto;display:block}
#login .marca-app{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 4px}
#login .marca-app img{width:56px;height:56px;margin:0}
#login input[type=checkbox]{width:auto;padding:0}
header .nombre{font-size:20px;line-height:1}
header .nombre small{display:block;font-size:12px;letter-spacing:2.5px;color:var(--celeste)}
header .esp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--borde);border-radius:999px;padding:4px 10px;font-size:12.5px;background:rgba(0,0,0,.25)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--acento);display:inline-block}
.chip.med i{background:var(--ambar)}.chip.mal i{background:var(--rojo)}
main{display:grid;grid-template-columns:var(--lat) minmax(0,1fr);min-height:0;overflow:hidden}
aside{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;border-right:1px solid var(--borde);background:var(--panel2)}
#filtros{padding:12px 14px;border-bottom:1px solid var(--borde);display:grid;gap:8px}
#filtros .fila{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
#filtros .fila3,#filtros .fila4{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#filtros .fila4{grid-template-columns:repeat(4,minmax(0,1fr))}
#filtros select,#filtros input{width:100%}
#filtros .acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.atajos{display:flex;gap:6px;flex-wrap:wrap}
#prog{height:3px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
#prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acento),var(--celeste));transition:width .2s}
#progTxt{font-size:12.5px;min-height:18px}
nav.tabs{display:flex;border-bottom:1px solid var(--borde);overflow-x:auto}
nav.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:9px 4px;font-size:12.5px;cursor:pointer;font-family:var(--t);font-weight:700;letter-spacing:1px;color:var(--tenue);white-space:nowrap}
nav.tabs button.on{color:var(--texto);border-bottom-color:var(--acento)}
#panel{flex:1;overflow:auto;padding:12px 14px 30px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{border:1px solid var(--borde);border-radius:12px;padding:8px 10px;background:rgba(255,255,255,.03)}
.kpi b{display:block;font-family:var(--t);font-size:22px;line-height:1.1}
.kpi span{font-size:11px;color:var(--tenue);text-transform:uppercase;letter-spacing:.8px}
h3{font-family:var(--t);letter-spacing:1.2px;text-transform:uppercase;font-size:15px;margin:16px 0 8px;color:var(--celeste)}
.barra{display:grid;grid-template-columns:130px 1fr 52px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.barra .b{height:10px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden}
.barra .b i{display:block;height:100%}
table.t{width:100%;border-collapse:collapse;font-size:12.8px}
table.t th{position:sticky;top:-12px;background:#0d261c;text-align:left;font-weight:600;color:var(--tenue);padding:6px 6px;border-bottom:1px solid var(--borde);cursor:pointer;white-space:nowrap;font-size:12px}
table.t th.ord::after{content:' ▾'}table.t th.ord.asc::after{content:' ▴'}
table.t td{padding:6px;border-bottom:1px solid var(--borde2);vertical-align:top}
table.t tr.sel td{background:rgba(34,211,154,.12)}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover td{background:rgba(255,255,255,.04)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.punto{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid rgba(255,255,255,.5)}
.vacio{padding:24px 6px;text-align:center;color:var(--tenue)}
.aviso{border:1px solid rgba(255,197,61,.45);background:rgba(255,197,61,.08);border-radius:12px;padding:10px 12px;font-size:13.5px}
.mapaCaja{position:relative;min-height:0;overflow:hidden}
#mapa{position:absolute;inset:0;background:#0a1712}
.leaflet-container{font:inherit}
.capas{position:absolute;top:10px;right:10px;z-index:900;border-radius:14px;padding:8px 10px;display:grid;gap:4px;font-size:13px}
.capas label{display:flex;gap:6px;align-items:center;cursor:pointer}
.leyenda{position:absolute;left:10px;bottom:24px;z-index:900;border-radius:14px;padding:8px 10px;font-size:11px;max-width:330px;display:grid;grid-template-columns:1fr 1fr;column-gap:10px}
.leyenda b.tit,.leyenda .tenue{grid-column:1/-1}
.leyenda div{margin:2px 0}
.etq-lote{background:rgba(6,20,15,.78);color:#d8efe6;border:1px solid rgba(144,205,241,.35);border-radius:6px;font-family:var(--t);font-weight:700;font-size:12px;padding:0 5px;box-shadow:none}
.etq-lote::before{display:none}
.sin-etq .etq-lote{display:none}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#0b1f17;color:var(--texto);border:1px solid var(--borde)}
.leaflet-popup-content{margin:10px 12px;font-size:13px;min-width:220px}
.leaflet-popup-content b.h{font-family:var(--t);font-size:16px;letter-spacing:.8px}
.leaflet-container a.leaflet-popup-close-button{color:var(--tenue)}
/* Detalle de jornada / reproducción */
#detalle{position:absolute;left:10px;top:10px;z-index:950;width:min(380px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;border-radius:16px;padding:12px 14px}
#detalle .cab{display:flex;align-items:center;gap:8px}
#detalle .cab b{flex:1;font-family:var(--t);font-size:18px;letter-spacing:.8px}
.x{background:none;border:1px solid var(--borde);border-radius:9px;width:30px;height:30px;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13px;margin:8px 0}
.play{display:grid;gap:6px;margin:8px 0;padding:8px;border:1px solid var(--borde);border-radius:12px;background:rgba(0,0,0,.2)}
.play .fila{display:flex;gap:6px;align-items:center}
.play input[type=range]{flex:1;accent-color:var(--acento)}
.play .reloj{font-family:var(--t);font-size:20px;min-width:70px;text-align:center}
/* Fotos */
#fotos{position:fixed;inset:0;z-index:6000;background:rgba(2,8,6,.9);display:flex;align-items:center;justify-content:center;padding:16px}
#fotos .caja{width:min(980px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:14px}
#fotos .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
#fotos img{width:100%;border-radius:10px;display:block;background:#000}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:7000;background:#0b2a1f;border:1px solid var(--acento);border-radius:12px;padding:9px 14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw}
#toast.on{opacity:1}
@media(max-width:900px){
  header .empresa{padding:3px 7px}header .empresa img{height:20px}
  #app{height:auto;min-height:100vh}
  main{grid-template-columns:1fr;grid-template-rows:55vh auto;overflow:visible}
  .mapaCaja{order:-1;min-height:55vh}
  aside{border-right:0;border-top:1px solid var(--borde)}
  #panel{overflow:visible}
  header .nombre small{display:none}
  #hdrUsuario,#chApi{display:none}
  .leyenda{display:none}
  .capas{font-size:12px;padding:6px 8px;gap:2px}
  header{gap:8px;padding:8px 10px}
  header .nombre{font-size:17px}
  #detalle{top:auto;bottom:10px;max-height:70%}
}
</style>
</head>
<body>
<div id="login">
  <div class="caja glass">
    <img src="__LOGO__" alt="Palmas de Tumaco">
    <div class="marca-app"><img src="__APPLOGO__" alt="Logo Sanidad Vegetal"><h1 class="tit" style="margin:0">Visor Web</h1></div>
    <p class="sub tenue">Sanidad Vegetal · Recorridos y diagnósticos sincronizados</p>
    <form id="frmLogin" autocomplete="on">
      <div><label class="campo" for="lgU">Usuario</label><input id="lgU" autocomplete="username" autocapitalize="none" required></div>
      <div><label class="campo" for="lgC">Contraseña</label><input id="lgC" type="password" autocomplete="current-password" required></div>
      <label style="display:flex;gap:8px;align-items:center;font-size:13.5px"><input type="checkbox" id="lgRec"> Recordar en este equipo</label>
      <button class="btn prim" id="lgOk" style="padding:11px">INGRESAR</button>
      <div id="lgMsg"></div>
    </form>
    <p class="tenue" style="font-size:12.5px;margin:6px 0 0">Acceso para administradores y supervisores. Requiere internet: los datos se leen del repositorio privado de GitHub.</p>
    <div id="lgVer">VERSIÓN __VERSION__</div>
  </div>
</div>

<div id="app" hidden>
  <header>
    <img class="app" src="__APPLOGO__" alt="Sanidad Vegetal">
    <div class="nombre tit">Sanidad Vegetal<small>VISOR WEB DE CAMPO</small></div>
    <div class="esp"></div>
    <span class="chip" id="chDatos"><i></i><span id="chDatosTxt">Sin datos</span></span>
    <span class="chip" id="chApi" title="Solicitudes restantes a GitHub en esta hora"><i></i><span id="chApiTxt">API</span></span>
    <span class="empresa"><img src="__LOGO__" alt="Palmas de Tumaco"></span>
    <span class="tenue" id="hdrUsuario"></span>
    <button class="btn mini" id="btSalir">Salir</button>
  </header>
  <main>
    <aside>
      <div id="filtros">
        <div class="fila">
          <div><label class="campo" for="fDesde">Desde</label><input type="date" id="fDesde"></div>
          <div><label class="campo" for="fHasta">Hasta</label><input type="date" id="fHasta"></div>
        </div>
        <div class="acc">
          <div class="atajos"><button class="btn mini" data-dias="0">Hoy</button><button class="btn mini" data-dias="6">7 días</button><button class="btn mini" data-dias="29">30 días</button><button class="btn mini" data-mes="1">Este mes</button></div>
          <button class="btn prim" id="btCargar" style="margin-left:auto">CARGAR</button>
        </div>
        <div class="fila4">
          <div><label class="campo" for="fProg">Programa</label><select id="fProg"><option value="">Todos</option></select></div>
          <div><label class="campo" for="fOp">Operario</label><select id="fOp"><option value="">Todos</option></select></div>
          <div><label class="campo" for="fLote">Lote</label><select id="fLote"><option value="">Todos</option></select></div>
          <div><label class="campo" for="fEst">Estado</label><select id="fEst"><option value="">Todos</option></select></div>
        </div>
        <div id="prog"><b></b></div>
        <div id="progTxt" class="tenue"></div>
      </div>
      <nav class="tabs">
        <button data-tab="resumen" class="on">RESUMEN</button><button data-tab="jornadas">JORNADAS</button><button data-tab="lotes">LOTES</button><button data-tab="secuencias">SECUENCIAS</button><button data-tab="operarios">OPERARIOS</button><button data-tab="diag">DIAGNÓSTICOS</button>
      </nav>
      <div id="panel"></div>
    </aside>
    <div class="mapaCaja">
      <div id="mapa"></div>

        <label><input type="checkbox" id="cLotes" checked> Lotes</label>
        <label><input type="checkbox" id="cRec" checked> Recorridos</label>
        <label><input type="checkbox" id="cDiag" checked> Diagnósticos</label>

        <label><input type="checkbox" id="cPalmas"> Palmas (zoom 17+)</label>
        <label style="margin-top:2px"><select id="cBase" style="padding:3px 6px;font-size:12.5px"><option value="dron">Ortofoto dron</option><option value="no">Sin fondo</option></select></label>
      </div>
      <div class="leyenda glass" id="leyenda"></div>
      <div id="detalle" class="glass" hidden></div>
    </div>
  </main>
</div>
<div id="fotos" hidden><div class="caja glass"><div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><b class="tit" id="fotosTit" style="flex:1;font-size:18px"></b><button class="x" id="fotosX">✕</button></div><div class="g" id="fotosG"></div></div></div>

<script>/*LIB_LEAFLET*/</script>
<script>/*LIB_JSZIP*/</script>
<script>
'use strict';
/* =====================================================================
   VISOR WEB · SANIDAD VEGETAL (Palmas de Tumaco S.A.S.)
   Lee las jornadas sincronizadas por la app de campo en el repositorio
   privado de GitHub. Ingreso con el mismo paquete cifrado de la app
   (datos/acceso.json): solo usuarios con rol administrador o supervisor.
   Los archivos de GitHub no cambian una vez escritos, por eso se guardan
   en caché local por su huella (sha) y solo se descargan una vez.
   ===================================================================== */
const VERSION='__VERSION__';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(n,d=0)=>Number(n||0).toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d});
const ordenNat=(a,b)=>String(a).localeCompare(String(b),'es',{numeric:true});
const hoyISO=(d=new Date())=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10);};
const hhmm=t=>{if(!t)return '—';const d=new Date(t);return isNaN(d)?'—':d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit',hour12:false});};
const minAh=m=>m==null?'—':(m>=60?Math.floor(m/60)+' h '+String(Math.round(m%60)).padStart(2,'0')+' min':Math.round(m)+' min');
function toast(m,ms=3500){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),ms);}
const ESTADOS=[
  {id:'sana',n:'Sana / sin novedad',c:'#2ecc71'},{id:'enferma',n:'Enferma (caso nuevo o activo)',c:'#ff4d4d'},{id:'tratamiento',n:'En recuperación / seguimiento',c:'#ff9f1c'},
  {id:'alta',n:'De alta',c:'#7bed9f'},{id:'erradicada',n:'Erradicada',c:'#9e9e9e'},{id:'novedad',n:'Otra novedad (no fitosanitaria)',c:'#b388ff'},
  {id:'muerta',n:'Muerta',c:'#1a1a1a',leg:1},{id:'faltante',n:'Sitio vacío / faltante',c:'#ffffff',leg:1},{id:'resiembra',n:'Resiembra',c:'#3fa9ff',leg:1}];
const estadoDe=id=>ESTADOS.find(e=>e.id===id);
const COLOR_N1={PC:'#e53935',PE:'#8e24aa',DBP:'#fb8c00',AR:'#ad1457',CER:'#795548',DEF:'#c0ca33',ESP:'#00acc1',HP:'#3949ab',MJ:'#f48fb1',ML:'#212121',MS:'#1e88e5',PA:'#827717',PEST:'#26a69a',RAYO:'#ffffff',YAR:'#33691e'};
const COLOR_ALTA='#00e676';
const codN1=d=>d.n1_codigo||String(d.problemas||'').split('|').filter(Boolean)[0]||'';
function colorD(d){if(!d)return '#999';if(d.estado==='alta')return COLOR_ALTA;return COLOR_N1[codN1(d)]||(estadoDe(d.estado)||{c:'#ccc'}).c;}
const PROBLEMAS={PC:'Pudrición de cogollo (PC)',PE:'Pudrición de estípite (PE)',DBP:'Desprendimiento de bases peciolares (DBP)',AR:'Anillo rojo (AR)',CER:'Cercospora',DEF:'Deficiencias',
  ESP:'Espontánea',HP:'Hoja pequeña',MJ:'Mal de juventud (MJ)',ML:'Marchitez letal (ML)',MS:'Marchitez sorpresiva (MS)',PA:'Palma amarilla',PEST:'Pestalotia',RAYO:'Rayo',YAR:'Yarumo',
  RP:'Rhynchophorus palmarum (picudo)',SA:'Strategus aloeus',LG:'Leptopharsa / Pestalotiopsis',OC:'Opsiphanes cassina',SV:'Sagalassa valida',DF:'Otros defoliadores',RT:'Daño por roedores',DN:'Deficiencia nutricional',OT:'Otro'};
const PALETA=['#22d39a','#2f93d5','#ee7633','#c77dff','#ffd166','#ef476f','#06d6a0','#90cdf1','#f4a261','#a7c957','#ff8fab','#4cc9f0','#e9c46a','#b5179e','#8ac926','#ff595e'];
const colorOp=(()=>{const m=new Map();return u=>{if(!m.has(u))m.set(u,PALETA[m.size%PALETA.length]);return m.get(u);};})();

/* ---------- Almacén local (IndexedDB) ---------- */
let DBP=null;
function db(){if(DBP)return DBP;DBP=new Promise((ok,mal)=>{const r=indexedDB.open('sanidad_visor',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('cache');};r.onsuccess=()=>ok(r.result);r.onerror=()=>mal(r.error);});return DBP;}
async function dget(st,k){const d=await db();return new Promise((ok,mal)=>{const q=d.transaction(st).objectStore(st).get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>mal(q.error);});}
async function dput(st,k,v){const d=await db();return new Promise((ok,mal)=>{const tx=d.transaction(st,'readwrite');tx.objectStore(st).put(v,k);tx.oncomplete=()=>ok();tx.onerror=()=>mal(tx.error);});}
async function ddel(st,k){const d=await db();return new Promise(ok=>{const tx=d.transaction(st,'readwrite');tx.objectStore(st).delete(k);tx.oncomplete=()=>ok();tx.onerror=()=>ok();});}

/* ---------- Cifrado (mismo esquema de la app) ---------- */
const ENC=new TextEncoder(),DEC=new TextDecoder();
const deB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const aB64=u=>{let s='';const b=new Uint8Array(u);for(let i=0;i<b.length;i+=32768)s+=String.fromCharCode.apply(null,b.subarray(i,i+32768));return btoa(s);};
async function kekDe(clave,salt,iter){const base=await crypto.subtle.importKey('raw',ENC.encode(clave),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);}
async function aesDes(k,iv,ct){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},k,ct));}
const desObj=(k,o)=>aesDes(k,deB64(o.iv),deB64(o.ct));
let ACCESO=null,SES=null;
async function llaveEquipo(){let k=await dget('kv','llave');if(!k){k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);await dput('kv','llave',k);}return k;}
async function abrirSesion(u,dkRaw,recordar){
  const e=ACCESO.usuarios.find(x=>x.u===u);if(!e)throw new Error('El usuario ya no está autorizado.');
  const dk=await crypto.subtle.importKey('raw',dkRaw,{name:'AES-GCM'},false,['decrypt']);
  const meta=JSON.parse(DEC.decode(await desObj(dk,e.meta)));
  if(meta.rol!=='admin'&&meta.rol!=='supervisor')throw new Error('Su usuario es de operario. El visor web es solo para administradores y supervisores.');
  const token=DEC.decode(await desObj(dk,ACCESO.token));
  SES={u,nombre:meta.nombre,rol:meta.rol,dk,token,repo:ACCESO.repo};
  if(recordar){const k=await llaveEquipo();const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,ENC.encode(JSON.stringify({u,dk:aB64(dkRaw),paquete:ACCESO.id})));await dput('kv','sesion',{iv,ct});}
}
async function restaurarSesion(){
  const r=await dget('kv','sesion');if(!r||!ACCESO)return false;
  try{const k=await llaveEquipo();const p=JSON.parse(DEC.decode(await aesDes(k,r.iv,r.ct)));
    if(p.paquete!==ACCESO.id){await ddel('kv','sesion');return false;}
    await abrirSesion(p.u,deB64(p.dk),false);return true;}catch(e){await ddel('kv','sesion');return false;}
}

const GHAPI='https://api.github.com';
function errorGH(s,m){
  if(s===401)return 'El token de GitHub no es válido o expiró. Renuévelo desde admin.html.';
  if(s===403)return 'GitHub negó el acceso ('+m+').';
  if(s===404)return 'No se encontró el repositorio o la carpeta de datos.';
  return `Error de GitHub (${s}). ${m}`;
}
async function gh(ruta,accept='application/vnd.github+json'){
  const g=SES.repo;let r;
  try{r=await fetch(`${GHAPI}/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}${ruta}`,{cache:'no-store',
    headers:{'Authorization':'Bearer '+SES.token,'Accept':accept,'X-GitHub-Api-Version':'2022-11-28'}});}
  catch(e){throw new Error('No hay conexión con GitHub.');}
  const rest=r.headers.get('x-ratelimit-remaining');if(rest!=null){const n=Number(rest);$('#chApiTxt').textContent='API '+num(n);$('#chApi').className='chip '+(n>1000?'':n>200?'med':'mal');}
  if(!r.ok){let m='';try{m=(await r.json()).message||'';}catch(e){}const e=new Error(errorGH(r.status,m));e.status=r.status;throw e;}
  return r;
}
/* Árbol por huella: inmutable, se guarda en caché. */
async function arbol(sha){const k='t:'+sha;const c=await dget('cache',k);if(c)return c;
  const t=await (await gh(`/git/trees/${sha}`)).json();const v=t.tree.map(x=>({path:x.path,sha:x.sha,type:x.type,size:x.size}));await dput('cache',k,v);return v;}
async function blobTexto(sha){const k='b:'+sha;const c=await dget('cache',k);if(c)return c;
  const t=await (await gh(`/git/blobs/${sha}`,'application/vnd.github.raw+json')).text();try{await dput('cache',k,t);}catch(e){}return t;}
const ZIPS=new Map();
async function blobZip(sha){if(ZIPS.has(sha))return ZIPS.get(sha);
  const buf=await (await gh(`/git/blobs/${sha}`,'application/vnd.github.raw+json')).arrayBuffer();const z=await JSZip.loadAsync(buf);ZIPS.set(sha,z);return z;}

/* Capa de la ortofoto del dron: zoom 12–17 en teselas sueltas; zoom 18–19 en paquetes (.bin) de 4 o 16 teselas

let IND_ORTO=null;const IND_SETS=new Map();
const IND_P=fetch('teselas/orto/indice.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{IND_ORTO=j;}).catch(()=>{});
function existeOrto(z,x,y,PZ){const I=IND_ORTO;if(!I)return true;const s=z+'';
  if(z<=PZ){if(!IND_SETS.has(s))IND_SETS.set(s,new Set(((I.teselas||{})[s]||[]).map(a=>a[0]+','+a[1])));return IND_SETS.get(s).has(x+','+y);}
  const sh=z-PZ,kk='p'+z;if(!IND_SETS.has(kk))IND_SETS.set(kk,new Set(((I.paquetes||{})[z]||[]).map(a=>a[0]+','+a[1])));return IND_SETS.get(kk).has((x>>sh)+','+(y>>sh));}
function capaOrto(base,v,bounds,PZ){
  PZ=PZ||17;const mem=new Map();
  const paquete=(z,X,Y)=>{const k=z+'/'+X+'_'+Y;if(mem.has(k))return mem.get(k);
    const p=fetch(`${base}p${z}/${X}_${Y}.bin?v=${v}`).then(r=>r.ok?r.arrayBuffer():null).then(buf=>{
      if(!buf)return null;const dv=new DataView(buf);if(dv.getUint32(0)!==0x53565431)return null;const hl=dv.getUint32(4);
      return {buf,h:JSON.parse(new TextDecoder().decode(new Uint8Array(buf,8,hl))),o:8+hl};}).catch(()=>null);
    p.then(x=>{if(!x)mem.delete(k);});mem.set(k,p);if(mem.size>48)mem.delete(mem.keys().next().value);return p;};

    const img=document.createElement('img');img.alt='';img.setAttribute('role','presentation');img.style.visibility='hidden'; // visible solo al cargar: nunca se ve un ícono de imagen rota
    img.onload=()=>{if(img._u){URL.revokeObjectURL(img._u);img._u=null;}img.style.visibility='';done(null,img);};img.onerror=()=>{img.removeAttribute('src');done(null,img);};

      if(c.z<=PZ)img.src=`${base}${c.z}/${c.x}/${c.y}.webp?v=${v}`;
      else{const s=c.z-PZ;paquete(c.z,c.x>>s,c.y>>s).then(b=>{const e=b&&b.h[c.x+','+c.y];if(!e){done(null,img);return;}
        img._u=URL.createObjectURL(new Blob([new Uint8Array(b.buf,b.o+e[0],e[1])],{type:'image/webp'}));img.src=img._u;});}});
    return img;}});
  return new C({maxZoom:22,maxNativeZoom:19,minNativeZoom:12,bounds,attribution:'Ortofoto dron Palmas de Tumaco'});
}

/* ---------- Cartografía (cifrada) ---------- */
let LOTES=null,PALMASZIP=null;const CHUNK=new Map();const PROG=new Map();
function enAnillo(x,y,r){let d=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const [xi,yi]=r[i],[xj,yj]=r[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))d=!d;}return d;}
function loteDe(lat,lng){if(!LOTES)return '';
  for(const f of LOTES.features){let k=f._k;if(!k){let a=1e9,b=1e9,c=-1e9,d=-1e9;const ps=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;for(const p of ps)for(const [x,y] of p[0]){a=Math.min(a,x);b=Math.min(b,y);c=Math.max(c,x);d=Math.max(d,y);}k=f._k=[a,b,c,d];}
    if(lng<k[0]||lng>k[2]||lat<k[1]||lat>k[3])continue;const ps=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;
    for(const p of ps)if(enAnillo(lng,lat,p[0])&&!p.slice(1).some(h=>enAnillo(lng,lat,h)))return f.properties._lote;}
  return '';}
async function cargarCartografia(){
  const c=ACCESO.carto;if(!c)return;

  const buf=new Uint8Array(await (await fetch('datos/'+(c.archivo||'carto.enc'))).arrayBuffer());
  if(DEC.decode(buf.slice(0,4))!=='SPC1')throw new Error('El archivo de cartografía no es válido.');
  const z=await JSZip.loadAsync(await aesDes(SES.dk,buf.slice(4,16),buf.slice(16)));
  LOTES=JSON.parse(await z.file('lotes.geojson').async('string'));
  PALMASZIP=await JSZip.loadAsync(await z.file('palmas.zip').async('arraybuffer'));

  L.geoJSON(LOTES,{renderer:rend,style:{color:'#90cdf1',weight:1.2,fillColor:'#90cdf1',fillOpacity:.04},
    onEachFeature:(f,l)=>{const n=nombre(f.properties);f.properties._lote=n;l.bindTooltip(esc(n),{permanent:true,direction:'center',className:'etq-lote'});
      l.on('click',e=>{L.DomEvent.stopPropagation(e);popupLote(n,e.latlng);});}}).addTo(capaLotes);
  for(const f of LOTES.features){const p=f.properties;PROG.set(p._lote,p.Programa||p.programa||'');f._b=null;}
  const progs=[...new Set([...PROG.values()].filter(Boolean))].sort(ordenNat);

  const lista=LOTES.features.map(f=>f.properties._lote).filter(Boolean).sort(ordenNat);

  try{mapa.fitBounds(L.geoJSON(LOTES).getBounds(),{padding:[20,20],animate:false});}catch(e){}
  mapa.getContainer().classList.toggle('sin-etq',mapa.getZoom()<14);

async function cargar(){
  const d1=$('#fDesde').value,d2=$('#fHasta').value;
  if(!d1||!d2||d1>d2){toast('Revise el rango de fechas.');return;}
  if(fechasEntre(d1,d2).length>370){toast('El rango máximo es de un año.');return;}
  $('#btCargar').disabled=true;cerrarDetalle();
  try{
    progreso(0.02,'Consultando el índice de jornadas en GitHub…');
    let raiz;try{raiz=await (await gh(`/contents/jornadas?ref=${encodeURIComponent(SES.repo.rama)}`)).json();}
    catch(e){if(e.status===404){JOR=[];aplicarFiltros();progreso(1,'Aún no hay jornadas sincronizadas en el repositorio.');return;}throw e;}
    const dias=(Array.isArray(raiz)?raiz:[]).filter(x=>x.type==='dir'&&x.name>=d1&&x.name<=d2).map(x=>({path:x.name,sha:x.sha})).sort((a,b)=>a.path.localeCompare(b.path));
    const archivos=[];
    await enParalelo(dias,6,async dia=>{for(const f of await arbol(dia.sha))archivos.push({...f,dia:dia.path});});
    const geos=archivos.filter(f=>f.type==='blob'&&f.path.endsWith('.geojson'));
    const viejas=archivos.filter(f=>f.type==='tree'); // formato anterior: una carpeta por jornada
    const zips=new Map(archivos.filter(f=>f.path.endsWith('_fotos.zip')).map(f=>[f.dia+'/'+f.path,f.sha]));
    const nuevas=[];let hechos=0;
    await enParalelo(geos,6,async f=>{
      try{const g=JSON.parse(await blobTexto(f.sha));nuevas.push(normalizar(g,f,zips.get(f.dia+'/'+f.path.replace(/\.geojson$/,'_fotos.zip'))));}
      catch(e){console.warn('Jornada ilegible',f.path,e);}
      hechos++;progreso(.05+.95*hechos/(geos.length+viejas.length),`Leyendo jornadas: ${hechos} de ${geos.length+viejas.length}`);});
    await enParalelo(viejas,4,async f=>{
      try{const j=await jornadaCarpeta(f);if(j)nuevas.push(j);}catch(e){console.warn('Jornada (formato anterior) ilegible',f.path,e);}
      hechos++;progreso(.05+.95*hechos/(geos.length+viejas.length),`Leyendo jornadas: ${hechos} de ${geos.length+viejas.length}`);});
    JOR=nuevas.sort((a,b)=>String(b.inicio).localeCompare(String(a.inicio)));
    progreso(.98,'Calculando secuencias por lote…');for(const j of JOR){try{await completarTiempos(j);}catch(e){console.warn('tiempos',j.id,e);}}
    const ops=[...new Map(JOR.map(j=>[j.usuario||j.evaluador,j.evaluador])).entries()].sort((a,b)=>ordenNat(a[1],b[1]));
    const sel=$('#fOp').value;$('#fOp').innerHTML='<option value="">Todos</option>'+ops.map(([u,n])=>`<option value="${esc(u)}" ${u===sel?'selected':''}>${esc(n)}</option>`).join('');
    progreso(1,`${num(JOR.length)} jornada(s) del ${d1} al ${d2} · ${num(dias.length)} día(s) con datos.`);
    $('#chDatosTxt').textContent=`${num(JOR.length)} jornadas`;
    aplicarFiltros(true);
  }catch(e){progreso(0,'⚠ '+e.message);toast(e.message,6000);}
  finally{$('#btCargar').disabled=false;}

/* Formato anterior (versiones 2.1–2.3): carpeta con jornada.json, registros.geojson, recorrido.geojson y fotos/. */
async function jornadaCarpeta(f){
  const t=await arbol(f.sha);const b=n=>t.find(x=>x.path===n&&x.type==='blob');
  const jj=b('jornada.json');if(!jj)return null;
  const h=JSON.parse(await blobTexto(jj.sha));
  const reg=b('registros.geojson')?JSON.parse(await blobTexto(b('registros.geojson').sha)):{features:[]};
  const rec=b('recorrido.geojson')?JSON.parse(await blobTexto(b('recorrido.geojson').sha)):{features:[]};
  const feats=(reg.features||[]).map(x=>({...x,properties:{tipo:'diagnostico',...x.properties}}));
  for(const x of rec.features||[])feats.push({...x,properties:{...x.properties,tipo:'recorrido'}});
  const fd=t.find(x=>x.path==='fotos'&&x.type==='tree');
  const ini=h.inicio,fin=h.fin;
  const head={...h,usuario:h.usuario||'',fecha:f.dia,hora_inicio:hhmm(ini),hora_fin:hhmm(fin),duracion_min:ini&&fin?Math.round((Date.parse(fin)-Date.parse(ini))/60000):null,
    lotes_seleccionados:h.seleccion||[],km:+(Number(h.km)||0).toFixed(3)};
  const j=normalizar({jornada:head,features:feats},{path:f.path,dia:f.dia},null);
  if(fd)j.fotosDir=fd.sha;j.formato='anterior';return j;
}
function normalizar(g,f,zipSha){
  const h=g.jornada||{};const diags=[],paradas=[];let track=null;
  for(const ft of g.features||[]){const p=ft.properties||{};
    if(p.tipo==='diagnostico'&&ft.geometry)diags.push({...p,lng:ft.geometry.coordinates[0],lat:ft.geometry.coordinates[1]});
    else if(p.tipo==='recorrido'&&ft.geometry){const c=ft.geometry.type==='LineString'?ft.geometry.coordinates:[ft.geometry.coordinates];track={c,t:(p.tiempos||[]).map(x=>Date.parse(x)),acc:p.precision_m||[]};}
    else if(p.tipo==='parada'&&ft.geometry)paradas.push({...p,lng:ft.geometry.coordinates[0],lat:ft.geometry.coordinates[1]});}
  const lotes=new Set([...(h.por_lote||[]).map(x=>x.lote),...(h.lotes_seleccionados||[]).map(x=>x.lote),...diags.map(d=>d.lote)].filter(Boolean));
  return {id:h.id||f.path,ruta:f.dia+'/'+f.path,zipSha,fecha:h.fecha||f.dia,evaluador:h.evaluador||'—',usuario:h.usuario||h.evaluador||'—',dispositivo:h.dispositivo,
    inicio:h.inicio,fin:h.fin,hora_inicio:h.hora_inicio||hhmm(h.inicio),hora_fin:h.hora_fin||hhmm(h.fin),duracion_min:h.duracion_min,km:Number(h.km)||0,
    ha:Number(h.ha_recorridas)||0,palmas:Number(h.palmas_visitadas)||0,metodo:h.metodo||'buffer',comp:h.comparativo_buffer||null,
    n_paradas:Number(h.n_paradas)||paradas.length,min_paradas:Number(h.minutos_paradas)||0,min_mov:h.minutos_movimiento,por_lote:h.por_lote||[],
    densidad:h.densidad_palmas_ha||115,app:h.app||'',sincronizado:h.sincronizado,lotes,diags,paradas,track,header:h,secuencias:h.secuencias&&h.secuencias.length?h.secuencias:null,tiempos:h.tiempos||null,
    vel:h.velocidad_kmh!=null?Number(h.velocidad_kmh):(()=>{const m=Number(h.minutos_movimiento)||0,k=Number(h.km)||0;return m>=1&&k>0?+(k/(m/60)).toFixed(2):null;})()};
}
/* ---------- Secuencias por lote ----------
   La app las calcula al finalizar la jornada. Para jornadas antiguas se reconstruyen aquí con el recorrido y los polígonos
   (sin palmas visitadas por secuencia). Tiempo efectivo = total − paradas; el desplazamiento entre lotes es tiempo efectivo. */
const minHM=m=>{if(m==null||isNaN(m))return '—';m=Math.round(Number(m));return Math.floor(m/60)+':'+String(m%60).padStart(2,'0');};
const ETQ_TIPO={desplazamiento_inicial:'Desplazamiento inicial',desplazamiento_final:'Desplazamiento final',desplazamiento:'Desplazamiento'};
function secuenciasDe(j){
  if(j.secuencias)return j.secuencias;
  const tr=j.track;if(!tr||tr.t.length!==tr.c.length||tr.t.length<2||!LOTES)return [];
  const ls=tr.c.map(c=>loteDe(c[1],c[0]));let runs=[];
  ls.forEach((l,i)=>{const r=runs[runs.length-1];if(r&&r.l===l)r.i1=i;else runs.push({l,i0:i,i1:i});});
  const t0=Date.parse(j.inicio)||tr.t[0],t1=Date.parse(j.fin)||tr.t[tr.t.length-1];
  const ini=k=>k===0?Math.min(t0,tr.t[0]):tr.t[runs[k].i0],fin=k=>k===runs.length-1?Math.max(t1,tr.t[tr.t.length-1]):tr.t[runs[k+1].i0];
  let cambio=true;while(cambio&&runs.length>1){cambio=false;for(let k=0;k<runs.length;k++){if(fin(k)-ini(k)>=60000)continue;if(k>0)runs[k-1].i1=runs[k].i1;else runs[1].i0=runs[0].i0;runs.splice(k,1);cambio=true;break;}
    const m=[];for(const r of runs){const u=m[m.length-1];if(u&&u.l===r.l)u.i1=r.i1;else m.push(r);}runs=m;}
  const par=j.paradas.map(p=>({a:Date.parse(p.inicio),b:Date.parse(p.fin)})).filter(p=>p.a&&p.b);let n=0;
  const tv0=Date.parse((j.header||{}).t0_visita)||null;const tvs=[];for(const x of j.por_lote)(x.t_visita||[]).forEach(s=>{if(s!=null&&tv0)tvs.push(tv0+s*1000);});
  const conPalmas=tvs.length>0||Number.isFinite(Number((j.header||{}).palmas_visitadas));
  j.secuencias=runs.map((r,k)=>{const a=ini(k),b=fin(k);let pm=0,np=0;for(const p of par){const s=Math.max(a,p.a),e=Math.min(b,p.b);if(e>s){pm+=e-s;np++;}}
    const dg=j.diags.filter(d=>{const t=Date.parse(d.creado);return t>=a&&t<=b;}).length;
    return {secuencia:r.l?++n:null,tipo:r.l?'lote':'desplazamiento',lote:r.l||'',inicio:new Date(a).toISOString(),fin:new Date(b).toISOString(),hora_inicio:hhmm(a),hora_fin:hhmm(b),
      min_total:+((b-a)/60000).toFixed(1),min_paradas:+(pm/60000).toFixed(1),min_efectivo:+((b-a-pm)/60000).toFixed(1),paradas:np,diagnosticos:dg,reconstruida:true,
      ...(()=>{if(!conPalmas)return {palmas_visitadas:null,ha:null};const ult=k===runs.length-1;const pv=tvs.filter(t=>t>=a&&(t<b||(ult&&t<=b))).length;return {palmas_visitadas:pv,ha:+(pv/(j.densidad||115)).toFixed(2)};})()};});
  return j.secuencias;
}
/* Jornadas sincronizadas antes de la versión con secuencias: traen las palmas visitadas (ids) pero no el momento de la visita.
   Se estima como el primer punto del recorrido a 12 m o menos de la palma (o el más cercano), para repartirlas por secuencia y para la reproducción. */
async function completarTiempos(j){
  const h=j.header||{};const tr=j.track;if(!tr||tr.t.length!==tr.c.length||tr.t.length<2)return;
  if(j.por_lote.some(x=>x.t_visita)&&h.t0_visita)return;
  const con=j.por_lote.filter(x=>(x.ids_palmas_visitadas||[]).length);if(!con.length)return;
  const lat0=tr.c[0][1]*Math.PI/180,KX=111320*Math.cos(lat0),KY=111320;const P=tr.c.map(c=>[c[0]*KX,c[1]*KY]);const t0=tr.t[0];
  for(const x of con){const pos=new Map();for(const a of await chunkLote(x.lote))pos.set(String(a[0]),[a[4]*KX,a[5]*KY]);
    x.t_visita=x.ids_palmas_visitadas.map(id=>{const q=pos.get(String(id));if(!q)return null;let best=-1,bd=1e18;
      for(let i=0;i<P.length;i++){const dx=P[i][0]-q[0],dy=P[i][1]-q[1],d=dx*dx+dy*dy;if(d<=144){best=i;break;}if(d<bd){bd=d;best=i;}}
      return best>=0?Math.round((tr.t[best]-t0)/1000):null;});}
  h.t0_visita=new Date(t0).toISOString();j.tiemposEstimados=true;
}
function filasSecuencias(){const lote=$('#fLote').value;const out=[];
  for(const j of JORF)for(const s of secuenciasDe(j)){const esL=s.tipo==='lote';if(lote&&!esL)continue;if(lote&&s.lote!==lote)continue;if(esL&&!enProg(s.lote))continue;
    out.push({_j:j,fecha:j.fecha,evaluador:j.evaluador,usuario:j.usuario,sec:s.secuencia??0,tipo:s.tipo,lote:esL?s.lote:(ETQ_TIPO[s.tipo]||'Desplazamiento'),ini:s.hora_inicio,fin:s.hora_fin,
      tot:Number(s.min_total)||0,desp:esL?Number(s.min_desplazamiento)||0:0,par:Number(s.min_paradas)||0,efe:Number(s.min_efectivo)||0,vel:s.vel_kmh==null?null:Number(s.vel_kmh),km:Number(s.km)||0,palmas:s.palmas_visitadas,ha:s.ha,diag:s.diagnosticos||0,orden:Date.parse(s.inicio)||0});}
  return out;}
function aplicarFiltros(ajustar){
  const op=$('#fOp').value,lote=$('#fLote').value,est=$('#fEst').value;
  const pr=$('#fProg').value;
  JORF=JOR.filter(j=>(!op||j.usuario===op)&&(!lote||j.lotes.has(lote))&&(!pr||[...j.lotes].some(enProg)));
  DIAGF=[];for(const j of JORF)for(const d of j.diags)if((!lote||d.lote===lote)&&enProg(d.lote)&&(!est||d.estado===est))DIAGF.push({...d,_j:j});
  if(SEL&&!JORF.includes(SEL))cerrarDetalle();
  pintarMapa(ajustar);pintarPanel();dibujarPalmas();
}
['#fOp','#fLote','#fEst'].forEach(s=>$(s).onchange=()=>aplicarFiltros(true));
$('#fProg').onchange=()=>{const pr=$('#fProg').value;const sel=$('#fLote').value;
  const lista=LOTES?LOTES.features.map(f=>f.properties._lote).filter(l=>l&&(!pr||PROG.get(l)===pr)).sort(ordenNat):[];
  $('#fLote').innerHTML='<option value="">Todos</option>'+lista.map(l=>`<option ${l===sel?'selected':''}>${esc(l)}</option>`).join('');aplicarFiltros(true);};
const enProg=l=>{const pr=$('#fProg').value;return !pr||PROG.get(l)===pr;};

/* ---------- Pintar en el mapa ---------- */
function pintarMapa(ajustar){
  capaRec.clearLayers();capaDiag.clearLayers();capaPar.clearLayers();
  const caja=L.latLngBounds([]);const lote=$('#fLote').value;
  for(const j of JORF){
    if(j.track&&j.track.c.length>1){const ll=j.track.c.map(c=>[c[1],c[0]]);
      const pl=L.polyline(ll,{renderer:rend,color:colorOp(j.usuario),weight:3,opacity:.85}).addTo(capaRec);
      pl.on('click',e=>{L.DomEvent.stopPropagation(e);abrirDetalle(j);});pl.bindTooltip(`${esc(j.evaluador)} · ${esc(j.fecha)} ${esc(j.hora_inicio)}–${esc(j.hora_fin)}`,{sticky:true});
      if(!lote)caja.extend(pl.getBounds());}
    for(const p of j.paradas){if(lote&&p.lote!==lote)continue;
      L.circleMarker([p.lat,p.lng],{renderer:rend,radius:7,color:'#fff',weight:2,fillColor:'#ff9f1c',fillOpacity:.95})
        .bindPopup(`<b class="h">⏸ Parada ${esc(p.n||'')}</b><br>${esc(j.evaluador)} · ${esc(j.fecha)}<br>${esc(p.hora_inicio)}–${esc(p.hora_fin)} · <b>${esc(p.duracion_min)} min</b><br>Lote: ${esc(p.lote||'—')}${p.clase?'<br>'+esc(p.clase):''}`).addTo(capaPar);}
  }
  for(const d of DIAGF){
    const m=L.circleMarker([d.lat,d.lng],{renderer:rend,radius:6,color:'#fff',weight:1.5,fillColor:colorD(d),fillOpacity:1}).addTo(capaDiag);
    m.on('click',ev=>{L.DomEvent.stopPropagation(ev);popupDiag(d,ev.latlng);});caja.extend([d.lat,d.lng]);}
  if(lote&&LOTES){const f=LOTES.features.find(x=>x.properties._lote===lote);if(f)caja.extend(L.geoJSON(f).getBounds());}
  if(ajustar&&caja.isValid()){mapa.stop();mapa.fitBounds(caja,{padding:[30,30],maxZoom:18,animate:false});}
}
function etiquetaDiag(d){return [d.lote,d.linea!=null&&d.linea!==''?'L'+d.linea:null,d.palma!=null&&d.palma!==''?'P'+d.palma:null].filter(Boolean).join(' · ');}
function htmlDiag(d){const e=estadoDe(d.estado)||{c:'#ccc',n:d.estado_nombre||d.estado||'—'};
  const probs=String(d.problemas||'').split('|').filter(Boolean).map(p=>PROBLEMAS[p]||p);
  return `<b class="h">${esc(etiquetaDiag(d))}</b><br><span class="punto" style="background:${colorD(d)}"></span><b>${esc(e.n)}</b>
    <div style="margin-top:6px;display:grid;gap:2px">
    ${d.nivel1?`<div><b>Nivel 1:</b> ${esc(d.nivel1)}</div>${d.nivel2?`<div><b>Nivel 2:</b> ${esc(d.nivel2)}</div>`:''}${d.nivel3?`<div><b>Nivel 3:</b> ${esc(d.nivel3)}</div>`:''}`:(probs.length?`<div><b>Problemas:</b> ${esc(probs.join(', '))}</div>`:'')}
    ${d.estado_hongo?`<div><b>Hongo:</b> ${esc(d.estado_hongo)}</div>`:''}${d.cirugia?`<div><b>Cirugía:</b> ${esc(d.cirugia)}</div>`:''}${d.produccion?`<div><b>Producción:</b> ${esc(d.produccion)}</div>`:''}
    ${d.raices_buenas?`<div><b>Raíces buenas:</b> ${esc(d.raices_buenas)}</div>`:''}${d.transitabilidad?`<div><b>Transitabilidad:</b> ${esc(d.transitabilidad)}</div>`:''}
    ${d.grado_pc?`<div><b>Grado PC:</b> ${esc(d.grado_pc)}</div>`:''}${d.severidad?`<div><b>Severidad:</b> ${esc(d.severidad)}</div>`:''}
    ${d.sintomas?`<div><b>Síntomas:</b> ${esc(String(d.sintomas).split('|').join(' / '))}</div>`:''}${d.accion?`<div><b>Acción:</b> ${esc(d.accion)}</div>`:''}
    ${d.observaciones?`<div><b>Observaciones:</b> ${esc(d.observaciones)}</div>`:''}
    <div class="tenue">${esc(d.evaluador||'')} · ${esc(d._j?d._j.fecha:'')} ${esc(hhmm(d.creado))}${d.dist_gps_palma_m!=null?` · GPS a ${num(d.dist_gps_palma_m,1)} m`:''}</div></div>`;}
function popupDiag(d,ll){
  const n=Number(d.n_fotos)||0;
  const pp=L.popup({maxWidth:320}).setLatLng(ll||[d.lat,d.lng]).setContent(htmlDiag(d)+`<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
    ${n?`<button class="btn mini nar" id="ppFotos">📷 Ver ${n} foto(s)</button>`:''}<button class="btn mini" id="ppJor">Ver jornada</button></div>`).openOn(mapa);
  setTimeout(()=>{const f=$('#ppFotos');if(f)f.onclick=()=>verFotos(d);const j=$('#ppJor');if(j)j.onclick=()=>{mapa.closePopup(pp);abrirDetalle(d._j);};},0);
}
function popupLote(l,ll){
  const fil=resumenLotes().find(x=>x.lote===l);
  L.popup().setLatLng(ll).setContent(`<b class="h">Lote ${esc(l)}</b><br>`+(fil?`${num(fil.jornadas)} jornada(s) · ${num(fil.palmas)} palmas visitadas · <b>${num(fil.ha,2)} ha</b><br>${num(fil.diag)} diagnósticos · ${num(fil.enfermas)} enfermas`:'<span class="tenue">Sin recorridos en el periodo cargado.</span>')+
    `<div style="margin-top:8px"><button class="btn mini" id="ppFil">Filtrar por este lote</button></div>`).openOn(mapa);
  setTimeout(()=>{const b=$('#ppFil');if(b)b.onclick=()=>{$('#fLote').value=l;mapa.closePopup();aplicarFiltros(true);};},0);

async function verFotos(d){
  const lista=String(d.fotos||'').split('|').filter(Boolean);if(!lista.length)return;
  const j=d._j;if(!j.zipSha&&!j.fotosDir){toast('No se encontró el archivo de fotos de esta jornada.');return;}
  $('#fotosTit').textContent=etiquetaDiag(d)+' · '+(j.fecha||'');$('#fotosG').innerHTML='<div class="tenue">Descargando fotos de la jornada…</div>';$('#fotos').hidden=false;
  try{const out=[];let leer;
    if(j.zipSha){const z=await blobZip(j.zipSha);leer=async n=>{const f=z.file(n)||z.file(n.replace(/\.jpg$/,''));return f?f.async('arraybuffer'):null;};}
    else{const t=await arbol(j.fotosDir);leer=async n=>{const x=t.find(y=>y.path===n||y.path===n+'.jpg');return x?(await gh(`/git/blobs/${x.sha}`,'application/vnd.github.raw+json')).arrayBuffer():null;};}
    for(const n of lista){const ab=await leer(n);if(!ab)continue;const url=URL.createObjectURL(new Blob([ab],{type:'image/jpeg'}));
      out.push(`<a href="${url}" download="${esc(etiquetaDiag(d).replace(/[^\w-]+/g,'_'))}_${esc(n)}"><img src="${url}" alt="Foto"></a>`);}
    $('#fotosG').innerHTML=out.join('')||'<div class="tenue">Las fotos no están en el archivo de la jornada.</div>';}
  catch(e){$('#fotosG').innerHTML=`<div class="aviso">${esc(e.message)}</div>`;}
}
$('#fotosX').onclick=()=>{$('#fotos').hidden=true;$$('#fotosG img').forEach(i=>URL.revokeObjectURL(i.src));};
$('#fotos').onclick=e=>{if(e.target.id==='fotos')$('#fotosX').click();};

/* ---------- Detalle de jornada y reproducción ---------- */

/* Palmas visitadas de una jornada con el instante de su primera visita (t_visita, desde la versión con secuencias). */
async function palmasVisitadasJ(j){
  const h=j.header||{};const t0=Date.parse(h.t0_visita)||null;const out=[];
  for(const x of j.por_lote){const ids=x.ids_palmas_visitadas||[];if(!ids.length)continue;const tv=x.t_visita||[];
    const pos=new Map();for(const a of await chunkLote(x.lote))pos.set(String(a[0]),[a[5],a[4]]);
    ids.forEach((id,k)=>{const c=pos.get(String(id));if(c)out.push({t:t0&&tv[k]!=null?t0+tv[k]*1000:-Infinity,ll:c,m:null});});}
  return out.sort((a,b)=>a.t-b.t);
}

function ponerT(t){const tr=SEL&&SEL.track;if(!tr)return;PLAY.t=t;
  let i=0;while(i<tr.t.length-1&&tr.t[i+1]<=t)i++;
  const a=tr.c[i],b=tr.c[Math.min(i+1,tr.c.length-1)];const ta=tr.t[i],tb=tr.t[Math.min(i+1,tr.t.length-1)];const k=tb>ta?Math.min(1,Math.max(0,(t-ta)/(tb-ta))):0;
  const pos=[a[1]+(b[1]-a[1])*k,a[0]+(b[0]-a[0])*k];
  PLAY.marca.setLatLng(pos);PLAY.estela.setLatLngs(tr.c.slice(0,i+1).map(c=>[c[1],c[0]]).concat([pos]));
  const sg=$('#pSeg');if(PLAY.on&&sg&&sg.checked)seguirOperario(pos);
  if(PLAY.vis&&PLAY.capaVis){let k=PLAY.visN;const rv=mapa.getZoom()>=19?6:mapa.getZoom()>=18?4.5:3;
    while(k<PLAY.vis.length&&PLAY.vis[k].t<=t){const q=PLAY.vis[k];q.m=estrella(q.ll,{renderer:rend,radius:rv,color:'#0b3d44',weight:1,fillColor:'#4dd0e1',fillOpacity:.95,interactive:false}).addTo(PLAY.capaVis);k++;}
    while(k>0&&PLAY.vis[k-1].t>t){k--;const q=PLAY.vis[k];if(q.m){PLAY.capaVis.removeLayer(q.m);q.m=null;}}
    if(k>PLAY.visN)diagAlFrente(); // los diagnósticos siempre por encima de las palmas visitadas
    PLAY.visN=k;const e=$('#pVis');if(e)e.textContent=num(k);}
  const r=$('#pRel');if(r)r.textContent=hhmm(t);const rg=$('#pRg');if(rg&&!PLAY.arrastre)rg.value=Math.round(1000*(t-tr.t[0])/Math.max(1,tr.t[tr.t.length-1]-tr.t[0]));
}
/* Seguir al operario en la reproducción: lo mantiene centrado en la parte visible del mapa (a la derecha del panel de detalle). */
function seguirOperario(pos){if(mapa.getZoom()<18){mapa.setView(pos,18,{animate:false});}
  const s=mapa.getSize(),mr=mapa.getContainer().getBoundingClientRect(),d=$('#detalle');let x0=0;
  if(d&&!d.hidden){const r=d.getBoundingClientRect();if(r.right>mr.left&&r.right<mr.right-120&&r.bottom>mr.top+s.y*.6)x0=r.right-mr.left;}
  const obj=L.point((x0+s.x)/2,s.y/2),c=mapa.latLngToContainerPoint(pos);

function iniciarPlay(){const tr=SEL&&SEL.track;if(!tr)return;if(PLAY.t>=tr.t[tr.t.length-1])PLAY.t=tr.t[0];PLAY.on=true;$('#pBt').textContent='❚❚';

      <div class="tenue" style="margin-bottom:6px;font-size:12.5px">Cada bloque de trabajo en un lote abre una secuencia (1 RI01, 2 RI02, 3 RI01…). <b>Desplazamiento inicial</b>: del inicio de la jornada a la primera calle trabajada. <b>Desplazamiento entre lotes</b>: se suma a la secuencia del lote al que llega y cuenta como efectivo. <b>Desplazamiento final</b>: de la última palma al fin de la jornada. T. efectivo = T. total − paradas. Tiempos en horas:minutos. Toque una fila para ver la jornada.</div>`+t.html+
      `<div style="margin-top:10px"><button class="btn mini" id="xSec">⬇ CSV secuencias</button></div>`;
    $('#xSec').onclick=()=>csv(`secuencias_${$('#fDesde').value}_${$('#fHasta').value}.csv`,['fecha','usuario','evaluador','sec','tipo','lote','ini','fin','tot','desp','par','efe','km','vel','palmas','ha','diag'],filas.map(x=>({...x,sec:x.sec||'',vel:x.vel==null?'':x.vel})));
  }else if(TAB==='operarios'){
    const t=tabla('tOp',[{k:'evaluador',t:'Operario'},{k:'jornadas',t:'Jorn.',n:1},{k:'secs',t:'Sec.',n:1},{k:'min',t:'T. total',n:1,f:x=>minHM(x.min)},{k:'min_par',t:'Paradas',n:1,f:x=>minHM(x.min_par)},{k:'min_efe',t:'T. efectivo',n:1,f:x=>'<b>'+minHM(x.min_efe)+'</b>'},{k:'d_ini',t:'Despl. inicial',n:1,f:x=>minHM(x.d_ini)},{k:'d_ent',t:'Despl. entre lotes',n:1,f:x=>minHM(x.d_ent)},{k:'d_fin',t:'Despl. final',n:1,f:x=>minHM(x.d_fin)},{k:'km',t:'Km',n:1,f:x=>num(x.km,2)},{k:'vel',t:'Vel. km/h',n:1,f:x=>x.vel==null?'—':num(x.vel,1)},{k:'ha',t:'Ha',n:1,f:x=>num(x.ha,2)},{k:'ha_dia',t:'Ha/día',n:1,f:x=>num(x.ha_dia,2)},{k:'palmas',t:'Palmas',n:1,f:x=>num(x.palmas)},{k:'diag',t:'Diag.',n:1},{k:'lotes',t:'Lotes',n:1}],
      resumenOperarios(),f=>{$('#fOp').value=f.usuario;aplicarFiltros(true);});
    P.innerHTML=`<div class="tenue" style="margin-bottom:6px;font-size:12.5px">Toque un operario para filtrar sus recorridos.</div>`+t.html+`<div style="margin-top:10px"><button class="btn mini" id="xOp">⬇ CSV operarios</button></div>`;
    $('#xOp').onclick=()=>csv(`operarios_${$('#fDesde').value}_${$('#fHasta').value}.csv`,['usuario','evaluador','jornadas','dias','secs','min','min_par','min_efe','d_ini','d_ent','d_fin','km','vel','ha','ha_dia','palmas','diag','lotes'],resumenOperarios().map(x=>({...x,vel:x.vel==null?'':x.vel})));
  }else{
    const filas=DIAGF.map(d=>({_d:d,fecha:d._j.fecha,hora:hhmm(d.creado),palma:etiquetaDiag(d),lote:d.lote,estado:(estadoDe(d.estado)||{n:d.estado_nombre||d.estado}).n,_c:colorD(d),problemas:d.nivel1?[d.n1_codigo||d.nivel1,d.nivel2,d.nivel3].filter(Boolean).join(' › '):String(d.problemas||'').split('|').filter(Boolean).join(', '),evaluador:d.evaluador,fotos:Number(d.n_fotos)||0}));
    const t=tabla('tDiag',[{k:'fecha',t:'Fecha',asc:false},{k:'hora',t:'Hora'},{k:'palma',t:'Palma'},{k:'estado',t:'Estado',f:x=>`<span class="punto" style="background:${x._c}"></span>${esc(x.estado)}`},{k:'problemas',t:'Diagnóstico'},{k:'evaluador',t:'Operario'},{k:'fotos',t:'Fotos',n:1}],
      filas,f=>{mapa.setView([f._d.lat,f._d.lng],Math.max(mapa.getZoom(),19));popupDiag(f._d);});
    P.innerHTML=`<div class="tenue" style="margin-bottom:6px;font-size:12.5px">${num(DIAGF.length)} diagnóstico(s). Toque uno para ubicarlo y ver sus fotos.</div>`+t.html+`<div style="margin-top:10px"><button class="btn mini" id="xDiag">⬇ CSV diagnósticos</button></div>`;$('#xDiag').onclick=()=>csvDiag();
  }
}
function marcarFila(){if(TAB==='jornadas')pintarPanel();}

/* ---------- Exportación ---------- */
function descargar(nombre,contenido,tipo){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([contenido],{type:tipo}));a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function csv(nombre,cols,filas){const q=v=>{if(v==null)return '';const s=typeof v==='number'?String(v).replace('.',','):String(v);return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  descargar(nombre,'﻿'+cols.join(';')+'\r\n'+filas.map(f=>cols.map(c=>q(f[c])).join(';')).join('\r\n'),'text/csv;charset=utf-8');}
function csvJornadas(){csv(`jornadas_${$('#fDesde').value}_${$('#fHasta').value}.csv`,['id','fecha','usuario','evaluador','hora_inicio','hora_fin','duracion_min','km','ha','palmas','diagnosticos','n_paradas','min_paradas','velocidad_kmh','inicio_labor','fin_labor','min_despl_inicial','min_despl_entre_lotes','min_despl_final','metodo','palmas_buffer','lotes'],
  JORF.map(j=>({id:j.id,fecha:j.fecha,usuario:j.usuario,evaluador:j.evaluador,hora_inicio:j.hora_inicio,hora_fin:j.hora_fin,duracion_min:j.duracion_min,km:j.km,ha:j.ha,palmas:j.palmas,diagnosticos:j.diags.length,n_paradas:j.n_paradas,min_paradas:j.min_paradas,velocidad_kmh:j.vel==null?'':j.vel,inicio_labor:(j.tiempos||{}).hora_inicio_labor||'',fin_labor:(j.tiempos||{}).hora_fin_labor||'',min_despl_inicial:(j.tiempos||{}).min_desplazamiento_inicial??'',min_despl_entre_lotes:(j.tiempos||{}).min_desplazamiento_entre_lotes??'',min_despl_final:(j.tiempos||{}).min_desplazamiento_final??'',metodo:j.metodo,palmas_buffer:j.comp?j.comp.palmas_visitadas:'',lotes:[...j.lotes].sort(ordenNat).join(',')})));}
function csvDiag(){const cols=['id','jornada_id','fecha','creado','evaluador','lote','linea','palma','palma_id','estado','estado_nombre','rama','n1_codigo','nivel1','nivel2','nivel3','sintomas','estado_hongo','cirugia','produccion','raices_buenas','transitabilidad','observaciones','problemas','grado_pc','severidad','accion','n_fotos','fotos','lat','lng','dist_gps_palma_m'];
  csv(`diagnosticos_${$('#fDesde').value}_${$('#fHasta').value}.csv`,cols,DIAGF.map(d=>({...d,fecha:d._j.fecha})));}
function geoDeJornadas(js){const feats=[];
  for(const j of js){
    if(j.track&&j.track.c.length)feats.push({type:'Feature',properties:{tipo:'recorrido',jornada_id:j.id,fecha:j.fecha,usuario:j.usuario,evaluador:j.evaluador,hora_inicio:j.hora_inicio,hora_fin:j.hora_fin,km:j.km,ha:j.ha,palmas_visitadas:j.palmas,diagnosticos:j.diags.length,n_paradas:j.n_paradas},
      geometry:j.track.c.length>1?{type:'LineString',coordinates:j.track.c}:{type:'Point',coordinates:j.track.c[0]}});
    for(const d of j.diags){const {_j,lat,lng,...p}=d;feats.push({type:'Feature',properties:{...p,fecha:j.fecha},geometry:{type:'Point',coordinates:[lng,lat]}});}
    for(const p of j.paradas){const {lat,lng,...q}=p;feats.push({type:'Feature',properties:{...q,jornada_id:j.id,evaluador:j.evaluador,fecha:j.fecha},geometry:{type:'Point',coordinates:[lng,lat]}});}}
  return {type:'FeatureCollection',name:'sanidad_visor',features:feats};}

/* ---------- Fechas ---------- */
function ponerRango(dias,mes){const h=new Date();$('#fHasta').value=hoyISO(h);
  $('#fDesde').value=mes?hoyISO(new Date(h.getFullYear(),h.getMonth(),1,12)):hoyISO(new Date(h.getTime()-dias*86400000));}
$$('.atajos button').forEach(b=>b.onclick=()=>{ponerRango(Number(b.dataset.dias||0),!!b.dataset.mes);cargar();});
$('#btCargar').onclick=cargar;

/* ---------- Arranque ---------- */
async function entrar(){
  $('#login').hidden=true;$('#app').hidden=false;mapa.invalidateSize();
  $('#hdrUsuario').textContent=`${SES.nombre} · ${SES.rol==='admin'?'Administrador':'Supervisor'}`;
  try{await cargarCartografia();}catch(e){toast('No se pudo cargar la cartografía: '+e.message,6000);}
  ponerRango(6);await cargar();
}
(async()=>{
  ponerBase();pintarLeyenda();
  $('#fEst').innerHTML='<option value="">Todos</option>'+ESTADOS.map(e=>`<option value="${e.id}">${esc(e.n)}</option>`).join('');
  try{const r=await fetch('datos/acceso.json',{cache:'no-store'});if(r.ok){const j=await r.json();if(j.formato==='sanidad-acceso-1')ACCESO=j;}}catch(e){}
  if(!ACCESO){$('#lgMsg').style.color='var(--rojo)';$('#lgMsg').textContent='No se pudo leer el paquete de acceso. Verifique la conexión a internet.';return;}
  if(await restaurarSesion())await entrar();else setTimeout(()=>$('#lgU').focus(),200);
})();
</script>
